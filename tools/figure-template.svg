<!-- 그림 작도 본보기. 새 그림은 이 틀을 따른다.

   원칙
   1. 그림 안에는 라벨만 둔다. 문장을 넣지 않는다.
      "Pol II가 CTD 인산화로 가공 인자를 모은다" 같은 문장은 캡션으로 옮긴다.
      그림 안에는 "Pol II", "CTD-P", "capping enzyme" 만 남는다.
   2. 지켜야 하는 기준은 하나다. 글자가 문장이 아니어야 한다.
      한 줄 48자 초과, 마침표로 끝남, 한 칸에 두 문장이면 문장으로 본다.
      글자 합계 380자와 text 요소 26개는 권고값이고 표 형태 그림은 넘을 수 있다.
      확인: python3 tools/qa_lesson.py 에 strict 옵션과 수업 ID를 준다.
   3. 설명은 세 곳에 나눠 둔다.
      - 본문의 @fig 캡션      읽는 사람이 보는 설명
      - 이 주석 블록          집필자와 다음 개정자가 보는 설명
      - aria-label            화면 낭독기가 읽는 설명
   4. 패널은 글자 하나로 나눈다. A, B, C. 제목을 길게 달지 않는다.
   5. 말로 설명하지 말고 배치로 보인다.
      순서는 화살표, 대비는 같은 축에 나란히, 양은 크기, 상태는 색.
   6. 라벨은 영어로 쓴다. 한글은 캡션과 이 주석에만 쓴다.
   7. 이 주석 안에는 겹낫표 두 개나 꺾쇠 여는 기호를 쓰지 않는다.
      XML 주석에서 금지된 글자라 파일이 깨진다.

   이 그림이 보이려는 것
   - A 전사 개시에서 preinitiation complex가 쌓이는 순서
   - B 그 결과로 Pol II가 신장으로 넘어가는 전환
   캡션에 쓸 내용: TBP가 DNA를 구부려 자리를 만들고, TFIIH의 두 활성이
   DNA를 풀면서 CTD를 인산화해 Pol II를 풀어 준다는 것.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img"
 aria-label="본보기 그림. A 패널은 TBP에서 TFIIH까지 preinitiation complex가 쌓이는 순서를, B 패널은 CTD 인산화 뒤 Pol II가 개시에서 신장으로 넘어가는 전환을 보인다.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .p{font:700 15px sans-serif;fill:#003c71}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .box{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .hot{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .pol{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="p" x="16" y="28">A</text>
 <path class="dna" d="M40 110 L150 110 q40 0 60 22 q20 22 60 22 L420 154"/>
 <rect class="hot" x="168" y="96" width="46" height="18"/>
 <text class="t" x="174" y="110">TATA</text>
 <ellipse class="box" cx="191" cy="76" rx="30" ry="15"/>
 <text class="t" x="176" y="81">TBP</text>
 <ellipse class="box" cx="258" cy="76" rx="30" ry="15"/>
 <text class="t" x="240" y="81">TFIIB</text>
 <ellipse class="pol" cx="330" cy="72" rx="40" ry="19"/>
 <text class="t" x="310" y="77">Pol II</text>
 <ellipse class="hot" cx="408" cy="76" rx="32" ry="15"/>
 <text class="t" x="388" y="81">TFIIH</text>
 <path class="ar" d="M224 76 L226 76"/>
 <path class="ar" d="M290 74 L288 74"/>
 <text class="t" x="40" y="186">1 TBP</text>
 <text class="t" x="110" y="186">2 TFIIB</text>
 <text class="t" x="190" y="186">3 TFIIF + Pol II</text>
 <text class="t" x="320" y="186">4 TFIIE</text>
 <text class="t" x="400" y="186">5 TFIIH</text>

 <text class="p" x="16" y="236">B</text>
 <ellipse class="pol" cx="110" cy="252" rx="40" ry="19"/>
 <text class="t" x="90" y="257">Pol II</text>
 <text class="t" x="80" y="288">initiation</text>
 <path class="ar" d="M160 252 L250 252"/>
 <text class="t" x="172" y="242">CTD-P</text>
 <ellipse class="pol" cx="300" cy="252" rx="40" ry="19"/>
 <text class="t" x="280" y="257">Pol II</text>
 <text class="t" x="272" y="288">elongation</text>
 <path class="ar" d="M350 252 L430 252"/>
 <text class="t" x="440" y="257">capping, splicing</text>
</svg>
