<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"
 aria-label="Transposition mechanisms: DNA transposons move by cut and paste, LTR and non-LTR retrotransposons move through an RNA intermediate and increase in copy number; the structures of L1 and Alu elements are compared">
 <style>
  .b{fill:#fff;stroke:#c6d2dd;stroke-width:1.6}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .e{fill:#003c71}.r{fill:#9a6700}
  .t{font:11px sans-serif;fill:#16191d}.tb{font:700 12px sans-serif;fill:#003c71}
  .s{font:10px sans-serif;fill:#4a5159}.lv{font:700 11px sans-serif;fill:#8a6300}
  .ar{stroke:#003c71;stroke-width:1.8;fill:none;marker-end:url(#c)}
 </style>
 <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="lv" x="16" y="24">DNA TRANSPOSON — cut and paste</text>
 <line x1="30" y1="56" x2="400" y2="56" stroke="#16191d" stroke-width="2"/>
 <rect class="e" x="120" y="46" width="90" height="20"/><text class="s" x="130" y="60" fill="#fff">transposase</text>
 <path d="M114 40 L120 56 L114 72" fill="none" stroke="#9a6700" stroke-width="2"/>
 <path d="M216 40 L210 56 L216 72" fill="none" stroke="#9a6700" stroke-width="2"/>
 <text class="s" x="96" y="86">inverted repeats</text>
 <path class="ar" d="M210 96 L300 96"/><text class="s" x="214" y="90">excision</text>
 <line x1="30" y1="124" x2="400" y2="124" stroke="#16191d" stroke-width="2"/>
 <rect class="e" x="296" y="114" width="90" height="20"/>
 <text class="s" x="30" y="148">Copy number does not increase. The element leaves a gap at the donor site.</text>

 <text class="lv" x="470" y="24">RETROTRANSPOSON — copy and paste via RNA</text>
 <line x1="486" y1="56" x2="850" y2="56" stroke="#16191d" stroke-width="2"/>
 <rect class="r" x="520" y="46" width="110" height="20"/><text class="s" x="534" y="60" fill="#fff">element</text>
 <path class="ar" d="M576 72 L576 96"/><text class="s" x="586" y="90">transcription</text>
 <rect class="k" x="500" y="100" width="150" height="24" rx="4"/><text class="t" x="534" y="117">RNA intermediate</text>
 <path class="ar" d="M576 128 L576 152"/><text class="s" x="586" y="146">reverse transcription</text>
 <line x1="486" y1="172" x2="850" y2="172" stroke="#16191d" stroke-width="2"/>
 <rect class="r" x="520" y="162" width="110" height="20"/>
 <rect class="r" x="700" y="162" width="110" height="20"/>
 <text class="s" x="700" y="198">new copy</text>
 <text class="s" x="486" y="216">The original stays in place, so copy number rises. Over 40% of the human genome</text>
 <text class="s" x="486" y="232">is made of such repeats.</text>

 <text class="lv" x="16" y="256">STRUCTURE OF L1 AND Alu</text>
 <rect class="b" x="30" y="268" width="400" height="76" rx="6"/>
 <text class="tb" x="44" y="288">LINE-1 (L1)</text><text class="s" x="140" y="288">about 6 kb · autonomous</text>
 <line x1="44" y1="310" x2="410" y2="310" stroke="#16191d" stroke-width="1.6"/>
 <rect x="44" y="300" width="36" height="20" fill="#f2b705"/><text class="s" x="48" y="336">5' UTR</text>
 <rect x="92" y="300" width="100" height="20" fill="#003c71"/><text class="s" x="118" y="336">ORF1</text>
 <rect x="200" y="300" width="160" height="20" fill="#003c71"/><text class="s" x="210" y="336">ORF2 (RT, endonuclease)</text>
 <text class="s" x="368" y="314">AAA</text>

 <rect class="b" x="452" y="268" width="398" height="76" rx="6"/>
 <text class="tb" x="466" y="288">Alu</text><text class="s" x="520" y="288">about 300 bp · non-autonomous, needs L1 machinery</text>
 <line x1="466" y1="310" x2="830" y2="310" stroke="#16191d" stroke-width="1.6"/>
 <rect x="466" y="300" width="120" height="20" fill="#9fc0dc"/>
 <rect x="600" y="300" width="120" height="20" fill="#9fc0dc"/>
 <text class="s" x="500" y="336">left arm</text><text class="s" x="634" y="336">right arm</text>
 <text class="s" x="736" y="314">AAA</text>
</svg>
