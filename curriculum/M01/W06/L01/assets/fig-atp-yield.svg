<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"
     aria-label="ATP yield per glucose by stage, the difference between the two cytosolic NADH shuttles, and a comparison of fermentation with aerobic respiration">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .sub{font:11px sans-serif;fill:#4a5159}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
    .row{stroke:#c6d2dd;stroke-width:1}
    .bar{stroke-width:20;stroke-linecap:butt}
  </style>
  <text class="ttl" x="26" y="24">ATP yield from one molecule of glucose</text>

  <rect class="box" x="26" y="38" width="470" height="236" rx="6"/>
  <text class="hd" x="38" y="60">Stage by stage</text>
  <text class="lab" x="38" y="86">Stage</text>
  <text class="lab" x="250" y="86">Product</text>
  <text class="lab" x="400" y="86">ATP</text>
  <line class="row" x1="38" y1="94" x2="484" y2="94"/>
  <text class="sub" x="38" y="114">Glycolysis</text><text class="sub" x="250" y="114">2 ATP (net)</text><text class="sub" x="400" y="114">2</text>
  <text class="sub" x="38" y="136">Glycolysis</text><text class="sub" x="250" y="136">2 NADH (cytosolic)</text><text class="sub" x="400" y="136">5 or 3</text>
  <text class="sub" x="38" y="158">Pyruvate to acetyl-CoA</text><text class="sub" x="250" y="158">2 NADH</text><text class="sub" x="400" y="158">5</text>
  <text class="sub" x="38" y="180">TCA cycle</text><text class="sub" x="250" y="180">2 GTP</text><text class="sub" x="400" y="180">2</text>
  <text class="sub" x="38" y="202">TCA cycle</text><text class="sub" x="250" y="202">6 NADH</text><text class="sub" x="400" y="202">15</text>
  <text class="sub" x="38" y="224">TCA cycle</text><text class="sub" x="250" y="224">2 FADH2</text><text class="sub" x="400" y="224">3</text>
  <line class="row" x1="38" y1="234" x2="484" y2="234"/>
  <text class="lab" x="38" y="254">TOTAL</text><text class="lab" x="400" y="254">32 or 30</text>
  <text class="sub" x="38" y="268">Conversion used: NADH = 2.5 ATP, FADH2 = 1.5 ATP</text>

  <rect class="hl" x="510" y="38" width="324" height="140" rx="6"/>
  <text class="hd" x="522" y="60">Why two different totals</text>
  <text class="sub" x="522" y="84">Cytosolic NADH cannot cross the inner membrane,</text>
  <text class="sub" x="522" y="100">so only its electrons are shuttled.</text>
  <text class="lab" x="522" y="124">Malate-aspartate shuttle</text>
  <text class="sub" x="522" y="140">liver, heart, kidney: electrons to matrix NAD+, 2.5 ATP</text>
  <text class="lab" x="522" y="162">Glycerol-3-phosphate shuttle</text>
  <text class="sub" x="522" y="176">skeletal muscle, brain: electrons to FAD, 1.5 ATP</text>

  <rect class="box" x="510" y="194" width="324" height="80" rx="6"/>
  <text class="hd" x="522" y="216">Efficiency</text>
  <text class="sub" x="522" y="238">30 ATP x 30.5 kJ/mol = about 915 kJ/mol captured</text>
  <text class="sub" x="522" y="254">out of 2840 kJ/mol available, about 32 percent.</text>
  <text class="sub" x="522" y="268">The remainder leaves as heat.</text>

  <rect class="box" x="26" y="292" width="808" height="118" rx="6"/>
  <text class="hd" x="38" y="314">Fermentation compared with aerobic respiration</text>
  <line class="bar" x1="150" y1="344" x2="176" y2="344" stroke="#c6d2dd"/>
  <text class="lab" x="38" y="348">fermentation</text>
  <text class="sub" x="188" y="348">2 ATP per glucose; few steps, so it is FAST</text>
  <line class="bar" x1="150" y1="378" x2="540" y2="378" stroke="#003c71"/>
  <text class="lab" x="38" y="382">aerobic</text>
  <text class="sub" x="552" y="382">about 30 ATP per glucose, roughly 15 fold more</text>
  <text class="sub" x="38" y="402">In hard exercise the oxygen supply lags behind demand, so muscle leans on glycolysis and exports lactate.</text>
</svg>
