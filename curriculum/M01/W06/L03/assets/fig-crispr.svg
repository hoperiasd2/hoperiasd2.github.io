<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img"
     aria-label="CRISPR-Cas9 mechanism with guide RNA, PAM sequence and double strand break, and the two repair outcomes: non-homologous end joining giving knockout and homology-directed repair giving knock-in">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 11.5px sans-serif;fill:#16191d}
    .sub{font:11px sans-serif;fill:#4a5159}
    .seq{font:700 12px monospace;fill:#16191d}
    .dna{stroke:#16191d;stroke-width:3;fill:none}
    .cas{fill:#fff5d6;stroke:#003c71;stroke-width:2.2}
    .g{stroke:#003c71;stroke-width:2.6;fill:none}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.6}
    .ar{stroke:#16191d;stroke-width:2.2;fill:none;marker-end:url(#ac1)}
    .cut{stroke:#f2b705;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="ac1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
  </defs>
  <text class="ttl" x="26" y="24">CRISPR-Cas9: three components, one cut, two outcomes</text>

  <path class="cas" d="M300 60 q110 -20 150 30 q24 40 -10 66 q-90 24 -150 -10 q-28 -44 10 -86 z"/>
  <text class="lab" x="350" y="110">Cas9 nuclease</text>
  <path class="g" d="M330 140 L330 176 L480 176"/>
  <text class="lab" x="236" y="152">guide RNA</text>
  <text class="sub" x="214" y="168">20 nt target sequence</text>

  <path class="dna" d="M60 196 L800 196"/>
  <path class="dna" d="M60 222 L800 222"/>
  <rect x="330" y="186" width="150" height="46" fill="none" stroke="#003c71" stroke-width="2" stroke-dasharray="5 3"/>
  <text class="sub" x="356" y="252">20 bp protospacer</text>
  <rect x="482" y="186" width="44" height="46" fill="#f2b705" opacity="0.5" stroke="#16191d" stroke-width="1.4"/>
  <text class="seq" x="486" y="214">NGG</text>
  <text class="lab" x="534" y="200">PAM sequence</text>
  <text class="sub" x="534" y="216">must sit next to the target;</text>
  <text class="sub" x="534" y="232">this limits where editing is possible</text>
  <path class="cut" d="M406 180 L406 238"/>
  <text class="lab" x="340" y="276">DOUBLE STRAND BREAK</text>

  <path class="ar" d="M300 286 L190 316"/>
  <path class="ar" d="M500 286 L610 316"/>

  <rect class="box" x="26" y="320" width="382" height="110" rx="6"/>
  <text class="hd" x="38" y="342">NHEJ: non-homologous end joining</text>
  <text class="sub" x="38" y="364">The two ends are rejoined with no template, often adding or</text>
  <text class="sub" x="38" y="380">losing a few bases. In a coding region a change that is not a</text>
  <text class="sub" x="38" y="396">multiple of three causes a frameshift.</text>
  <text class="lab" x="38" y="420">Result: KNOCKOUT. Efficient, and the default outcome.</text>

  <rect class="hl" x="452" y="320" width="382" height="110" rx="6"/>
  <text class="hd" x="464" y="342">HDR: homology-directed repair</text>
  <text class="sub" x="464" y="364">Supply a template DNA matching both sides of the break and</text>
  <text class="sub" x="464" y="380">the cell copies it, inserting the sequence you designed.</text>
  <text class="sub" x="464" y="396">Works mainly in S and G2 phase; much less efficient.</text>
  <text class="lab" x="464" y="420">Result: KNOCK-IN or precise correction of a point mutation.</text>

  <rect class="box" x="26" y="40" width="246" height="104" rx="6"/>
  <text class="hd" x="38" y="62">Origin</text>
  <text class="sub" x="38" y="82">Bacterial and archaeal adaptive</text>
  <text class="sub" x="38" y="98">immunity: fragments of past phage</text>
  <text class="sub" x="38" y="114">DNA are stored in CRISPR repeats</text>
  <text class="sub" x="38" y="130">and transcribed to find the invader.</text>

  <rect class="box" x="568" y="40" width="266" height="104" rx="6"/>
  <text class="hd" x="580" y="62">Limits</text>
  <text class="sub" x="580" y="82">off-target cutting at near-matching sites</text>
  <text class="sub" x="580" y="98">mosaicism within one organism</text>
  <text class="sub" x="580" y="114">large deletions from the break itself</text>
  <text class="sub" x="580" y="130">base editing and prime editing avoid the cut</text>
</svg>
