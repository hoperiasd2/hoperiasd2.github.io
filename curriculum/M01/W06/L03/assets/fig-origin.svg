<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"
 aria-label="Licensing control of replication origins: ORC and MCM2-7 load in G1, CDK and DDK activate the helicase at S phase, and relicensing is blocked until the next G1">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 12px sans-serif;fill:#003c71}
  .s{font:11px sans-serif;fill:#4a5159}.lv{font:700 11px sans-serif;fill:#8a6300}
  .dna{fill:none;stroke:#16191d;stroke-width:2.4}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#o)}
 </style>
 <defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="lv" x="24" y="30">G1 PHASE — licensing</text>
 <path class="dna" d="M24 92 L250 92"/>
 <rect fill="#003c71" x="104" y="80" width="40" height="24" rx="4"/>
 <text class="s" x="110" y="96" fill="#fff">ORC</text>
 <circle fill="#9fc0dc" cx="92" cy="70" r="13"/><circle fill="#9fc0dc" cx="156" cy="70" r="13"/>
 <text class="s" x="76" y="48">MCM2-7 double hexamer</text>
 <text class="t" x="24" y="128">Origin is loaded but inactive.</text>
 <text class="t" x="24" y="146">CDK activity is low in G1,</text>
 <text class="t" x="24" y="164">which is what permits loading.</text>

 <path class="ar" d="M268 92 L326 92"/>
 <text class="s" x="268" y="80">CDK, DDK</text>

 <text class="lv" x="344" y="30">S PHASE — firing</text>
 <path class="dna" d="M344 92 L570 92"/>
 <rect fill="#003c71" x="424" y="80" width="40" height="24" rx="4"/>
 <circle fill="#f2b705" cx="404" cy="70" r="13"/><circle fill="#f2b705" cx="488" cy="70" r="13"/>
 <path class="ar" d="M396 110 L352 110"/><path class="ar" d="M496 110 L540 110"/>
 <text class="t" x="344" y="146">Phosphorylation activates the</text>
 <text class="t" x="344" y="164">helicase; two forks move apart.</text>

 <path class="ar" d="M588 92 L646 92"/>
 <text class="lv" x="664" y="30">AFTER FIRING</text>
 <path class="dna" d="M664 92 L836 92"/>
 <path class="dna" d="M664 112 L836 112"/>
 <text class="t" x="664" y="146">High CDK now blocks any new</text>
 <text class="t" x="664" y="164">loading until the next G1.</text>

 <rect class="k" x="24" y="206" width="812" height="88" rx="8"/>
 <text class="tb" x="42" y="232">Why licensing and firing are separated in time</text>
 <text class="t" x="42" y="256">The same kinase activity that fires an origin also prevents a new MCM complex from being loaded.</text>
 <text class="t" x="42" y="276">Each origin can therefore fire only once per cell cycle, so no segment of the genome is copied twice.</text>
</svg>
