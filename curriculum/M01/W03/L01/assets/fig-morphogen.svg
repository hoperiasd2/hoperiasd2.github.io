<!-- 위치 정보를 만드는 두 방식.

   왼쪽은 형태형성인자 기울기. 신경관 등배 축에서 배쪽 Shh와 등쪽 BMP가
   마주 보는 기울기를 만들고, 세포가 농도를 역치로 읽어 불연속적인 띠가
   생긴다. 역치선을 점선으로 그어 연속에서 불연속으로의 변환을 보인다.
   오른쪽은 Hox 공선성. 염색체상의 순서와 몸의 앞뒤 순서가 같다는 것만
   보이면 되므로 유전자 상자와 몸을 같은 색으로 맞춘다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img"
 aria-label="Two ways of making positional information. On the left, opposing gradients of Shh from the floor plate and BMP from the roof plate across the neural tube, read against thresholds so that a continuous concentration becomes discrete bands of cell fate. On the right, Hox gene colinearity: the order of genes along the chromosome matches the order of body regions from head to tail.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#4a5159}
  .p{font:700 14px sans-serif;fill:#003c71}
  .ax{stroke:#4a5159;stroke-width:2;fill:none}
  .shh{stroke:#b3261e;stroke-width:3;fill:none}
  .bmp{stroke:#1a4f8a;stroke-width:3;fill:none}
  .th{stroke:#8a98a6;stroke-width:1.4;stroke-dasharray:5 4;fill:none}
 </style>
 <text class="p" x="20" y="28">A  opposing gradients</text>
 <line class="ax" x1="60" y1="250" x2="60" y2="60"/>
 <line class="ax" x1="60" y1="250" x2="300" y2="250"/>
 <text class="s" x="18" y="60">dorsal</text>
 <text class="s" x="18" y="254">ventral</text>
 <text class="s" x="150" y="276">concentration</text>
 <path class="shh" d="M240 250 q-120 30 -176 -170"/>
 <text class="t" x="196" y="240">Shh</text>
 <path class="bmp" d="M240 60 q-120 -30 -176 170"/>
 <text class="t" x="196" y="76">BMP</text>
 <line class="th" x1="60" y1="110" x2="300" y2="110"/>
 <line class="th" x1="60" y1="160" x2="300" y2="160"/>
 <line class="th" x1="60" y1="205" x2="300" y2="205"/>
 <rect x="306" y="62" width="26" height="46" fill="#dce6f2" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="306" y="110" width="26" height="48" fill="#e8eef5" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="306" y="160" width="26" height="44" fill="#f7dedc" stroke="#b3261e" stroke-width="1.6"/>
 <rect x="306" y="205" width="26" height="44" fill="#f2c9c5" stroke="#b3261e" stroke-width="1.6"/>
 <text class="s" x="340" y="92">sensory relay</text>
 <text class="s" x="340" y="140">interneuron</text>
 <text class="s" x="340" y="188">motor neuron</text>
 <text class="s" x="340" y="232">floor plate</text>

 <text class="p" x="420" y="28">B  Hox colinearity</text>
 <rect x="430" y="52" width="34" height="22" fill="#dce6f2" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="464" y="52" width="34" height="22" fill="#cfe0ef" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="498" y="52" width="34" height="22" fill="#f2c9c5" stroke="#b3261e" stroke-width="1.6"/>
 <rect x="532" y="52" width="34" height="22" fill="#f7dedc" stroke="#b3261e" stroke-width="1.6"/>
 <text class="s" x="430" y="46">chromosome</text>
 <text class="s" x="430" y="90">3' end</text>
 <text class="s" x="528" y="90">5' end</text>
 <rect x="470" y="120" width="56" height="30" rx="8" fill="#dce6f2" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="470" y="150" width="56" height="30" fill="#cfe0ef" stroke="#1a4f8a" stroke-width="1.6"/>
 <rect x="470" y="180" width="56" height="30" fill="#f2c9c5" stroke="#b3261e" stroke-width="1.6"/>
 <rect x="470" y="210" width="56" height="34" fill="#f7dedc" stroke="#b3261e" stroke-width="1.6"/>
 <text class="s" x="540" y="140">head</text>
 <text class="s" x="540" y="232">tail</text>
 <text class="s" x="420" y="276">same order on both</text>
</svg>
