<!-- 흥분-수축 짝이음의 경로와 세 근육의 차이.

   왼쪽은 공통 경로를 세로로. 막전위에서 Ca 방출, troponin 또는 calmodulin,
   cross-bridge까지. 오른쪽은 세 근육이 갈리는 지점만 나란히 놓는다.
   골격근은 DHPR과 RyR1의 물리적 결합이라 세포 밖 Ca이 필요 없고,
   심근은 들어온 Ca이 더 많은 Ca을 부르며, 평활근은 표적이 calmodulin이다.

   캡션에 적을 것: T세관이 필요한 이유는 확산 거리 문제와 같다는 점.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"
 aria-label="Excitation-contraction coupling. On the left the shared path from membrane depolarisation through the T tubule to calcium release and cross-bridge cycling. On the right the point at which the three muscle types differ: skeletal muscle couples the voltage sensor mechanically to the release channel, cardiac muscle uses entering calcium to trigger further release, and smooth muscle acts through calmodulin.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#4a5159}
  .h{font:700 13px sans-serif;fill:#003c71}
  .b{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .k{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .r{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="h" x="20" y="28">shared path</text>
 <rect class="b" x="20" y="44" width="200" height="30" rx="5"/>
 <text class="t" x="34" y="64">depolarisation</text>
 <path class="ar" d="M120 78 L120 100"/>
 <rect class="b" x="20" y="104" width="200" height="30" rx="5"/>
 <text class="t" x="34" y="124">T tubule carries it inward</text>
 <path class="ar" d="M120 138 L120 160"/>
 <rect class="k" x="20" y="164" width="200" height="30" rx="5"/>
 <text class="t" x="34" y="184">cytosolic Ca rises</text>
 <path class="ar" d="M120 198 L120 220"/>
 <rect class="g" x="20" y="224" width="200" height="30" rx="5"/>
 <text class="t" x="34" y="244">binding site uncovered</text>
 <path class="ar" d="M120 258 L120 280"/>
 <rect class="r" x="20" y="284" width="200" height="30" rx="5"/>
 <text class="t" x="34" y="304">cross-bridge cycling</text>

 <text class="h" x="290" y="28">where they differ</text>
 <rect class="b" x="290" y="44" width="390" height="76" rx="6"/>
 <text class="t" x="304" y="66">skeletal</text>
 <text class="s" x="304" y="88">DHPR touches RyR1 directly</text>
 <text class="s" x="304" y="108">no outside Ca needed</text>
 <rect class="r" x="290" y="130" width="390" height="76" rx="6"/>
 <text class="t" x="304" y="152">cardiac</text>
 <text class="s" x="304" y="174">Ca enters, then triggers more release</text>
 <text class="s" x="304" y="194">outside Ca required</text>
 <rect class="g" x="290" y="216" width="390" height="98" rx="6"/>
 <text class="t" x="304" y="238">smooth</text>
 <text class="s" x="304" y="260">target is calmodulin, not troponin</text>
 <text class="s" x="304" y="280">MLCK phosphorylates myosin</text>
 <text class="s" x="304" y="300">regulation on the thick filament</text>
</svg>
