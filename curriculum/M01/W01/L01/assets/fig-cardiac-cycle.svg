<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="Pressure and volume changes in the four stages of the cardiac cycle: curves for left ventricular, left atrial and aortic pressure, the ventricular volume curve, valve opening and closing, heart sounds, and the same cycle drawn as a pressure volume loop.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .ax{stroke:#16191d;stroke-width:1.6;fill:none}
  .lv{stroke:#b3261e;stroke-width:2.6;fill:none}
  .ao{stroke:#003c71;stroke-width:2.2;fill:none}
  .la{stroke:#2e7d32;stroke-width:2;fill:none}
  .vol{stroke:#8a6300;stroke-width:2.4;fill:none}
  .gl{stroke:#c6d2dd;stroke-width:1.2;stroke-dasharray:4 4}
 </style>

 <text class="th" x="20" y="28">A  Pressure and volume through one cycle (left ventricle)</text>
 <line x1="20" y1="38" x2="540" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="ax" d="M70 230 L70 56 M70 230 L520 230"/>
 <text class="s" x="22" y="150" transform="rotate(-90 32 150)">Pressure (mmHg)</text>
 <text class="m" x="44" y="62">120</text><text class="m" x="50" y="146">60</text><text class="m" x="56" y="228">0</text>

 <line class="gl" x1="150" y1="56" x2="150" y2="300"/>
 <line class="gl" x1="190" y1="56" x2="190" y2="300"/>
 <line class="gl" x1="360" y1="56" x2="360" y2="300"/>
 <line class="gl" x1="400" y1="56" x2="400" y2="300"/>

 <path class="lv" d="M70 222 Q110 216 150 212 L172 92 Q180 72 200 70 Q280 66 360 84 L382 206 Q392 222 440 220 Q480 218 520 214"/>
 <path class="ao" d="M70 128 Q110 136 150 142 L190 72 Q280 64 360 86 L382 94 Q386 84 396 92 Q440 112 520 124"/>
 <path class="la" d="M70 220 Q100 214 130 210 Q150 204 160 216 Q200 226 280 224 Q360 220 400 214 Q460 208 520 204"/>

 <text class="m" x="212" y="60">LV pressure</text>
 <text class="m" x="430" y="110">Aortic pressure</text>
 <text class="m" x="430" y="196">LA pressure</text>

 <path class="ax" d="M70 360 L70 256 M70 360 L520 360"/>
 <text class="s" x="22" y="310" transform="rotate(-90 32 310)">Volume (mL)</text>
 <text class="m" x="44" y="262">120</text><text class="m" x="50" y="358">50</text>
 <path class="vol" d="M70 330 Q110 294 150 268 L190 268 Q280 292 360 348 L400 348 Q460 338 520 300"/>
 <text class="m" x="200" y="286">EDV about 120 mL</text>
 <text class="m" x="300" y="372">ESV about 50 mL</text>

 <text class="m" x="86" y="396">1 Filling</text>
 <text class="m" x="152" y="396">2 Isovol.</text>
 <text class="m" x="156" y="410">contraction</text>
 <text class="m" x="250" y="396">3 Ejection</text>
 <text class="m" x="364" y="396">4 Isovol.</text>
 <text class="m" x="364" y="410">relaxation</text>

 <text class="m" x="130" y="432">S1: mitral closes</text>
 <text class="m" x="356" y="432">S2: aortic closes</text>
 <line x1="150" y1="416" x2="150" y2="424" stroke="#b3261e" stroke-width="2.4"/>
 <line x1="382" y1="416" x2="382" y2="424" stroke="#b3261e" stroke-width="2.4"/>

 <text class="th" x="570" y="28">B  Pressure-volume loop</text>
 <line x1="570" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="ax" d="M608 290 L608 60 M608 290 L856 290"/>
 <text class="s" x="560" y="190" transform="rotate(-90 570 190)">LV pressure</text>
 <text class="s" x="700" y="314">LV volume</text>

 <path d="M640 282 L800 268 L800 110 Q760 92 660 120 L640 282 z" fill="#f7dedc" stroke="#b3261e" stroke-width="2.6"/>
 <text class="m" x="700" y="296">ESV</text>
 <text class="m" x="786" y="296">EDV</text>
 <text class="m" x="700" y="258">1 filling</text>
 <text class="m" x="806" y="200">2 isovolumetric</text>
 <text class="m" x="806" y="214">contraction</text>
 <text class="m" x="674" y="104">3 ejection</text>
 <text class="m" x="604" y="200">4 isovol.</text>
 <text class="m" x="604" y="214">relaxation</text>
 <text class="s" x="600" y="340">Width of the loop = stroke volume (about 70 mL)</text>
 <text class="s" x="600" y="358">Area inside the loop = stroke work</text>
 <text class="s" x="600" y="382">Ejection fraction = SV / EDV = 55 to 70 percent</text>
 <text class="s" x="600" y="406">The ventricle never empties completely, so a rise in</text>
 <text class="s" x="600" y="422">contractility can still increase output</text>
</svg>
