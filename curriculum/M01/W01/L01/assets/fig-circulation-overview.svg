<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="Pulmonary and systemic circuits arranged in series, and the systemic organs arranged in parallel. Oxygen saturation and representative pressures of each segment, with the series capillary beds of liver and kidney.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .ox{stroke:#b3261e;stroke-width:5;fill:none;marker-end:url(#r)}
  .de{stroke:#1a4f8a;stroke-width:5;fill:none;marker-end:url(#b)}
  .org{fill:#fff;stroke:#4a5159;stroke-width:1.8}
 </style>
 <defs>
  <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a4f8a"/></marker>
 </defs>

 <text class="th" x="20" y="28">Two circuits in series; systemic organs in parallel</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="300" y="56" width="260" height="56" rx="10"/>
 <text class="tb" x="368" y="80">Lung capillaries</text>
 <text class="s" x="330" y="100">gas exchange; pressure about 15 mmHg</text>

 <rect class="k" x="330" y="196" width="200" height="130" rx="10"/>
 <text class="tb" x="400" y="218">HEART</text>
 <rect class="bx" x="342" y="228" width="84" height="40" rx="5"/>
 <text class="m" x="356" y="252">RA</text>
 <rect class="bx" x="434" y="228" width="84" height="40" rx="5"/>
 <text class="m" x="448" y="252">LA</text>
 <rect class="bx" x="342" y="272" width="84" height="44" rx="5"/>
 <text class="m" x="356" y="298">RV</text>
 <rect class="bx" x="434" y="272" width="84" height="44" rx="5" stroke-width="4"/>
 <text class="m" x="448" y="298">LV</text>
 <text class="s" x="342" y="340">thin wall</text>
 <text class="s" x="434" y="340">wall about 3x thicker</text>

 <path class="de" d="M384 272 L384 118"/>
 <text class="m" x="236" y="150">pulmonary artery</text>
 <text class="s" x="236" y="166">deoxygenated, 25/8 mmHg</text>
 <path class="ox" d="M476 112 L476 226"/>
 <text class="m" x="492" y="150">pulmonary vein</text>
 <text class="s" x="492" y="166">oxygenated</text>

 <path class="ox" d="M518 294 L600 294 L600 388"/>
 <text class="m" x="606" y="300">aorta</text>
 <text class="s" x="606" y="316">120/80 mmHg</text>
 <text class="s" x="606" y="332">mean about 93</text>

 <g>
  <rect class="org" x="60" y="386" width="92" height="40" rx="6"/><text class="m" x="92" y="410">Brain</text>
  <rect class="org" x="166" y="386" width="92" height="40" rx="6"/><text class="m" x="190" y="410">Heart</text>
  <rect class="org" x="272" y="386" width="92" height="40" rx="6"/><text class="m" x="292" y="410">Muscle</text>
  <rect class="org" x="378" y="386" width="92" height="40" rx="6"/><text class="m" x="402" y="410">Skin</text>
  <rect class="org" x="484" y="386" width="112" height="40" rx="6"/><text class="m" x="494" y="410">Gut, then liver</text>
  <rect class="org" x="610" y="386" width="92" height="40" rx="6"/><text class="m" x="634" y="410">Kidney</text>
 </g>
 <line x1="60" y1="372" x2="702" y2="372" stroke="#b3261e" stroke-width="4"/>
 <line x1="106" y1="372" x2="106" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="212" y1="372" x2="212" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="318" y1="372" x2="318" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="424" y1="372" x2="424" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="540" y1="372" x2="540" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="656" y1="372" x2="656" y2="386" stroke="#b3261e" stroke-width="3"/>
 <line x1="702" y1="372" x2="702" y2="372" stroke="#b3261e" stroke-width="4"/>

 <line x1="60" y1="444" x2="702" y2="444" stroke="#1a4f8a" stroke-width="4"/>
 <line x1="106" y1="426" x2="106" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <line x1="212" y1="426" x2="212" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <line x1="318" y1="426" x2="318" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <line x1="424" y1="426" x2="424" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <line x1="540" y1="426" x2="540" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <line x1="656" y1="426" x2="656" y2="444" stroke="#1a4f8a" stroke-width="3"/>
 <path class="de" d="M60 444 L60 300 L336 300"/>
 <text class="m" x="24" y="462">vena cava, about 0 mmHg</text>

 <rect class="bx" x="724" y="56" width="136" height="130" rx="8"/>
 <text class="tb" x="738" y="80">Series</text>
 <text class="t" x="738" y="102">Flow through the</text>
 <text class="t" x="738" y="120">two circuits must</text>
 <text class="t" x="738" y="138">be equal on average</text>
 <text class="tb" x="738" y="166">Parallel</text>
 <text class="t" x="738" y="184">same oxygen to all</text>

 <rect class="bx" x="724" y="200" width="136" height="150" rx="8"/>
 <text class="tb" x="738" y="224">Two exceptions</text>
 <text class="t" x="738" y="246">Gut to liver through</text>
 <text class="t" x="738" y="264">the hepatic portal</text>
 <text class="t" x="738" y="282">system: two capillary</text>
 <text class="t" x="738" y="300">beds in series</text>
 <text class="t" x="738" y="324">Kidney: glomerular and</text>
 <text class="t" x="738" y="342">peritubular beds, also</text>
</svg>
