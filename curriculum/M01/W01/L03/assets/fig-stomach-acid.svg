<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="Acid secretion by the parietal cell and the gastric mucosal barrier: active transport by the proton potassium ATPase, the chloride shift, autocatalytic activation of pepsinogen, and the pH gradient created by the mucus and bicarbonate layer.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .cell{fill:#e8eff6;stroke:#003c71;stroke-width:2.2}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .arr{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a);marker-start:url(#c)}
  .pump{fill:#fff5d6;stroke:#f2b705;stroke-width:2.4}
  .muc{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#003c71"/></marker>
 </defs>

 <text class="th" x="20" y="28">A  The parietal cell makes HCl</text>
 <line x1="20" y1="38" x2="520" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="cell" x="150" y="70" width="260" height="180" rx="14"/>
 <text class="tb" x="212" y="94">Parietal cell</text>
 <text class="m" x="168" y="128">CO2 + H2O</text>
 <path class="ar" d="M250 124 L300 124"/>
 <text class="s" x="246" y="116">carbonic</text>
 <text class="s" x="246" y="144">anhydrase</text>
 <text class="m" x="308" y="128">H2CO3</text>
 <path class="ar" d="M330 136 L330 162"/>
 <text class="m" x="276" y="180">H+   +   HCO3-</text>

 <rect class="pump" x="132" y="186" width="40" height="34" rx="6"/>
 <text class="m" x="138" y="208">ATP</text>
 <path class="arr" d="M126 176 L80 176"/>
 <text class="m" x="60" y="168">H+ out</text>
 <text class="m" x="60" y="200">K+ in</text>
 <text class="s" x="40" y="236">H+/K+-ATPase:</text>
 <text class="s" x="40" y="252">primary active transport</text>

 <path class="arr" d="M420 192 L470 192"/>
 <text class="m" x="424" y="184">HCO3- to blood</text>
 <text class="m" x="424" y="214">Cl- in</text>
 <path class="ar" d="M156 160 L96 150"/>
 <text class="m" x="46" y="128">Cl- follows</text>

 <text class="m" x="30" y="300">Lumen pH 1 to 2:  HCl complete</text>
 <text class="s" x="30" y="322">Alkaline tide: the HCO3- sent to the blood raises venous pH after a meal.</text>

 <text class="th" x="550" y="28">B  Four cells of the gastric gland</text>
 <line x1="550" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="550" y="54" width="310" height="116" rx="8"/>
 <text class="tb" x="564" y="78">Parietal cell</text>
 <text class="t" x="672" y="78">HCl, intrinsic factor</text>
 <text class="tb" x="564" y="102">Chief cell</text>
 <text class="t" x="672" y="102">pepsinogen</text>
 <text class="tb" x="564" y="126">Mucous cell</text>
 <text class="t" x="672" y="126">mucus, bicarbonate</text>
 <text class="tb" x="564" y="150">G cell</text>
 <text class="t" x="672" y="150">gastrin (a hormone)</text>

 <text class="th" x="550" y="200">C  Autocatalytic activation</text>
 <line x1="550" y1="210" x2="860" y2="210" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="550" y="224" width="130" height="40" rx="7"/>
 <text class="m" x="572" y="248">Pepsinogen</text>
 <path class="ar" d="M686 244 L730 244"/>
 <text class="s" x="684" y="236">HCl</text>
 <rect class="k" x="740" y="224" width="120" height="40" rx="7"/>
 <text class="m" x="778" y="248">Pepsin</text>
 <path class="ar" d="M800 268 q-10 36 -180 10" />
 <text class="s" x="610" y="296">pepsin cleaves more pepsinogen: fast amplification</text>
 <text class="s" x="550" y="318">Storing the enzyme inactive and activating it only in the lumen keeps the cell safe.</text>

 <text class="th" x="20" y="358">D  The mucosal barrier: why the stomach is not digested</text>
 <line x1="20" y1="368" x2="860" y2="368" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="muc" x="30" y="382" width="330" height="20"/>
 <text class="m" x="36" y="397">mucus with bicarbonate</text>
 <rect class="cell" x="30" y="402" width="330" height="22"/>
 <text class="m" x="36" y="418">epithelium with tight junctions</text>
 <text class="m" x="30" y="378">lumen pH 2</text>
 <text class="m" x="250" y="378">surface pH near 7</text>
 <text class="t" x="390" y="392">Five devices: thick mucus, the bicarbonate pH gradient, tight junctions,</text>
 <text class="t" x="390" y="412">epithelial turnover every 3 to 5 days, and prostaglandin, which maintains</text>
 <text class="t" x="390" y="430">mucus and bicarbonate secretion and mucosal flow. NSAIDs remove the last one.</text>
</svg>
