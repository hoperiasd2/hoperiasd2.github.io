<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"
 aria-label="Centres and receptors of respiratory control: location and role of the brainstem respiratory centres, the difference in what central and peripheral chemoreceptors sense, the response curves relating each stimulus to ventilation, and the pathway of the Hering-Breuer reflex.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .ax{stroke:#16191d;stroke-width:1.6;fill:none}
  .cc{stroke:#b3261e;stroke-width:2.6;fill:none}
  .pc{stroke:#2e7d32;stroke-width:2.6;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  Brainstem centres</text>
 <line x1="20" y1="38" x2="300" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="20" y="54" width="280" height="40" rx="7"/>
 <text class="tb" x="34" y="72">Pons: pneumotaxic centre</text>
 <text class="s" x="34" y="88">cuts inspiration short, sets the rate</text>
 <rect class="k" x="20" y="102" width="280" height="40" rx="7"/>
 <text class="tb" x="34" y="120">Medulla: dorsal respiratory group</text>
 <text class="s" x="34" y="136">generates the inspiratory rhythm</text>
 <rect class="bx" x="20" y="150" width="280" height="40" rx="7"/>
 <text class="tb" x="34" y="168">Medulla: ventral respiratory group</text>
 <text class="s" x="34" y="184">drives forced expiration</text>
 <path class="ar" d="M160 196 L160 222"/>
 <rect class="bx" x="20" y="228" width="280" height="36" rx="7"/>
 <text class="tb" x="34" y="252">Diaphragm and intercostal muscles</text>

 <text class="th" x="330" y="28">B  Two sets of chemoreceptors</text>
 <line x1="330" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="k" x="330" y="54" width="250" height="110" rx="8"/>
 <text class="tb" x="344" y="78">Central (medulla)</text>
 <text class="t" x="344" y="102">Senses H+ in the cerebrospinal</text>
 <text class="t" x="344" y="122">fluid. Blood CO2 crosses the</text>
 <text class="t" x="344" y="142">blood-brain barrier and makes</text>
 <text class="t" x="344" y="160">that H+, so it reads PCO2.</text>

 <rect class="bx" x="600" y="54" width="260" height="110" rx="8"/>
 <text class="tb" x="614" y="78">Peripheral (carotid, aortic body)</text>
 <text class="t" x="614" y="102">Senses PO2, PCO2 and H+, but</text>
 <text class="t" x="614" y="122">the oxygen response only becomes</text>
 <text class="t" x="614" y="142">marked once PO2 falls below</text>
 <text class="t" x="614" y="160">about 60 mmHg.</text>

 <text class="th" x="330" y="206">C  Stimulus-response curves</text>
 <line x1="330" y1="216" x2="860" y2="216" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="ax" d="M380 360 L380 232 M380 360 L620 360"/>
 <text class="s" x="336" y="308" transform="rotate(-90 346 308)">Ventilation</text>
 <text class="s" x="436" y="384">Arterial PCO2</text>
 <path class="cc" d="M392 354 L440 324 L500 272 L570 240"/>
 <text class="m" x="462" y="256">steep and linear</text>

 <path class="ax" d="M680 360 L680 232 M680 360 L856 360"/>
 <text class="s" x="712" y="384">Arterial PO2</text>
 <path class="pc" d="M690 252 L740 290 L780 330 L820 352 L850 356"/>
 <text class="m" x="738" y="264">flat until about 60,</text>
 <text class="m" x="738" y="280">then rises steeply</text>
 <line x1="780" y1="232" x2="780" y2="360" stroke="#c6d2dd" stroke-width="1.2" stroke-dasharray="4 4"/>
 <text class="m" x="764" y="376">60</text>

 <text class="th" x="20" y="300">D  Mechanical receptor</text>
 <line x1="20" y1="310" x2="300" y2="310" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="20" y="324" width="280" height="76" rx="8"/>
 <text class="tb" x="34" y="348">Hering-Breuer reflex</text>
 <text class="t" x="34" y="370">Stretch receptors in airway and lung</text>
 <text class="t" x="34" y="390">cut inspiration when tidal volume is</text>
 <text class="s" x="34" y="414">very large. Silent in normal breathing.</text>

 <rect class="k" x="330" y="398" width="530" height="34" rx="7"/>
 <text class="tb" x="344" y="420">At rest, breathing is driven by rising CO2, not by falling oxygen.</text>
</svg>
