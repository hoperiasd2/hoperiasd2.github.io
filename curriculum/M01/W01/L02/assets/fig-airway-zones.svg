<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"
 aria-label="Branching structure of the airway and the division into conducting and respiratory zones, the change in total cross-sectional area and air velocity with generation number, the cell types of the alveolar wall, and the difference between anatomical and alveolar dead space.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .tube{stroke:#003c71;stroke-width:3;fill:none}
  .alv{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .ax{stroke:#16191d;stroke-width:1.6;fill:none}
  .ca{stroke:#2e7d32;stroke-width:2.6;fill:none}
  .vl{stroke:#b3261e;stroke-width:2.6;fill:none}
 </style>

 <text class="th" x="20" y="28">A  Branching and the two zones</text>
 <line x1="20" y1="38" x2="400" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="tube" d="M200 56 L200 100" stroke-width="7"/>
 <text class="m" x="212" y="80">Trachea (gen 0)</text>
 <path class="tube" d="M200 100 L140 140 M200 100 L260 140" stroke-width="5"/>
 <text class="m" x="268" y="136">Bronchi (1 to 3)</text>
 <path class="tube" d="M140 140 L108 176 M140 140 L172 176 M260 140 L228 176 M260 140 L292 176" stroke-width="3"/>
 <text class="m" x="300" y="174">Bronchioles (4 to 16)</text>
 <line x1="36" y1="192" x2="364" y2="192" stroke="#8a6300" stroke-width="2" stroke-dasharray="6 4"/>
 <text class="m" x="36" y="208">Conducting zone ends here: anatomical dead space, about 150 mL</text>

 <path class="tube" d="M108 176 L96 216 M108 176 L120 216 M172 176 L160 216 M172 176 L184 216 M228 176 L216 216 M228 176 L240 216 M292 176 L280 216 M292 176 L304 216" stroke-width="2"/>
 <circle class="alv" cx="96" cy="230" r="11"/><circle class="alv" cx="120" cy="230" r="11"/>
 <circle class="alv" cx="160" cy="230" r="11"/><circle class="alv" cx="184" cy="230" r="11"/>
 <circle class="alv" cx="216" cy="230" r="11"/><circle class="alv" cx="240" cy="230" r="11"/>
 <circle class="alv" cx="280" cy="230" r="11"/><circle class="alv" cx="304" cy="230" r="11"/>
 <text class="m" x="36" y="258">Respiratory zone (17 to 23): about 300 million alveoli, 70 m2</text>

 <text class="th" x="430" y="28">B  Area and velocity by generation</text>
 <line x1="430" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="ax" d="M480 220 L480 56 M480 220 L850 220"/>
 <text class="s" x="600" y="246">Generation number (0 to 23)</text>
 <path class="ca" d="M486 212 L560 208 L640 190 L720 120 L844 68"/>
 <text class="m" x="690" y="110">Total cross-sectional area</text>
 <path class="vl" d="M486 70 L560 100 L640 148 L720 196 L844 214"/>
 <text class="m" x="500" y="64">Air velocity</text>
 <text class="s" x="480" y="268">Each branching halves the diameter but doubles the number,</text>
 <text class="s" x="480" y="286">so total area rises steeply and velocity falls to near zero.</text>
 <text class="s" x="480" y="310">In the respiratory zone air moves by diffusion alone.</text>

 <text class="th" x="20" y="320">C  The alveolar wall</text>
 <line x1="20" y1="330" x2="400" y2="330" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect x="36" y="346" width="340" height="18" fill="#fff5d6" stroke="#f2b705" stroke-width="1.6"/>
 <text class="m" x="42" y="360">Alveolar air</text>
 <rect x="36" y="364" width="340" height="12" fill="#eef3f8" stroke="#6b8ba8" stroke-width="1.4"/>
 <text class="m" x="42" y="392">Type I pneumocyte: thin, covers most of the surface</text>
 <circle cx="300" cy="370" r="9" fill="#f7dedc" stroke="#b3261e" stroke-width="1.6"/>
 <text class="m" x="42" y="410">Type II pneumocyte (shown round): secretes surfactant</text>
 <rect x="36" y="414" width="340" height="12" fill="#f7dedc" stroke="#b3261e" stroke-width="1.4"/>
 <text class="m" x="42" y="436">Capillary: total barrier about 0.5 um thick</text>

 <rect class="bx" x="430" y="330" width="430" height="100" rx="8"/>
 <text class="tb" x="444" y="354">Two kinds of dead space</text>
 <text class="t" x="444" y="378">Anatomical: the conducting zone, where no exchange can occur</text>
 <text class="t" x="444" y="398">Alveolar: alveoli that are ventilated but have no blood flow</text>
 <text class="t" x="444" y="420">Physiologic dead space is the sum of the two</text>
</svg>
