<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="The Laplace relationship and the action of surfactant: the collapse problem that arises when two alveoli of different radius share the same surface tension, how surfactant solves it by changing surface tension with density per area, and the resulting change in the compliance curve.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .alv{fill:#fff;stroke:#b3261e;stroke-width:2.4}
  .sfc{stroke:#f2b705;stroke-width:4;fill:none}
  .ar{stroke:#003c71;stroke-width:2.4;fill:none;marker-end:url(#a)}
  .ax{stroke:#16191d;stroke-width:1.6;fill:none}
  .cn{stroke:#003c71;stroke-width:2.6;fill:none}
  .cl{stroke:#b3261e;stroke-width:2.6;fill:none;stroke-dasharray:7 4}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <rect class="k" x="20" y="48" width="400" height="38" rx="8"/>
 <text class="tb" x="34" y="72">Laplace:  P = 2T / r      collapsing pressure rises as radius falls</text>

 <text class="th" x="20" y="120">A  Without surfactant: the small alveolus empties into the large one</text>
 <line x1="20" y1="130" x2="430" y2="130" stroke="#c6d2dd" stroke-width="1.5"/>

 <circle class="alv" cx="90" cy="200" r="26"/>
 <text class="m" x="72" y="204">r = 1</text>
 <text class="m" x="60" y="248">T = 1, P = 2</text>
 <circle class="alv" cx="250" cy="200" r="52"/>
 <text class="m" x="232" y="204">r = 2</text>
 <text class="m" x="216" y="266">T = 1, P = 1</text>
 <path d="M116 200 L198 200" stroke="#4a5159" stroke-width="3" fill="none"/>
 <path class="ar" d="M130 182 L186 182"/>
 <text class="m" x="130" y="174">air flows to the lower pressure</text>
 <text class="s" x="40" y="294">The small alveolus would collapse completely.</text>

 <text class="th" x="20" y="334">B  With surfactant: T falls as the alveolus shrinks</text>
 <line x1="20" y1="344" x2="430" y2="344" stroke="#c6d2dd" stroke-width="1.5"/>
 <circle class="alv" cx="90" cy="396" r="24"/>
 <path class="sfc" d="M70 396 a20 20 0 0 1 40 0" />
 <text class="m" x="46" y="428">dense film, T = 0.5, P = 1</text>
 <circle class="alv" cx="268" cy="396" r="46"/>
 <path class="sfc" d="M226 396 a42 42 0 0 1 84 0" stroke-dasharray="4 7"/>
 <text class="m" x="218" y="428">spread film, T = 1, P = 1</text>
 <path class="ar" d="M140 380 L204 380"/>
 <text class="m" x="130" y="372">no net flow: pressures are now equal</text>

 <text class="th" x="460" y="120">C  Surfactant and the compliance curve</text>
 <line x1="460" y1="130" x2="860" y2="130" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="ax" d="M510 300 L510 150 M510 300 L850 300"/>
 <text class="s" x="464" y="230" transform="rotate(-90 474 230)">Lung volume</text>
 <text class="s" x="640" y="326">Transpulmonary pressure</text>
 <path class="cn" d="M516 294 Q580 230 660 186 Q740 164 844 158"/>
 <path class="cl" d="M516 298 Q620 288 700 262 Q780 230 844 198"/>
 <text class="m" x="640" y="180">normal (surfactant present)</text>
 <text class="m" x="700" y="282">surfactant lacking: low compliance</text>
 <text class="s" x="510" y="350">Compliance = volume change per unit pressure change.</text>
 <text class="s" x="510" y="368">Low in fibrosis, oedema and surfactant deficiency;</text>
 <text class="s" x="510" y="386">high in emphysema, where elastin is destroyed.</text>

 <rect class="bx" x="460" y="46" width="400" height="60" rx="8"/>
 <text class="tb" x="474" y="68">Surfactant: dipalmitoylphosphatidylcholine</text>
 <text class="t" x="474" y="92">from type II pneumocytes; made from week 24, adequate by 34 to 36</text>
</svg>
