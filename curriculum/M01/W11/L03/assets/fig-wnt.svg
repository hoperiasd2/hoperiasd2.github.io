<!-- Wnt 경로의 두 상태. 라벨만 둔다.
   왼쪽 off 상태. 파괴 복합체가 베타카테닌을 인산화해 분해로 보낸다.
   오른쪽 on 상태. 수용체가 복합체를 해체하고 베타카테닌이 쌓여 핵으로 간다.
   캡션에 쓸 내용: 꺼진 상태를 유지하는 데 에너지가 쓰이고,
   신호는 분해를 멈추는 방식으로 작동한다는 점.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img"
 aria-label="Wnt 경로 그림. 왼쪽은 신호가 없는 상태로 APC와 Axin, CK1, GSK3 베타로 된 파괴 복합체가 베타카테닌을 인산화해 proteasome 분해로 보내고 핵의 TCF가 억제자와 함께 유전자를 꺼 둔 모습, 오른쪽은 Wnt가 Frizzled와 LRP에 결합해 복합체를 해체하면 베타카테닌이 쌓여 핵으로 들어가 TCF와 함께 전사를 켜는 모습을 나란히 보인다.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#50585f}
  .p{font:700 15px sans-serif;fill:#003c71}
  .mem{fill:#e8eef5;stroke:#1a4f8a;stroke-width:2}
  .rec{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .cx{fill:#f2efe6;stroke:#8a8f96;stroke-width:2}
  .bc{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .hot{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .nuc{fill:none;stroke:#1a4f8a;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#r)}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
 </defs>

 <text class="p" x="14" y="26">A</text>
 <text class="s" x="40" y="26">Wnt off</text>
 <rect class="mem" x="20" y="48" width="280" height="22"/>
 <rect class="rec" x="80" y="42" width="22" height="34" rx="3"/>
 <rect class="cx" x="60" y="110" width="180" height="46" rx="8"/>
