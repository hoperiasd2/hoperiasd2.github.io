 <rect class="cx" x="62" y="252" width="44" height="22" rx="4"/>
 <text class="s" x="68" y="268">TCF</text>
 <text class="s" x="118" y="268">off</text>
 <text class="s" x="46" y="316">maintenance costs ATP</text>

