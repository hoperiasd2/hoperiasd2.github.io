 <path class="ar" d="M440 86 L466 104"/>
 <text class="s" x="470" y="148">complex dispersed</text>
 <ellipse class="bc" cx="382" cy="150" rx="26" ry="14"/>
 <ellipse class="bc" cx="382" cy="182" rx="26" ry="14"/>
 <text class="s" x="366" y="154">b-cat</text>
