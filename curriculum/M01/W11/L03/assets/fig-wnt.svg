 <ellipse class="bc" cx="200" cy="133" rx="26" ry="14"/>
 <text class="s" x="184" y="137">b-cat</text>
 <circle class="hot" cx="226" cy="116" r="7"/>
 <text class="s" x="236" y="112">P</text>
 <path class="arr" d="M200 160 L200 196"/>
 <rect class="cx" x="150" y="202" width="100" height="26" rx="6"/>
 <text class="s" x="158" y="220">proteasome</text>
