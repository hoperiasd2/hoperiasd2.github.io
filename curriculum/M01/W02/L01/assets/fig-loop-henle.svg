<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="Countercurrent multiplication in the loop of Henle: the difference in permeability between descending and ascending limb, active transport by NKCC2, stepwise amplification of the gradient, osmolality values in cortex and medulla, urea recycling, and countercurrent exchange in the vasa recta.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .tub{fill:none;stroke:#003c71;stroke-width:9}
  .vas{fill:none;stroke:#b3261e;stroke-width:5}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .wo{stroke:#2e7d32;stroke-width:2.4;fill:none;marker-end:url(#g)}
  .so{stroke:#8a6300;stroke-width:2.4;fill:none;marker-end:url(#y)}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
  <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a6300"/></marker>
 </defs>

 <text class="th" x="20" y="28">A  Countercurrent multiplication</text>
 <line x1="20" y1="38" x2="520" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect x="90" y="60" width="330" height="80" fill="#e8eff6" opacity="0.5"/>
 <rect x="90" y="140" width="330" height="90" fill="#f7dedc" opacity="0.4"/>
 <rect x="90" y="230" width="330" height="90" fill="#f7dedc" opacity="0.7"/>
 <text class="m" x="430" y="104">Cortex 300 mOsm/L</text>
 <text class="m" x="430" y="188">600</text>
 <text class="m" x="430" y="278">Medulla 1200 mOsm/L</text>

 <path class="tub" d="M160 60 L160 300 q30 22 60 0 L220 60"/>
 <text class="m" x="112" y="80">descending</text>
 <text class="m" x="226" y="80">ascending</text>
 <path class="ar" d="M160 72 L160 96"/>
 <path class="ar" d="M220 120 L220 96"/>

 <path class="wo" d="M152 140 L112 140"/>
 <path class="wo" d="M152 220 L112 220"/>
 <path class="wo" d="M152 280 L112 280"/>
 <text class="m" x="60" y="136">water out</text>
 <text class="s" x="34" y="156">permeable to water,</text>
 <text class="s" x="34" y="172">not to solute: the fluid</text>
 <text class="s" x="34" y="188">inside gets more</text>
 <text class="s" x="34" y="204">concentrated</text>

 <path class="so" d="M230 150 L292 150"/>
 <path class="so" d="M230 220 L292 220"/>
 <path class="so" d="M230 280 L292 280"/>
 <text class="m" x="298" y="146">NaCl out (NKCC2)</text>
 <text class="s" x="298" y="172">impermeable to water,</text>
 <text class="s" x="298" y="188">pumps NaCl: the fluid</text>
 <text class="s" x="298" y="204">inside gets diluted,</text>
 <text class="s" x="298" y="220">the interstitium gets</text>
 <text class="s" x="298" y="236">more concentrated</text>

 <text class="s" x="34" y="348">The NaCl the ascending limb pumps out raises interstitial osmolality,</text>
 <text class="s" x="34" y="366">which pulls more water out of the descending limb, which delivers a more</text>
 <text class="s" x="34" y="384">concentrated fluid to the ascending limb. Each pass amplifies the gradient.</text>
 <text class="s" x="34" y="408">One transport step makes a small difference; the loop geometry accumulates it.</text>

 <text class="th" x="550" y="28">B  Urea recycling</text>
 <line x1="550" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="550" y="54" width="310" height="92" rx="8"/>
 <text class="t" x="564" y="78">About half of the deep medullary osmolality is urea,</text>
 <text class="t" x="564" y="98">not NaCl. Urea is reabsorbed from the end of the</text>
 <text class="t" x="564" y="118">collecting duct, re-enters the loop and circulates.</text>
 <text class="s" x="564" y="140">Urea is a component of the concentrating device, not just waste.</text>

 <text class="th" x="550" y="186">C  Countercurrent exchange: vasa recta</text>
 <line x1="550" y1="196" x2="860" y2="196" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="vas" d="M620 212 L620 330 q26 20 52 0 L672 212"/>
 <path class="so" d="M628 250 L600 250"/>
 <path class="so" d="M680 290 L710 290"/>
 <text class="m" x="556" y="246">takes up</text>
 <text class="m" x="716" y="286">gives back</text>
 <text class="s" x="550" y="360">The capillary follows the same hairpin, so it does not wash the</text>
 <text class="s" x="550" y="378">solute out of the interstitium.</text>
 <rect class="k" x="550" y="392" width="310" height="44" rx="8"/>
 <text class="tb" x="564" y="414">Multiplication MAKES the gradient;</text>
 <text class="tb" x="564" y="430">exchange KEEPS it.</text>
</svg>
