<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="Three stages of sex determination and the deciding factor at each: the trigger role of SRY, the action of testosterone and anti-Mullerian hormone that decides the fate of the Wolffian and Mullerian ducts, and the pathway by which DHT determines the external genitalia.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .inh{stroke:#b3261e;stroke-width:2.4;fill:none;marker-end:url(#bar)}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="bar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M6 0 L6 10" stroke="#b3261e" stroke-width="3"/></marker>
 </defs>

 <text class="th" x="20" y="28">Three stages, three deciding factors</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="300" y="54" width="280" height="40" rx="7"/>
 <text class="tb" x="314" y="80">1 Genetic sex, at fertilization: XX or XY</text>
 <path class="ar" d="M440 98 L440 126"/>
 <text class="m" x="450" y="118">SRY on the Y</text>

 <rect class="bx" x="120" y="132" width="260" height="46" rx="7"/>
 <text class="tb" x="134" y="152">SRY expressed (about week 7)</text>
 <text class="m" x="134" y="170">indifferent gonad becomes TESTIS</text>
 <rect class="bx" x="500" y="132" width="260" height="46" rx="7"/>
 <text class="tb" x="514" y="152">SRY absent</text>
 <text class="m" x="514" y="170">indifferent gonad becomes OVARY</text>
 <path class="ar" d="M440 110 L540 130"/>
 <path class="ar" d="M440 110 L340 130"/>
 <text class="s" x="120" y="196">2 Gonadal sex. SRY is a single trigger: it makes a transcription factor</text>
 <text class="s" x="120" y="212">that switches on the testis programme and suppresses the ovarian one.</text>

 <rect class="k" x="40" y="232" width="190" height="46" rx="7"/>
 <text class="m" x="54" y="252">Leydig cells:</text>
 <text class="m" x="54" y="270">TESTOSTERONE</text>
 <rect class="k" x="248" y="232" width="190" height="46" rx="7"/>
 <text class="m" x="262" y="252">Sertoli cells:</text>
 <text class="m" x="262" y="270">anti-Mullerian hormone</text>
 <path class="ar" d="M250 178 L135 228"/>
 <path class="ar" d="M250 178 L343 228"/>

 <path class="ar" d="M135 282 L135 312"/>
 <rect class="bx" x="40" y="318" width="190" height="42" rx="7"/>
 <text class="m" x="54" y="344">Wolffian duct DEVELOPS</text>
 <path class="inh" d="M343 282 L343 312"/>
 <rect class="bx" x="248" y="318" width="190" height="42" rx="7"/>
 <text class="m" x="262" y="344">Mullerian duct REGRESSES</text>
 <text class="s" x="40" y="382">Male development needs BOTH: one to build, one to remove.</text>
 <text class="s" x="40" y="400">epididymis, vas deferens, seminal vesicle</text>

 <rect class="bx" x="500" y="232" width="260" height="128" rx="7"/>
 <text class="tb" x="514" y="256">Neither hormone present</text>
 <text class="t" x="514" y="282">Wolffian duct regresses on its own</text>
 <text class="t" x="514" y="304">Mullerian duct develops: fallopian tube,</text>
 <text class="t" x="514" y="322">uterus, upper vagina</text>
 <text class="s" x="514" y="348">Female internal duct development needs no hormone.</text>

 <text class="th" x="20" y="430">3 Phenotypic sex, external: testosterone is converted by 5-alpha-reductase in the skin to DHT, and DHT builds the male external genitalia. No DHT, and the same tissue becomes female.</text>
 <line x1="20" y1="414" x2="860" y2="414" stroke="#c6d2dd" stroke-width="1.5"/>
</svg>
