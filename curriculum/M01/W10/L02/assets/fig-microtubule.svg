<!-- Microtubule 구조와 동적 불안정성. 라벨만 둔다.
   A 13개 원섬유로 된 관의 단면과 극성, 감마 tubulin 복합체가 마이너스 말단을 고정.
   B 플러스 말단의 GTP 모자와 GDP 형 단위의 굽은 구조, 성장과 붕괴.
   캡션에 쓸 내용: 모자가 사라지면 쌓인 굽힘 장력이 풀려 끝에서부터 붕괴한다는 점.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img"
 aria-label="Microtubule 그림. A 패널은 13개 원섬유로 된 관의 단면과 알파 베타 tubulin 이량체의 배열, 감마 tubulin 고리 복합체가 마이너스 말단을 중심체에 고정하는 모습을, B 패널은 플러스 말단의 GTP 모자가 있는 성장 상태와 모자가 사라져 GDP 형 원섬유가 바깥으로 휘며 붕괴하는 상태를 보인다.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#50585f}
  .p{font:700 15px sans-serif;fill:#003c71}
  .a{fill:#dce6f2;stroke:#1a4f8a;stroke-width:1.6}
  .b{fill:#b9cde4;stroke:#1a4f8a;stroke-width:1.6}
  .cap{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
  .gd{fill:#f2efe6;stroke:#8a8f96;stroke-width:1.6}
  .ring{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
 </style>
