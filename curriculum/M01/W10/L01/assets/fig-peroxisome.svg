<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Peroxisome functions and the Pex5 import cycle for PTS1 cargo">
<defs>
<marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
</defs>
<rect width="880" height="430" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#003c71">Peroxisome: functions and PTS1 import cycle</text>

<circle cx="226" cy="236" r="118" fill="#eef4f8" stroke="#16191d" stroke-width="3"/>
<text x="226" y="200" font-size="13.5" font-weight="bold" fill="#16191d" text-anchor="middle">Peroxisome</text>
<text x="226" y="220" font-size="11.5" fill="#4a5159" text-anchor="middle">single membrane, 0.1–1 um</text>
<text x="226" y="248" font-size="12" fill="#16191d" text-anchor="middle">oxidases make H2O2</text>
<text x="226" y="268" font-size="12" fill="#003c71" text-anchor="middle">catalase: 2 H2O2 to 2 H2O + O2</text>
<text x="226" y="292" font-size="11.5" fill="#4a5159" text-anchor="middle">no electron transport chain,</text>
<text x="226" y="308" font-size="11.5" fill="#4a5159" text-anchor="middle">no ATP synthesis, no genome</text>

<rect x="36" y="56" width="188" height="40" rx="5" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="48" y="74" font-size="11.5" fill="#16191d">cargo with C-terminal</text>
<text x="48" y="90" font-size="11.5" fill="#003c71">PTS1 = Ser-Lys-Leu (SKL)</text>
<circle cx="268" cy="78" r="20" fill="#fff5d6" stroke="#16191d" stroke-width="2"/>
<text x="268" y="82" font-size="11.5" fill="#16191d" text-anchor="middle">Pex5</text>
<line x1="232" y1="78" x2="244" y2="78" stroke="#16191d" stroke-width="2" marker-end="url(#a6)"/>
<path d="M268 100 L268 132" stroke="#16191d" stroke-width="2" marker-end="url(#a6)" fill="none"/>
<rect x="286" y="104" width="128" height="34" rx="4" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="296" y="126" font-size="11.5" fill="#16191d">docks at Pex13 / Pex14</text>
<path d="M276 142 C300 180 300 230 268 258" stroke="#16191d" stroke-width="2" fill="none" marker-end="url(#a6)"/>
<text x="330" y="196" font-size="11.5" fill="#16191d">cargo released inside,</text>
<text x="330" y="212" font-size="11.5" fill="#16191d">already folded</text>
<path d="M250 300 C180 352 110 330 102 240" stroke="#4a5159" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a6)"/>
<text x="96" y="356" font-size="11.5" fill="#4a5159">Pex5 recycled after ubiquitination</text>
<text x="96" y="372" font-size="11.5" fill="#4a5159">and ATP-driven retro-translocation</text>
<text x="40" y="404" font-size="11.5" fill="#16191d">PTS2 (N-terminal, 9 residues) uses Pex7; membrane proteins arrive from the ER</text>

<rect x="468" y="56" width="392" height="200" rx="6" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="484" y="80" font-size="13.5" font-weight="bold" fill="#003c71">Metabolic jobs</text>
<text x="484" y="104" font-size="12" fill="#16191d">· beta-oxidation of very long chain fatty acids</text>
<text x="484" y="122" font-size="11.5" fill="#4a5159">  (C22 and longer; H2O2 instead of FADH2, no ATP yield)</text>
<text x="484" y="144" font-size="12" fill="#16191d">· synthesis of plasmalogens (ether phospholipids)</text>
<text x="484" y="162" font-size="11.5" fill="#4a5159">  ~70% of myelin phospholipid in some species</text>
<text x="484" y="184" font-size="12" fill="#16191d">· first steps of bile acid synthesis, phytanic acid alpha-oxidation</text>
<text x="484" y="206" font-size="12" fill="#16191d">· detoxification of H2O2, glyoxylate transamination</text>
<text x="484" y="228" font-size="12" fill="#16191d">· plants: glyoxylate cycle, photorespiration</text>
<text x="484" y="248" font-size="11.5" fill="#4a5159">Import of folded proteins distinguishes it from the ER route</text>

<rect x="468" y="272" width="392" height="140" rx="6" fill="#fff5d6" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="484" y="296" font-size="13.5" font-weight="bold" fill="#003c71">When import fails</text>
<text x="484" y="320" font-size="12" fill="#16191d">PEX1 / PEX5 / PEX7 loss: Zellweger spectrum</text>
<text x="484" y="338" font-size="11.5" fill="#4a5159">empty peroxisomal ghosts, VLCFA and phytanic acid rise,</text>
<text x="484" y="354" font-size="11.5" fill="#4a5159">plasmalogens fall; severe neurologic disease</text>
<text x="484" y="378" font-size="12" fill="#16191d">ABCD1 loss: X-linked adrenoleukodystrophy</text>
<text x="484" y="396" font-size="11.5" fill="#4a5159">single transporter defect; VLCFA accumulate in brain, adrenal</text>
</svg>
