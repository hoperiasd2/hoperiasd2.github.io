<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Chloroplast compartments compared with the mitochondrion: envelope, stroma, thylakoid membrane and lumen, with Toc and Tic import route">
<defs>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
</defs>
<rect width="880" height="420" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#003c71">Chloroplast: a third membrane system</text>

<rect x="36" y="76" width="400" height="250" rx="110" ry="110" fill="#eef4f8" stroke="#16191d" stroke-width="3"/>
<rect x="52" y="92" width="368" height="218" rx="100" ry="100" fill="#ffffff" stroke="#003c71" stroke-width="3"/>
<g stroke="#2f7d4f" stroke-width="3" fill="#dfeee4">
<rect x="110" y="128" width="104" height="9" rx="4"/>
<rect x="110" y="144" width="104" height="9" rx="4"/>
<rect x="110" y="160" width="104" height="9" rx="4"/>
<rect x="246" y="206" width="104" height="9" rx="4"/>
<rect x="246" y="222" width="104" height="9" rx="4"/>
<rect x="246" y="238" width="104" height="9" rx="4"/>
<rect x="214" y="150" width="34" height="9" rx="4"/>
</g>
<text x="128" y="196" font-size="11.5" fill="#2f7d4f">granum (stacked thylakoids)</text>
<text x="246" y="272" font-size="11.5" fill="#2f7d4f">stroma thylakoid</text>
<text x="300" y="120" font-size="13" font-weight="bold" fill="#16191d">Stroma</text>
<text x="252" y="140" font-size="11.5" fill="#4a5159">cpDNA, Calvin-cycle enzymes,</text>
<text x="252" y="156" font-size="11.5" fill="#4a5159">chloroplast ribosomes</text>
<line x1="60" y1="358" x2="86" y2="320" stroke="#16191d" stroke-width="1.5" marker-end="url(#a5)"/>
<text x="40" y="376" font-size="11.5" fill="#16191d">outer + inner envelope</text>
<text x="40" y="392" font-size="11.5" fill="#4a5159">(Toc and Tic translocases)</text>

<rect x="468" y="60" width="392" height="150" rx="6" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="484" y="84" font-size="13.5" font-weight="bold" fill="#003c71">Import route</text>
<text x="484" y="106" font-size="12" fill="#16191d">N-terminal transit peptide</text>
<line x1="636" y1="101" x2="672" y2="101" stroke="#16191d" stroke-width="1.5" marker-end="url(#a5)"/>
<text x="680" y="106" font-size="12" fill="#16191d">Toc</text>
<line x1="712" y1="101" x2="744" y2="101" stroke="#16191d" stroke-width="1.5" marker-end="url(#a5)"/>
<text x="752" y="106" font-size="12" fill="#16191d">Tic</text>
<text x="484" y="132" font-size="12" fill="#16191d">Stromal processing peptidase (SPP) cuts the</text>
<text x="484" y="150" font-size="12" fill="#16191d">transit peptide in the stroma.</text>
<text x="484" y="176" font-size="12" fill="#16191d">Thylakoid proteins carry a second signal and are</text>
<text x="484" y="194" font-size="12" fill="#16191d">re-exported from the stroma into the membrane.</text>

<rect x="468" y="230" width="392" height="170" rx="6" fill="#fff5d6" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="484" y="254" font-size="13.5" font-weight="bold" fill="#003c71">Mitochondrion vs chloroplast</text>
<text x="484" y="278" font-size="12" fill="#16191d">· both: double envelope, own genome, own ribosomes</text>
<text x="484" y="298" font-size="12" fill="#16191d">· both: post-translational import, N-terminal signal</text>
<text x="484" y="318" font-size="12" fill="#16191d">· chloroplast adds the thylakoid membrane, where</text>
<text x="484" y="336" font-size="12" fill="#16191d">  the proton gradient is made (lumen is acidic)</text>
<text x="484" y="356" font-size="12" fill="#16191d">· genome: ~16.6 kb / 37 genes vs ~120–160 kb / ~150</text>
<text x="484" y="376" font-size="12" fill="#16191d">· plastid family: proplastid, amyloplast, chromoplast</text>
<text x="484" y="394" font-size="11.5" fill="#4a5159">Chloroplast ATP synthase faces the stroma, not the matrix.</text>
</svg>
