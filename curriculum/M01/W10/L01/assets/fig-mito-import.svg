<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Import of nuclear-encoded mitochondrial proteins through Tom, Tim23, Tim22 and SAM complexes">
<defs>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
</defs>
<rect width="880" height="470" fill="#ffffff"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#003c71">Protein import into mitochondria</text>

<rect x="0" y="118" width="880" height="26" fill="#eef4f8" stroke="#16191d" stroke-width="2"/>
<rect x="0" y="242" width="880" height="26" fill="#fff5d6" stroke="#003c71" stroke-width="2"/>
<text x="840" y="110" font-size="12" fill="#4a5159" text-anchor="end">CYTOSOL</text>
<text x="840" y="136" font-size="11.5" fill="#16191d" text-anchor="end">outer membrane</text>
<text x="840" y="196" font-size="12" fill="#4a5159" text-anchor="end">IMS  (positive, low pH)</text>
<text x="840" y="260" font-size="11.5" fill="#003c71" text-anchor="end">inner membrane</text>
<text x="840" y="300" font-size="12" fill="#4a5159" text-anchor="end">MATRIX  (negative, high pH)</text>

<rect x="40" y="48" width="200" height="50" rx="5" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="52" y="68" font-size="11.5" fill="#16191d">Precursor made on a free</text>
<text x="52" y="86" font-size="11.5" fill="#16191d">ribosome, held by Hsp70</text>
<rect x="60" y="100" width="54" height="12" rx="6" fill="#f2b705" stroke="#16191d" stroke-width="1.5"/>
<text x="122" y="111" font-size="11" fill="#003c71">presequence (+ charged, amphiphilic helix)</text>

<rect x="120" y="112" width="52" height="38" rx="4" fill="#ffffff" stroke="#16191d" stroke-width="2"/>
<text x="146" y="166" font-size="12" font-weight="bold" fill="#16191d" text-anchor="middle">Tom40</text>
<text x="146" y="182" font-size="11" fill="#4a5159" text-anchor="middle">+ Tom20/22 receptors</text>

<rect x="120" y="236" width="52" height="38" rx="4" fill="#ffffff" stroke="#003c71" stroke-width="2"/>
<text x="146" y="300" font-size="12" font-weight="bold" fill="#003c71" text-anchor="middle">Tim23</text>
<line x1="146" y1="150" x2="146" y2="234" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<line x1="146" y1="274" x2="146" y2="330" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<rect x="88" y="336" width="120" height="30" rx="4" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="148" y="356" font-size="11.5" fill="#16191d" text-anchor="middle">mtHsp70 + ATP</text>
<rect x="88" y="376" width="120" height="30" rx="4" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="148" y="396" font-size="11.5" fill="#16191d" text-anchor="middle">MPP cuts presequence</text>
<text x="148" y="430" font-size="11.5" fill="#003c71" text-anchor="middle">folded matrix protein</text>
<text x="148" y="448" font-size="11" fill="#4a5159" text-anchor="middle">driven by the membrane potential</text>

<rect x="330" y="236" width="52" height="38" rx="4" fill="#ffffff" stroke="#003c71" stroke-width="2"/>
<text x="356" y="300" font-size="12" font-weight="bold" fill="#003c71" text-anchor="middle">Tim22</text>
<rect x="306" y="112" width="52" height="38" rx="4" fill="#ffffff" stroke="#16191d" stroke-width="2"/>
<text x="332" y="104" font-size="11.5" fill="#16191d" text-anchor="middle">Tom40</text>
<line x1="332" y1="150" x2="346" y2="196" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<text x="352" y="196" font-size="11" fill="#4a5159">Tim9-Tim10 chaperone</text>
<line x1="350" y1="206" x2="356" y2="234" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<text x="356" y="330" font-size="11.5" fill="#003c71" text-anchor="middle">carrier proteins</text>
<text x="356" y="348" font-size="11" fill="#4a5159" text-anchor="middle">(ANT, phosphate carrier)</text>
<text x="356" y="366" font-size="11" fill="#4a5159" text-anchor="middle">inserted into inner membrane</text>

<rect x="520" y="112" width="52" height="38" rx="4" fill="#ffffff" stroke="#16191d" stroke-width="2"/>
<text x="546" y="104" font-size="11.5" fill="#16191d" text-anchor="middle">Tom40</text>
<rect x="596" y="112" width="52" height="38" rx="4" fill="#ffffff" stroke="#16191d" stroke-width="2"/>
<text x="622" y="166" font-size="12" font-weight="bold" fill="#16191d" text-anchor="middle">SAM</text>
<line x1="572" y1="131" x2="594" y2="131" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<text x="622" y="186" font-size="11" fill="#4a5159" text-anchor="middle">beta-barrel proteins</text>
<text x="622" y="202" font-size="11" fill="#4a5159" text-anchor="middle">(porin, Tom40 itself)</text>

<rect x="700" y="236" width="52" height="38" rx="4" fill="#ffffff" stroke="#003c71" stroke-width="2"/>
<text x="726" y="300" font-size="12" font-weight="bold" fill="#003c71" text-anchor="middle">Oxa1</text>
<line x1="726" y1="340" x2="726" y2="278" stroke="#16191d" stroke-width="2" marker-end="url(#a4)"/>
<text x="726" y="358" font-size="11" fill="#4a5159" text-anchor="middle">mtDNA-encoded subunits</text>
<text x="726" y="374" font-size="11" fill="#4a5159" text-anchor="middle">made on mitoribosomes</text>
<text x="726" y="392" font-size="11" fill="#4a5159" text-anchor="middle">are exported from the matrix</text>

<rect x="440" y="30" width="420" height="60" rx="6" fill="#fff5d6" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="456" y="52" font-size="11.5" fill="#16191d">Import is post-translational: the chain crosses as a</text>
<text x="456" y="72" font-size="11.5" fill="#16191d">completed, unfolded polypeptide, not co-translationally.</text>
</svg>
