<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Human mitochondrial genome map with 13 protein genes, 2 rRNAs and 22 tRNAs, and the threshold effect of heteroplasmy">
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
</defs>
<rect width="880" height="420" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#003c71">Human mtDNA and heteroplasmy</text>

<circle cx="200" cy="230" r="128" fill="none" stroke="#c6d2dd" stroke-width="22"/>
<path d="M200 102 A128 128 0 0 1 313 291" fill="none" stroke="#003c71" stroke-width="22"/>
<path d="M313 291 A128 128 0 0 1 128 348" fill="none" stroke="#f2b705" stroke-width="22"/>
<path d="M128 348 A128 128 0 0 1 93 141" fill="none" stroke="#4a5159" stroke-width="22"/>
<text x="200" y="222" font-size="14" font-weight="bold" fill="#16191d" text-anchor="middle">mtDNA</text>
<text x="200" y="244" font-size="12.5" fill="#16191d" text-anchor="middle">16,569 bp, circular</text>
<text x="200" y="264" font-size="12.5" fill="#16191d" text-anchor="middle">37 genes, no introns</text>

<line x1="330" y1="150" x2="296" y2="172" stroke="#003c71" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="336" y="146" font-size="12" fill="#003c71">13 OXPHOS subunits</text>
<text x="336" y="162" font-size="11.5" fill="#4a5159">(7 of complex I, 1 of III, 3 of IV, 2 of V)</text>
<line x1="330" y1="330" x2="300" y2="318" stroke="#f2b705" stroke-width="2" marker-end="url(#a3)"/>
<text x="336" y="330" font-size="12" fill="#16191d">2 rRNAs (12S, 16S)</text>
<line x1="60" y1="372" x2="104" y2="346" stroke="#4a5159" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="22" y="392" font-size="12" fill="#4a5159">22 tRNAs</text>
<line x1="60" y1="92" x2="150" y2="118" stroke="#16191d" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="22" y="84" font-size="12" fill="#16191d">D-loop (control region): origin, promoters</text>

<rect x="440" y="58" width="420" height="124" rx="6" fill="#ffffff" stroke="#c6d2dd" stroke-width="1.5"/>
<text x="456" y="82" font-size="13.5" font-weight="bold" fill="#003c71">Rules of mitochondrial inheritance</text>
<text x="456" y="104" font-size="12" fill="#16191d">· Strictly maternal: sperm mtDNA is degraded</text>
<text x="456" y="124" font-size="12" fill="#16191d">· 10^3–10^4 copies per cell, many per organelle</text>
<text x="456" y="144" font-size="12" fill="#16191d">· Heteroplasmy: wild-type and mutant coexist</text>
<text x="456" y="164" font-size="12" fill="#16191d">· Random segregation at each cell division</text>

<text x="440" y="214" font-size="13.5" font-weight="bold" fill="#003c71">Threshold effect</text>
<rect x="456" y="232" width="364" height="34" fill="#eef4f8" stroke="#c6d2dd" stroke-width="1.5"/>
<rect x="456" y="232" width="236" height="34" fill="#c6d2dd"/>
<line x1="692" y1="222" x2="692" y2="280" stroke="#f2b705" stroke-width="4"/>
<text x="462" y="255" font-size="12" fill="#16191d">mutant mtDNA load</text>
<text x="700" y="300" font-size="12" fill="#16191d">threshold ~60–90%</text>
<text x="456" y="300" font-size="12" fill="#4a5159">no phenotype</text>
<text x="456" y="336" font-size="12" fill="#16191d">Above the threshold, residual OXPHOS capacity</text>
<text x="456" y="356" font-size="12" fill="#16191d">falls below tissue demand and symptoms appear;</text>
<text x="456" y="376" font-size="12" fill="#16191d">the threshold is lowest in nerve, retina, muscle,</text>
<text x="456" y="396" font-size="12" fill="#16191d">heart and the endocrine pancreas.</text>
</svg>
