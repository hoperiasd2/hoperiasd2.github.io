<!-- 재형성 단위의 순서와 RANKL, OPG 체계.

   왼쪽은 네 단계를 가로로. 각 단계 아래 걸리는 시간을 숫자로만 적어
   흡수가 빠르고 형성이 느린 비대칭이 눈에 보이게 한다. 막대 길이로도 보인다.
   오른쪽은 지휘 관계. osteoblast 계열이 RANKL과 OPG를 둘 다 내고
   그 비율이 osteoclast의 운명을 정한다. 약물의 작용 지점을 같은 그림에 둔다.

   캡션에 적을 것: 재형성 빈도가 올라가면 미완성 자리가 늘어 골량이
   순감소한다는 점. 폐경 후 골소실의 기전.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"
 aria-label="Bone remodelling. The four stages run left to right with resorption taking weeks and formation taking months, shown as bars of different length. On the right, osteoblast lineage cells and osteocytes secrete both RANKL and the decoy receptor OPG, and their ratio decides osteoclast activity; denosumab acts like OPG and bisphosphonate acts on the osteoclast itself.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#4a5159}
  .h{font:700 13px sans-serif;fill:#003c71}
  .ob{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .oc{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .cy{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .k{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .no{stroke:#b3261e;stroke-width:2.6;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="h" x="20" y="28">A  one remodelling unit</text>
 <rect class="cy" x="20" y="44" width="70" height="28" rx="4"/>
 <text class="s" x="30" y="63">activation</text>
 <rect class="oc" x="96" y="44" width="80" height="28" rx="4"/>
 <text class="s" x="110" y="63">resorption</text>
 <rect class="k" x="182" y="44" width="56" height="28" rx="4"/>
 <text class="s" x="192" y="63">reversal</text>
 <rect class="ob" x="244" y="44" width="170" height="28" rx="4"/>
 <text class="s" x="300" y="63">formation</text>

 <line x1="96" y1="88" x2="176" y2="88" stroke="#b3261e" stroke-width="8"/>
 <line x1="244" y1="88" x2="414" y2="88" stroke="#1a4f8a" stroke-width="8"/>
 <text class="s" x="104" y="110">2 to 3 weeks</text>
 <text class="s" x="290" y="110">about 3 months</text>
 <text class="t" x="20" y="140">resorption fast, formation slow</text>

 <text class="h" x="20" y="186">B  who commands</text>
 <ellipse class="ob" cx="110" cy="232" rx="78" ry="26"/>
 <text class="t" x="56" y="230">osteoblast line</text>
 <text class="s" x="66" y="248">and osteocyte</text>
 <path class="ar" d="M192 216 L268 200"/>
 <path class="ar" d="M192 248 L268 264"/>
 <rect class="oc" x="274" y="186" width="80" height="28" rx="4"/>
 <text class="t" x="296" y="205">RANKL</text>
 <rect class="cy" x="274" y="250" width="80" height="28" rx="4"/>
 <text class="t" x="300" y="269">OPG</text>
 <path class="ar" d="M360 200 L430 220"/>
 <path class="no" d="M360 264 L428 236"/>
 <ellipse class="oc" cx="490" cy="230" rx="56" ry="26"/>
 <text class="t" x="460" y="235">osteoclast</text>
 <text class="s" x="274" y="306">the ratio decides</text>

 <rect class="k" x="572" y="186" width="110" height="28" rx="4"/>
 <text class="s" x="582" y="205">denosumab</text>
 <path class="no" d="M568 200 L362 200"/>
 <rect class="k" x="572" y="246" width="110" height="28" rx="4"/>
 <text class="s" x="582" y="265">bisphosphonate</text>
 <path class="no" d="M568 260 L534 244"/>
</svg>
