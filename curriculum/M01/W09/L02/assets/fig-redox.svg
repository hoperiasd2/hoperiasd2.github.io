<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"
     aria-label="Scale of standard reduction potentials from NADH to oxygen with the electron carriers, and the conversion of potential difference into free energy">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .sub{font:11px sans-serif;fill:#4a5159}
    .ax{stroke:#16191d;stroke-width:2.4}
    .tick{stroke:#16191d;stroke-width:1.6}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.6}
    .ar{stroke:#f2b705;stroke-width:3;fill:none;marker-end:url(#ar1)}
    .dot{fill:#003c71}
  </style>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b705"/>
    </marker>
  </defs>
  <text class="ttl" x="26" y="24">Standard reduction potential and the direction of electron flow</text>
  <text class="sub" x="26" y="44">Electrons flow spontaneously from LOW potential to HIGH potential.</text>

  <line class="ax" x1="150" y1="320" x2="150" y2="70"/>
  <text class="sub" x="96" y="64">E standard (V)</text>
  <g class="tick">
    <line x1="142" y1="300" x2="158" y2="300"/>
    <line x1="142" y1="258" x2="158" y2="258"/>
    <line x1="142" y1="200" x2="158" y2="200"/>
    <line x1="142" y1="160" x2="158" y2="160"/>
    <line x1="142" y1="92" x2="158" y2="92"/>
  </g>
  <text class="sub" x="106" y="304">-0.32</text>
  <text class="sub" x="106" y="262">-0.22</text>
  <text class="sub" x="106" y="204">+0.045</text>
  <text class="sub" x="106" y="164">+0.235</text>
  <text class="sub" x="112" y="96">+0.82</text>

  <circle class="dot" cx="150" cy="300" r="6"/>
  <text class="lab" x="172" y="296">NAD+ / NADH</text>
  <text class="sub" x="172" y="312">from glycolysis, TCA cycle, beta-oxidation</text>

  <circle class="dot" cx="150" cy="258" r="6"/>
  <text class="lab" x="172" y="254">FAD / FADH2 (free form)</text>
  <text class="sub" x="172" y="270">enzyme bound in succinate dehydrogenase</text>

  <circle class="dot" cx="150" cy="200" r="6"/>
  <text class="lab" x="172" y="196">ubiquinone / ubiquinol (CoQ)</text>
  <text class="sub" x="172" y="212">mobile within the inner membrane</text>

  <circle class="dot" cx="150" cy="160" r="6"/>
  <text class="lab" x="172" y="156">cytochrome c, Fe3+ / Fe2+</text>
  <text class="sub" x="172" y="172">carries one electron at a time</text>

  <circle class="dot" cx="150" cy="92" r="6"/>
  <text class="lab" x="172" y="88">1/2 O2 + 2 e- + 2 H+ to H2O</text>
  <text class="sub" x="172" y="104">final electron acceptor</text>

  <path class="ar" d="M90 294 L90 100"/>
  <text class="lab" x="22" y="200">electron</text>
  <text class="lab" x="30" y="218">flow</text>

  <rect class="hl" x="508" y="60" width="326" height="124" rx="6"/>
  <text class="hd" x="520" y="82">From potential to free energy</text>
  <text class="lab" x="520" y="108">Delta G standard = - n F Delta E standard</text>
  <text class="sub" x="520" y="130">n = electrons transferred, F = 96.5 kJ/(V mol)</text>
  <text class="sub" x="520" y="150">NADH to O2: Delta E = 0.82 - (-0.32) = 1.14 V</text>
  <text class="lab" x="520" y="172">Delta G standard = -2 x 96.5 x 1.14 = about -220 kJ/mol</text>

  <rect class="box" x="508" y="200" width="326" height="86" rx="6"/>
  <text class="hd" x="520" y="222">Where the 220 kJ/mol goes</text>
  <text class="sub" x="520" y="244">converted into a proton gradient across the inner membrane,</text>
  <text class="sub" x="520" y="262">then into ATP (about 30 kJ/mol each). Actual yield is about</text>
  <text class="sub" x="520" y="280">2.5 ATP per NADH; the rest leaks or drives transporters.</text>

  <rect class="box" x="508" y="302" width="326" height="104" rx="6"/>
  <text class="hd" x="520" y="324">Oxidation state of carbon</text>
  <text class="sub" x="520" y="348">-CH3  to  -CH2OH  to  -CHO  to  -COOH  to  CO2</text>
  <text class="sub" x="520" y="366">most reduced on the left, most oxidised on the right</text>
  <text class="sub" x="520" y="388">Fatty acids are nearly all -CH2-, hence 38 kJ/g; sugars already</text>
  <text class="sub" x="520" y="402">carry hydroxyls, hence 17 kJ/g.</text>

  <rect class="box" x="26" y="340" width="462" height="66" rx="6"/>
  <text class="hd" x="38" y="362">NADH, FADH2 and NADPH have separate jobs</text>
  <text class="sub" x="38" y="384">NAD+/NADH kept HIGH (oxidised) to drive catabolism. NADP+/NADPH kept LOW (reduced) to supply</text>
  <text class="sub" x="38" y="400">reducing power for biosynthesis and glutathione. The two differ by one phosphate on ribose C2.</text>
</svg>
