<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img"
     aria-label="Photosynthesis light reactions in the thylakoid membrane with photosystem II and I, water splitting and ATP synthase, and the Calvin cycle in the stroma">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .sm{font:700 10.5px sans-serif;fill:#16191d}
    .sub{font:11px sans-serif;fill:#4a5159}
    .mem{fill:#eff4f8;stroke:#16191d;stroke-width:2}
    .cx{fill:#fff5d6;stroke:#003c71;stroke-width:2}
    .e{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#ap1)}
    .h{stroke:#f2b705;stroke-width:2.6;fill:none;marker-end:url(#ap2)}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .ph{stroke:#f2b705;stroke-width:2.2;fill:none}
  </style>
  <defs>
    <marker id="ap1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
    <marker id="ap2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b705"/></marker>
  </defs>
  <text class="ttl" x="26" y="24">Photosynthesis: light reactions in the thylakoid, Calvin cycle in the stroma</text>
  <text class="sub" x="26" y="44">6 CO2 + 6 H2O + light to C6H12O6 + 6 O2</text>

  <text class="hd" x="26" y="74">STROMA (equivalent of the mitochondrial matrix)</text>
  <rect class="mem" x="26" y="150" width="620" height="76"/>
  <text class="sub" x="34" y="194">thylakoid membrane</text>
  <text class="hd" x="26" y="256">THYLAKOID LUMEN: protons accumulate here</text>

  <rect class="cx" x="80" y="140" width="94" height="96" rx="8"/>
  <text class="sm" x="98" y="176">Photosystem II</text>
  <path class="ph" d="M60 104 l16 20 l-16 20"/>
  <text class="lab" x="40" y="96">light</text>
  <path class="e" d="M127 140 L127 112"/>
  <text class="lab" x="100" y="106">excited e-</text>
  <text class="lab" x="76" y="286">2 H2O split</text>
  <text class="lab" x="76" y="304">O2 released</text>
  <path class="e" d="M127 270 L127 240"/>
  <path class="h" d="M127 236 L127 268"/>

  <circle class="cx" cx="240" cy="188" r="24"/>
  <text class="sm" x="222" y="192">PQ</text>
  <path class="e" d="M150 112 L228 164"/>

  <rect class="cx" x="298" y="140" width="94" height="96" rx="8"/>
  <text class="sm" x="314" y="176">cytochrome</text>
  <text class="sm" x="330" y="192">b6f</text>
  <path class="e" d="M266 188 L292 188"/>
  <path class="h" d="M345 140 L345 266"/>
  <text class="lab" x="352" y="296">H+ pumped in</text>

  <circle class="cx" cx="446" cy="248" r="22"/>
  <text class="sm" x="428" y="252">PC</text>
  <path class="e" d="M392 210 L428 240"/>

  <rect class="cx" x="500" y="140" width="94" height="96" rx="8"/>
  <text class="sm" x="516" y="176">Photosystem I</text>
  <path class="ph" d="M482 104 l16 20 l-16 20"/>
  <text class="lab" x="462" y="96">light</text>
  <path class="e" d="M468 242 L506 236"/>
  <path class="e" d="M547 140 L547 112"/>
  <text class="lab" x="560" y="106">to ferredoxin</text>
  <text class="lab" x="560" y="124">then NADP+ to NADPH</text>

  <rect class="cx" x="668" y="146" width="56" height="84" rx="8"/>
  <text class="sm" x="686" y="192">CF0</text>
  <circle class="cx" cx="696" cy="116" r="30"/>
  <text class="sm" x="680" y="120">CF1</text>
  <path class="h" d="M696 262 L696 150"/>
  <text class="lab" x="616" y="300">H+ flows back out</text>
  <text class="lab" x="740" y="112">ADP + Pi to ATP</text>
  <text class="sub" x="740" y="130">photophosphorylation</text>

  <rect class="box" x="26" y="318" width="400" height="106" rx="6"/>
  <text class="hd" x="38" y="340">Calvin cycle (stroma, no light needed directly)</text>
  <text class="sub" x="38" y="364">RUBISCO adds CO2 to ribulose-1,5-bisphosphate (C5),</text>
  <text class="sub" x="38" y="380">giving two molecules of 3-phosphoglycerate (C3).</text>
  <text class="sub" x="38" y="398">Reduction and regeneration use the ATP and NADPH made above.</text>
  <text class="lab" x="38" y="416">Per CO2 fixed: 3 ATP and 2 NADPH.</text>

  <rect class="box" x="440" y="318" width="394" height="106" rx="6"/>
  <text class="hd" x="452" y="340">Same principle as oxidative phosphorylation</text>
  <text class="sub" x="452" y="364">Mitochondrion: electrons run DOWN from NADH (-0.32 V) to O2 (+0.82 V).</text>
  <text class="sub" x="452" y="382">Chloroplast: light drives electrons UP from H2O (+0.82 V) to NADP+ (-0.32 V).</text>
  <text class="lab" x="452" y="404">Both store the energy as a proton gradient and both use a</text>
  <text class="lab" x="452" y="420">rotary ATP synthase. The shared mechanism is chemiosmosis.</text>
</svg>
