<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"
     aria-label="Structure of ATP with adenine, ribose and three phosphates, the sites of hydrolysis and the three reasons the free energy of hydrolysis is large">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .sub{font:11px sans-serif;fill:#4a5159}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.6}
    .bd{stroke:#16191d;stroke-width:2.2;fill:none}
    .ring{stroke:#16191d;stroke-width:2;fill:#eff4f8}
    .ph{fill:#f2b705;stroke:#16191d;stroke-width:1.6}
    .cut{stroke:#003c71;stroke-width:2.4;stroke-dasharray:6 4;fill:none}
  </style>
  <text class="ttl" x="26" y="24">ATP: structure, sites of hydrolysis and why the free energy change is large</text>

  <path class="ring" d="M66 120 L66 86 L96 69 L126 86 L126 120 L96 137 Z"/>
  <path class="ring" d="M126 86 L160 76 L180 103 L160 130 L126 120"/>
  <text class="lab" x="78" y="108">adenine</text>
  <path class="bd" d="M96 137 L96 162"/>

  <path class="ring" d="M66 196 L126 196 L142 230 L96 254 L50 230 Z" fill="#ffffff"/>
  <text class="lab" x="78" y="226">ribose</text>
  <text class="sub" x="38" y="272">C5 of ribose</text>
  <path class="bd" d="M142 222 L186 206"/>

  <circle class="ph" cx="214" cy="200" r="22"/>
  <text class="lab" x="206" y="206">P</text>
  <text class="sub" x="206" y="168">alpha</text>
  <path class="bd" d="M236 200 L262 200"/>
  <circle class="ph" cx="286" cy="200" r="22"/>
  <text class="lab" x="278" y="206">P</text>
  <text class="sub" x="276" y="168">beta</text>
  <path class="bd" d="M308 200 L334 200"/>
  <circle class="ph" cx="358" cy="200" r="22"/>
  <text class="lab" x="350" y="206">P</text>
  <text class="sub" x="348" y="168">gamma</text>

  <text class="sub" x="196" y="240">phosphoester</text>
  <text class="sub" x="250" y="258">phosphoanhydride bonds</text>

  <path class="cut" d="M322 170 L322 236"/>
  <text class="lab" x="396" y="196">ATP + H2O to ADP + Pi</text>
  <text class="lab" x="396" y="214">Delta G standard = -30.5 kJ/mol</text>
  <path class="cut" d="M250 258 L250 300"/>
  <text class="lab" x="396" y="248">ATP + H2O to AMP + PPi</text>
  <text class="lab" x="396" y="266">Delta G standard = -45.6 kJ/mol</text>
  <text class="sub" x="396" y="292">At pH 7 ATP carries a charge of about -4.</text>

  <rect class="hl" x="26" y="312" width="394" height="96" rx="6"/>
  <text class="hd" x="38" y="334">Three reasons the hydrolysis is strongly exergonic</text>
  <text class="sub" x="38" y="356">1. Charge repulsion between the crowded negative phosphates is relieved.</text>
  <text class="sub" x="38" y="374">2. Free inorganic phosphate is stabilised by resonance over four oxygens.</text>
  <text class="sub" x="38" y="392">3. The two products are each hydrated, which stabilises them further.</text>

  <rect class="box" x="436" y="312" width="398" height="96" rx="6"/>
  <text class="hd" x="448" y="334">ATP is a flow, not a store</text>
  <text class="sub" x="448" y="356">Total body ATP is about 50 g, but many kilograms turn over per day.</text>
  <text class="sub" x="448" y="374">Mean lifetime of one ATP molecule is under a minute.</text>
  <text class="sub" x="448" y="392">Storage is glycogen and triacylglycerol; muscle buffers with creatine phosphate.</text>

  <rect class="box" x="436" y="40" width="398" height="104" rx="6"/>
  <text class="hd" x="448" y="62">Phosphoryl transfer potential (kJ/mol)</text>
  <text class="sub" x="448" y="84">phosphoenolpyruvate -61.9   1,3-bisphosphoglycerate -49.4</text>
  <text class="lab" x="448" y="102">creatine phosphate -43.1     ATP -30.5</text>
  <text class="sub" x="448" y="120">glucose-1-phosphate -20.9   glucose-6-phosphate -13.8</text>
  <text class="sub" x="448" y="138">ATP sits in the MIDDLE, so it can both receive and donate phosphate.</text>
</svg>
