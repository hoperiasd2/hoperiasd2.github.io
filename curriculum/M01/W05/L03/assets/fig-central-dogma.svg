<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img"
     aria-label="Central dogma showing replication, transcription and translation with reverse transcription and RNA dependent RNA polymerase as exceptions">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .hd{font:700 12.5px sans-serif;fill:#003c71}
    .lab{font:700 13px sans-serif;fill:#16191d}
    .big{font:700 18px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .box{fill:#ffffff;stroke:#003c71;stroke-width:2.2}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
    .ar{stroke:#16191d;stroke-width:2.6;fill:none;marker-end:url(#ad)}
    .ex{stroke:#f2b705;stroke-width:2.6;fill:none;marker-end:url(#ad2);stroke-dasharray:7 4}
    .no{stroke:#4a5159;stroke-width:2.2;fill:none}
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16191d"/></marker>
    <marker id="ad2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b705"/></marker>
  </defs>
  <text class="ttl" x="26" y="26">The central dogma: information flows from nucleic acid to protein</text>

  <rect class="box" x="90" y="130" width="150" height="66" rx="8"/>
  <text class="big" x="140" y="172">DNA</text>
  <rect class="box" x="350" y="130" width="150" height="66" rx="8"/>
  <text class="big" x="402" y="172">RNA</text>
  <rect class="box" x="610" y="130" width="170" height="66" rx="8"/>
  <text class="big" x="638" y="172">PROTEIN</text>

  <path class="ar" d="M244 163 L344 163"/>
  <text class="lab" x="256" y="152">TRANSCRIPTION</text>
  <text class="sub" x="250" y="188">RNA polymerase, one strand as template</text>

  <path class="ar" d="M504 163 L604 163"/>
  <text class="lab" x="516" y="152">TRANSLATION</text>
  <text class="sub" x="508" y="188">ribosome, tRNA, genetic code</text>

  <path class="ar" d="M120 130 q-50 -50 20 -56 q70 -6 50 50"/>
  <text class="lab" x="92" y="64">REPLICATION</text>
  <text class="sub" x="68" y="100">DNA polymerase, semiconservative</text>

  <path class="ex" d="M420 196 q-80 70 -170 10"/>
  <text class="hd" x="300" y="262">reverse transcription</text>
  <text class="sub" x="300" y="280">retroviruses: reverse transcriptase</text>

  <path class="ex" d="M470 130 q60 -46 30 -4"/>
  <text class="hd" x="516" y="96">RNA to RNA</text>
  <text class="sub" x="516" y="114">RNA viruses: RNA dependent RNA polymerase</text>

  <path class="no" d="M700 212 L700 250"/>
  <path class="no" d="M676 244 L724 268 M676 268 L724 244" stroke-width="3"/>
  <text class="sub" x="612" y="294">Protein sequence is NEVER</text>
  <text class="sub" x="612" y="310">translated back into nucleic acid.</text>

  <rect class="hl" x="26" y="314" width="560" height="22" rx="4"/>
  <text class="sub" x="36" y="330">Both exceptions run from nucleic acid to nucleic acid, so the core claim of the central dogma still holds.</text>
</svg>
