<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"
     aria-label="Timeline of the origin and evolution of cells from formation of the Earth to multicellular organisms">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .sub{font:12px sans-serif;fill:#4a5159}
    .lab{font:700 12.5px sans-serif;fill:#16191d}
    .yr{font:700 12px monospace;fill:#003c71}
    .ax{stroke:#16191d;stroke-width:2.4;fill:none}
    .tick{stroke:#16191d;stroke-width:1.6}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.6}
    .lead{stroke:#4a5159;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
  </style>
  <text class="ttl" x="26" y="26">Timeline of cellular evolution (billions of years ago, Ga)</text>
  <text class="sub" x="26" y="45">Axis is linear in time; present is at the right end.</text>

  <line class="ax" x1="60" y1="170" x2="810" y2="170"/>
  <polygon points="810,170 798,164 798,176" fill="#16191d"/>

  <g class="tick">
    <line x1="70" y1="162" x2="70" y2="178"/>
    <line x1="230" y1="162" x2="230" y2="178"/>
    <line x1="390" y1="162" x2="390" y2="178"/>
    <line x1="470" y1="162" x2="470" y2="178"/>
    <line x1="630" y1="162" x2="630" y2="178"/>
    <line x1="790" y1="162" x2="790" y2="178"/>
  </g>
  <text class="yr" x="56" y="196">4.6</text>
  <text class="yr" x="216" y="196">3.5</text>
  <text class="yr" x="376" y="196">2.7</text>
  <text class="yr" x="456" y="196">2.4</text>
  <text class="yr" x="616" y="196">1.8</text>
  <text class="yr" x="778" y="196">0.6</text>

  <rect class="box" x="24" y="76" width="130" height="58" rx="5"/>
  <text class="lab" x="36" y="97">Formation of</text>
  <text class="lab" x="36" y="113">the Earth</text>
  <text class="sub" x="36" y="128">prebiotic chemistry</text>
  <path class="lead" d="M70 134 L70 162"/>

  <rect class="hl" x="166" y="76" width="140" height="58" rx="5"/>
  <text class="lab" x="178" y="97">First cells</text>
  <text class="sub" x="178" y="112">RNA world, fermentation</text>
  <text class="sub" x="178" y="127">oldest microfossils</text>
  <path class="lead" d="M230 134 L230 162"/>

  <rect class="box" x="320" y="76" width="140" height="58" rx="5"/>
  <text class="lab" x="332" y="97">Oxygenic</text>
  <text class="lab" x="332" y="113">photosynthesis</text>
  <text class="sub" x="332" y="128">cyanobacteria</text>
  <path class="lead" d="M390 134 L390 162"/>

  <rect class="hl" x="400" y="208" width="150" height="58" rx="5"/>
  <text class="lab" x="412" y="229">Great oxidation</text>
  <text class="sub" x="412" y="245">atmospheric O2 rises;</text>
  <text class="sub" x="412" y="260">aerobic respiration</text>
  <path class="lead" d="M470 208 L470 178"/>

  <rect class="box" x="560" y="76" width="150" height="58" rx="5"/>
  <text class="lab" x="572" y="97">Eukaryotic cells</text>
  <text class="sub" x="572" y="112">nucleus, organelles,</text>
  <text class="sub" x="572" y="127">endosymbiosis</text>
  <path class="lead" d="M630 134 L630 162"/>

  <rect class="box" x="700" y="208" width="140" height="58" rx="5"/>
  <text class="lab" x="712" y="229">Multicellular</text>
  <text class="lab" x="712" y="245">organisms</text>
  <text class="sub" x="712" y="260">cell differentiation</text>
  <path class="lead" d="M790 208 L790 178"/>

  <text class="sub" x="26" y="306">LUCA: last universal common ancestor, inferred from shared membrane, DNA, genetic code and core metabolism.</text>
</svg>
