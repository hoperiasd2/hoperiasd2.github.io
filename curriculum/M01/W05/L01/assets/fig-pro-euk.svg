<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img"
     aria-label="Side-by-side comparison of a prokaryotic cell and a eukaryotic cell drawn at the same scale, showing size and compartmentalization">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .sub{font:11.5px sans-serif;fill:#4a5159}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .mem{fill:#ffffff;stroke:#16191d;stroke-width:2.6}
    .wall{fill:none;stroke:#f2b705;stroke-width:3}
    .org{fill:#fff5d6;stroke:#003c71;stroke-width:1.6}
    .nuc{fill:#ffffff;stroke:#003c71;stroke-width:2.2}
    .fil{stroke:#4a5159;stroke-width:1.1;fill:none}
    .lead{stroke:#4a5159;stroke-width:1;stroke-dasharray:3 3;fill:none}
    .scale{stroke:#16191d;stroke-width:2}
  </style>
  <text class="ttl" x="26" y="26">Prokaryotic and eukaryotic cells at the same scale</text>

  <text class="lab" x="40" y="58">PROKARYOTE (bacterium), 1-2 um</text>
  <ellipse class="mem" cx="120" cy="140" rx="68" ry="38"/>
  <ellipse class="wall" cx="120" cy="140" rx="74" ry="44"/>
  <path class="fil" d="M86 140 q14 -16 30 0 q14 16 30 0" stroke="#003c71" stroke-width="2"/>
  <circle cx="100" cy="124" r="2.6" fill="#16191d"/>
  <circle cx="134" cy="126" r="2.6" fill="#16191d"/>
  <circle cx="112" cy="158" r="2.6" fill="#16191d"/>
  <circle cx="146" cy="152" r="2.6" fill="#16191d"/>
  <path class="fil" d="M188 150 q22 10 34 26" stroke="#16191d" stroke-width="2"/>
  <text class="sub" x="196" y="196">flagellum</text>
  <path class="lead" d="M120 178 L120 208"/>
  <text class="sub" x="34" y="224">nucleoid: one circular DNA, no nuclear envelope</text>
  <text class="sub" x="34" y="242">70S ribosomes free in cytosol</text>
  <text class="sub" x="34" y="260">no membrane-bounded organelles</text>
  <text class="sub" x="34" y="278">transcription and translation are coupled</text>
  <text class="sub" x="34" y="296">cell wall outside the plasma membrane</text>

  <line class="scale" x1="34" y1="328" x2="102" y2="328"/>
  <line class="scale" x1="34" y1="322" x2="34" y2="334"/>
  <line class="scale" x1="102" y1="322" x2="102" y2="334"/>
  <text class="sub" x="52" y="348">1 um</text>

  <text class="lab" x="330" y="58">EUKARYOTE (animal cell), 10-30 um</text>
  <ellipse class="mem" cx="560" cy="190" rx="250" ry="140"/>
  <circle class="nuc" cx="520" cy="170" r="62"/>
  <circle cx="520" cy="170" r="20" fill="#003c71" opacity="0.18"/>
  <text class="lab" x="494" y="146">nucleus</text>
  <text class="sub" x="492" y="200">nucleolus</text>
  <circle cx="470" cy="112" r="3" fill="#16191d"/>
  <circle cx="574" cy="118" r="3" fill="#16191d"/>
  <circle cx="568" cy="226" r="3" fill="#16191d"/>
  <text class="sub" x="586" y="106">nuclear pores</text>

  <path class="org" d="M400 250 q30 -18 60 0 q-30 18 -60 0 z"/>
  <path class="org" d="M396 272 q30 -18 60 0 q-30 18 -60 0 z"/>
  <text class="sub" x="356" y="300">rough ER</text>

  <path class="org" d="M636 128 q46 -12 70 4 q-46 12 -70 -4 z"/>
  <path class="org" d="M640 150 q46 -12 70 4 q-46 12 -70 -4 z"/>
  <path class="org" d="M644 172 q46 -12 70 4 q-46 12 -70 -4 z"/>
  <text class="sub" x="716" y="152">Golgi</text>

  <ellipse class="org" cx="648" cy="244" rx="34" ry="19"/>
  <path class="fil" d="M622 244 q10 -11 18 0 q10 11 18 0 q10 -11 16 0" stroke="#003c71" stroke-width="1.6"/>
  <text class="sub" x="626" y="282">mitochondrion</text>

  <circle class="org" cx="434" cy="112" r="18"/>
  <text class="sub" x="398" y="90">lysosome</text>
  <circle class="org" cx="716" cy="214" r="14"/>
  <text class="sub" x="700" y="196">peroxisome</text>

  <path class="fil" d="M352 196 L452 206 M352 212 L440 232 M700 268 L762 252"/>
  <text class="sub" x="330" y="246">cytoskeleton</text>

  <line class="scale" x1="560" y1="356" x2="700" y2="356"/>
  <line class="scale" x1="560" y1="350" x2="560" y2="362"/>
  <line class="scale" x1="700" y1="350" x2="700" y2="362"/>
  <text class="sub" x="610" y="376">5 um</text>
  <text class="sub" x="330" y="356">Volume ratio is about 1000 to 10000 fold.</text>
</svg>
