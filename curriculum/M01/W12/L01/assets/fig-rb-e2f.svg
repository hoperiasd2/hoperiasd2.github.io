<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"
 aria-label="From growth factor to S phase entry: induction of cyclin D, stepwise phosphorylation of Rb, release of E2F, positive feedback by cyclin E and the restriction point.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .fb{stroke:#2e7d32;stroke-width:2.4;fill:none;marker-end:url(#g);stroke-dasharray:6 4}
  .inh{stroke:#b3261e;stroke-width:2.4;fill:none;marker-end:url(#bar)}
  .p{fill:#b3261e}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
  <marker id="bar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M6 0 L6 10" stroke="#b3261e" stroke-width="3"/></marker>
 </defs>

 <text class="th" x="20" y="28">Growth factor to S phase: the Rb-E2F switch</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="20" y="60" width="124" height="52" rx="8"/>
 <text class="tb" x="34" y="84">Growth factor</text>
 <text class="s" x="34" y="104">receptor, Ras, MAPK</text>
 <path class="ar" d="M150 86 L204 86"/>

 <rect class="bx" x="212" y="60" width="150" height="52" rx="8"/>
 <text class="tb" x="226" y="84">Cyclin D induced</text>
 <text class="s" x="226" y="104">binds CDK4 / CDK6</text>
 <path class="ar" d="M368 86 L422 86"/>

 <rect class="bx" x="430" y="60" width="166" height="52" rx="8"/>
 <text class="tb" x="444" y="84">Cyclin D-CDK4/6</text>
 <text class="s" x="444" y="104">first, partial Rb phosphorylation</text>
 <path class="inh" d="M352 132 L300 132"/>
 <text class="tb" x="358" y="138">p16 (INK4) blocks this</text>

 <path class="ar" d="M512 118 L512 158"/>

 <rect class="k" x="400" y="166" width="230" height="64" rx="8"/>
 <text class="tb" x="414" y="190">Rb  -  E2F  complex</text>
 <circle class="p" cx="430" cy="212" r="8"/>
 <circle class="p" cx="450" cy="212" r="8"/>
 <text class="s" x="466" y="216">partially phosphorylated Rb</text>

 <path class="ar" d="M636 198 L700 198"/>
 <text class="s" x="632" y="186">Rb releases E2F</text>

 <rect class="bx" x="708" y="170" width="152" height="58" rx="8"/>
 <text class="tb" x="722" y="194">E2F  free</text>
 <text class="s" x="722" y="214">transcribes S-phase genes</text>

 <path class="ar" d="M784 234 L784 272"/>
 <rect class="bx" x="640" y="280" width="220" height="70" rx="8"/>
 <text class="tb" x="654" y="304">E2F target genes</text>
 <text class="t" x="654" y="326">cyclin E, cyclin A, DNA polymerase,</text>
 <text class="t" x="654" y="344">thymidylate synthase, E2F itself</text>

 <path class="fb" d="M636 322 L420 322"/>
 <rect class="k" x="240" y="296" width="172" height="58" rx="8"/>
 <text class="tb" x="254" y="320">Cyclin E-CDK2</text>
 <text class="s" x="254" y="340">completes Rb phosphorylation</text>
 <path class="fb" d="M326 290 q0 -40 86 -70"/>
 <text class="tb" x="150" y="266">positive feedback</text>

 <rect class="bx" x="20" y="166" width="340" height="110" rx="8"/>
 <text class="tb" x="34" y="190">Restriction point (R point)</text>
 <text class="t" x="34" y="214">Before it, withdrawing the growth factor returns</text>
 <text class="t" x="34" y="232">the cell to G1 or G0</text>
 <text class="t" x="34" y="256">After it, cyclin E feedback makes entry into S</text>
 <text class="t" x="34" y="272">independent of the growth factor</text>
</svg>
