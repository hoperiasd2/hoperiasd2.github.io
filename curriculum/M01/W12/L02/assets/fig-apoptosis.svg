<!-- 세포사멸의 두 경로. 라벨만 둔다.
   왼쪽 내재 경로. BH3-only 가 BCL-2 의 억제를 풀고 BAX BAK 가 구멍을 만든다.
   오른쪽 외재 경로. 사멸 수용체에 FADD 와 caspase-8 이 모인다.
   가운데 아래 수렴. 실행 caspase.
   캡션에 쓸 내용: 두 경로 모두 caspase 를 모을 발판을 만드는 것이 핵심이고,
   BID 절단으로 외재 신호가 미토콘드리아를 통해 증폭된다는 점.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"
 aria-label="세포사멸 두 경로 그림. 왼쪽 내재 경로는 스트레스가 BH3-only 단백질을 유도해 BCL-2의 억제를 풀고 BAX와 BAK가 미토콘드리아 바깥막에 구멍을 만들어 cytochrome c가 나와 Apaf-1과 apoptosome을 이루고 caspase-9을 활성화하는 과정을, 오른쪽 외재 경로는 사멸 수용체에 FADD와 caspase-8이 모여 DISC를 이루는 과정을 보이며, caspase-8이 BID를 잘라 내재 경로로 이어지는 연결과 두 경로가 실행 caspase에서 만나는 지점을 보인다.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .s{font:11px sans-serif;fill:#50585f}
  .p{font:700 15px sans-serif;fill:#003c71}
  .mem{fill:#e8eef5;stroke:#1a4f8a;stroke-width:2}
  .mito{fill:#f7e4e2;stroke:#b3261e;stroke-width:2}
  .box{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .inh{fill:#f2efe6;stroke:#8a8f96;stroke-width:2}
  .cas{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .hot{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#r)}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
 </defs>

