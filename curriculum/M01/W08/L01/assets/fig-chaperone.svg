<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"
 aria-label="Comparison of Hsp70 family chaperones and chaperonins. Hsp70 binds exposed hydrophobic segments in repeated ATP-driven cycles of binding and release, while a chaperonin encloses the substrate inside an isolated chamber for folding.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .ch{fill:#e8eff6;stroke:#003c71;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}
  .s{font:11px sans-serif;fill:#4a5159}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .ard{stroke:#8a6300;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#b)}
  .chain{stroke:#16191d;stroke-width:2.4;fill:none}
  .hyd{stroke:#f2b705;stroke-width:5;fill:none;stroke-linecap:round}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a6300"/></marker>
 </defs>

 <text class="th" x="20" y="28">A  Hsp70 family: cyclic binding and release</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <text class="tb" x="30" y="66">Nascent / unfolded chain</text>
 <path class="chain" d="M30 100 q22 -22 44 0 q22 22 44 0 q22 -22 44 0"/>
 <path class="hyd" d="M56 92 L92 92"/>
 <text class="s" x="30" y="128">Exposed hydrophobic segment</text>

 <path class="ar" d="M178 100 L236 100"/>
 <text class="s" x="182" y="88">Hsp70 + ATP</text>

 <rect class="k" x="244" y="64" width="150" height="80" rx="8"/>
 <text class="tb" x="258" y="90">Hsp70 · ATP</text>
 <text class="t" x="258" y="112">binds the exposed</text>
 <text class="t" x="258" y="130">segment, blocks</text>
 <text class="s" x="258" y="150">aggregation</text>

 <path class="ar" d="M400 100 L458 100"/>
 <text class="s" x="402" y="88">Hsp40 / ATP</text>
 <text class="s" x="402" y="118">hydrolysis</text>

 <rect class="bx" x="466" y="64" width="150" height="80" rx="8"/>
 <text class="tb" x="480" y="90">Hsp70 · ADP</text>
 <text class="t" x="480" y="112">tight complex;</text>
 <text class="t" x="480" y="130">chain is held</text>

 <path class="ar" d="M622 100 L680 100"/>
 <text class="s" x="624" y="88">ADP to ATP</text>
 <text class="s" x="624" y="118">exchange</text>

 <rect class="bx" x="688" y="64" width="170" height="80" rx="8"/>
 <text class="tb" x="702" y="90">Release</text>
 <text class="t" x="702" y="112">chain folds, or re-binds</text>
 <text class="t" x="702" y="130">for another cycle</text>

 <path class="ard" d="M770 150 q-10 46 -300 46 q-300 0 -295 -44"/>
 <text class="s" x="440" y="212">Repeated cycles until the chain is folded</text>

 <text class="th" x="20" y="262">B  Chaperonin (GroEL / TRiC): folding inside an isolated chamber</text>
 <line x1="20" y1="272" x2="860" y2="272" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="chain" d="M34 330 q20 -20 40 0 q20 20 40 0"/>
 <text class="s" x="34" y="364">Unfolded chain</text>

 <path class="ar" d="M126 330 L184 330"/>

 <path class="ch" d="M196 296 h120 v70 h-120 z"/>
 <path class="chain" d="M222 332 q18 -16 36 0 q18 16 34 0"/>
 <text class="tb" x="196" y="290">Open ring</text>
 <text class="s" x="196" y="388">chain enters the</text>
 <text class="s" x="196" y="404">hydrophobic cavity</text>

 <path class="ar" d="M326 330 L384 330"/>
 <text class="s" x="328" y="318">ATP + cap</text>

 <path class="ch" d="M396 296 h120 v70 h-120 z"/>
 <path class="ch" d="M396 272 q60 -26 120 0 v24 h-120 z"/>
 <circle cx="456" cy="332" r="17" fill="#fff5d6" stroke="#f2b705" stroke-width="2.2"/>
 <text class="tb" x="396" y="262">Closed chamber</text>
 <text class="s" x="396" y="388">substrate is isolated;</text>
 <text class="s" x="396" y="404">no intermolecular contact</text>

 <path class="ar" d="M526 330 L584 330"/>
 <text class="s" x="528" y="318">ATP</text>
 <text class="s" x="528" y="348">hydrolysis</text>

 <path class="ch" d="M596 296 h120 v70 h-120 z"/>
 <circle cx="656" cy="332" r="15" fill="#fff" stroke="#003c71" stroke-width="2.2"/>
 <text class="tb" x="596" y="290">Cap released</text>
 <text class="s" x="596" y="388">folded protein exits;</text>
 <text class="s" x="596" y="404">unfolded chain re-enters</text>

 <rect class="bx" x="736" y="292" width="124" height="78" rx="8"/>
 <text class="tb" x="750" y="316">Key difference</text>
 <text class="t" x="750" y="338">Hsp70: shields</text>
 <text class="t" x="750" y="356">Chaperonin: encloses</text>
</svg>
