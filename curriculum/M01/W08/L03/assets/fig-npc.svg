<!-- 핵공 복합체. 라벨만 둔다.
   A 단면 배치. 세포질 섬유, 막 고리, 핵 바구니, FG 사슬이 메운 중앙 통로.
   B 두 투과 양식. 작은 분자는 그대로 지나고, 큰 기질은 수용체에 실린다.
   캡션에 쓸 내용: 고르는 기준이 구멍의 크기가 아니라 FG 사슬과
   결합할 수 있는가라는 점.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img"
 aria-label="핵공 복합체 그림. A 패널은 두 겹 핵막에 끼워진 8중 대칭 복합체의 단면으로 세포질 쪽 섬유, 막에 박힌 고리, 핵 쪽 바구니와 FG 반복 사슬이 메운 중앙 통로를 보이고, B 패널은 약 40 kDa 이하 분자의 수동 확산과 수용체에 실린 큰 기질의 촉진 수송을 나란히 보인다.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
