<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="The domain swap experiment that showed transcription factors are modular: replacing the DNA-binding domain of GAL4 with that of bacterial LexA moves the target sequence, the binding domain deciding which gene and the activation domain deciding how much, and the artificial transcription factors and two-hybrid assay this made possible.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.6}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#b)}
  .ex{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .pr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
 <text class="th" x="20" y="28">A  The experiment</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="pr" x="40" y="56" width="110" height="34" rx="5"/>
 <text class="s" x="58" y="78">GAL4 DBD</text>
 <rect class="ex" x="150" y="56" width="130" height="34" rx="5"/>
 <text class="s" x="168" y="78">GAL4 activation</text>
 <line class="dna" x1="40" y1="128" x2="400" y2="128"/>
 <rect class="k" x="70" y="118" width="80" height="20"/>
 <text class="m" x="76" y="133">GAL4 site</text>
 <rect class="g" x="250" y="118" width="110" height="20"/>
 <text class="s" x="266" y="133">reporter</text>
 <path class="ar" d="M95 96 L95 114"/>
 <rect class="bx" x="300" y="56" width="120" height="34" rx="5"/>
 <text class="s" x="330" y="78">reporter ON</text>

 <text class="tb" x="470" y="52">swap only the binding half</text>
 <rect class="g" x="470" y="66" width="110" height="34" rx="5"/>
 <text class="s" x="488" y="88">LexA DBD</text>
 <rect class="ex" x="580" y="66" width="130" height="34" rx="5"/>
 <text class="s" x="598" y="88">GAL4 activation</text>
 <line class="dna" x1="470" y1="138" x2="830" y2="138"/>
 <rect class="k" x="500" y="128" width="80" height="20"/>
 <text class="m" x="506" y="143">LexA site</text>
 <rect class="g" x="680" y="128" width="110" height="20"/>
 <text class="s" x="696" y="143">reporter</text>
 <path class="ar" d="M525 106 L525 124"/>
 <text class="s" x="470" y="170">the hybrid now works at the LexA site, not the GAL4 site</text>
 <text class="s" x="470" y="188">the reverse combination holds as well</text>
 <path class="no" d="M70 160 L150 160"/>
 <text class="s" x="40" y="180">GAL4 site no longer used</text>

 <text class="th" x="20" y="228">B  The conclusion: two independent modules</text>
 <line x1="20" y1="238" x2="430" y2="238" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="pr" x="30" y="252" width="180" height="88" rx="6"/>
 <text class="tb" x="42" y="272">DNA-binding domain</text>
 <text class="s" x="42" y="294">picks the target sequence</text>
 <text class="s" x="42" y="316">decides WHICH gene</text>
 <rect class="ex" x="230" y="252" width="180" height="88" rx="6"/>
 <text class="tb" x="242" y="272">activation domain</text>
 <text class="s" x="242" y="294">raises transcription there</text>
 <text class="s" x="242" y="316">decides HOW MUCH</text>
 <text class="s" x="30" y="366">the design is exemplary: if the two functions are separable the hybrid must</text>
 <text class="s" x="30" y="384">work at the new site, and if not it must fail. The result can decide the question.</text>

 <text class="th" x="460" y="228">C  What the modularity allows</text>
 <line x1="460" y1="238" x2="860" y2="238" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="k" x="470" y="252" width="370" height="82" rx="6"/>
 <text class="tb" x="482" y="272">1  Designed transcription factors</text>
 <text class="s" x="482" y="294">pick a binding module, attach an activation module:</text>
 <text class="s" x="482" y="312">zinc finger arrays, TALE, catalytically dead Cas9</text>
 <text class="s" x="482" y="330">with an activation domain (CRISPR activation)</text>
 <rect class="k" x="470" y="348" width="370" height="106" rx="6"/>
 <text class="tb" x="482" y="368">2  Two-hybrid assay</text>
 <rect class="pr" x="482" y="380" width="70" height="24"/><text class="s" x="494" y="397">DBD</text>
 <rect class="bx" x="552" y="380" width="60" height="24"/><text class="s" x="564" y="397">bait</text>
 <rect class="bx" x="660" y="380" width="60" height="24"/><text class="s" x="668" y="397">prey</text>
 <rect class="ex" x="720" y="380" width="100" height="24"/><text class="s" x="736" y="397">activation</text>
 <text class="s" x="482" y="424">only if bait and prey bind do the two modules</text>
 <text class="s" x="482" y="442">meet at one site and the reporter switches on</text>
</svg>
