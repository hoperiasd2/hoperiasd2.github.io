<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="Design of the reporter gene assay and its two variants: an easily measured gene joined downstream of the sequence under test, deletion analysis trimming the 5-prime side to find where expression drops, linker scanning replacing short blocks while keeping the length constant, and the stepwise increase in resolution.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.6}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#b)}
  .ex{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .pr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
 <text class="th" x="20" y="28">A  The principle: measure an easy gene instead of a hard one</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <line class="dna" x1="40" y1="76" x2="520" y2="76"/>
 <rect class="k" x="60" y="64" width="220" height="24"/>
 <text class="s" x="104" y="81">sequence under test</text>
 <rect class="g" x="300" y="64" width="200" height="24"/>
 <text class="s" x="330" y="81">reporter gene</text>
 <path class="ar" d="M530 76 L584 76"/>
 <rect class="bx" x="596" y="52" width="244" height="48" rx="6"/>
 <text class="s" x="606" y="72">transfect cells, measure the</text>
 <text class="s" x="606" y="90">reporter product</text>
 <text class="s" x="40" y="118">more product means that stretch of DNA drove transcription</text>
 <text class="m" x="40" y="142">luciferase  light      beta-galactosidase  colour      GFP  fluorescence</text>

 <text class="th" x="20" y="186">B  Deletion analysis: narrows the region</text>
 <line x1="20" y1="196" x2="430" y2="196" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="k" x="40" y="212" width="200" height="18"/><rect class="g" x="240" y="212" width="90" height="18"/>
 <rect class="bx" x="340" y="212" width="70" height="18"/><text class="s" x="352" y="226">high</text>
 <rect class="k" x="90" y="238" width="150" height="18"/><rect class="g" x="240" y="238" width="90" height="18"/>
 <rect class="bx" x="340" y="238" width="70" height="18"/><text class="s" x="352" y="252">high</text>
 <rect class="k" x="140" y="264" width="100" height="18"/><rect class="g" x="240" y="264" width="90" height="18"/>
 <rect class="bx" x="340" y="264" width="70" height="18"/><text class="s" x="352" y="278">high</text>
 <rect class="k" x="190" y="290" width="50" height="18"/><rect class="g" x="240" y="290" width="90" height="18"/>
 <rect class="ex" x="340" y="290" width="70" height="18"/><text class="s" x="352" y="304">low</text>
 <path class="arr" d="M165 318 L165 302"/>
 <text class="s" x="40" y="338">the needed sequence lay in the stretch removed at this step</text>
 <text class="s" x="40" y="356">a rise instead of a drop means a repressive element was removed</text>

 <text class="th" x="460" y="186">C  Linker scanning: identifies the element</text>
 <line x1="460" y1="196" x2="860" y2="196" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="k" x="480" y="212" width="200" height="18"/><rect class="g" x="680" y="212" width="80" height="18"/>
 <rect class="pr" x="480" y="212" width="40" height="18"/>
 <rect class="bx" x="770" y="212" width="70" height="18"/><text class="s" x="782" y="226">high</text>
 <rect class="k" x="480" y="238" width="200" height="18"/><rect class="g" x="680" y="238" width="80" height="18"/>
 <rect class="pr" x="560" y="238" width="40" height="18"/>
 <rect class="ex" x="770" y="238" width="70" height="18"/><text class="s" x="782" y="252">low</text>
 <rect class="k" x="480" y="264" width="200" height="18"/><rect class="g" x="680" y="264" width="80" height="18"/>
 <rect class="pr" x="640" y="264" width="40" height="18"/>
 <rect class="bx" x="770" y="264" width="70" height="18"/><text class="s" x="782" y="278">high</text>
 <text class="s" x="480" y="304">shaded block = replaced by an unrelated sequence</text>
 <text class="s" x="480" y="326">total length never changes, so the effect of distance</text>
 <text class="s" x="480" y="344">is separated from the effect of the sequence itself</text>

 <text class="th" x="20" y="394">D  Resolution is raised in steps</text>
 <line x1="20" y1="404" x2="860" y2="404" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="40" y="418" width="230" height="40" rx="6"/>
 <text class="s" x="52" y="443">deletion: find the region</text>
 <path class="ar" d="M278 438 L306 438"/>
 <rect class="bx" x="314" y="418" width="250" height="40" rx="6"/>
 <text class="s" x="326" y="443">linker scanning: find the element</text>
 <path class="ar" d="M572 438 L600 438"/>
 <rect class="bx" x="608" y="418" width="250" height="40" rx="6"/>
 <text class="s" x="620" y="443">point mutation: fix the base</text>
</svg>
