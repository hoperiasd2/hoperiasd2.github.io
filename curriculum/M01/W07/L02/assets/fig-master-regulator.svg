<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="Two principles behind tissue-specific expression: combinatorial control in which a gene switches on only when every required factor is present and the number of combinations grows exponentially, and master regulators such as MyoD that switch on a whole lineage, holding the state through self-maintenance and repression of other lineages, extended to reprogramming with four factors.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.6}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#b)}
  .ex{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .pr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
 <text class="th" x="20" y="28">A  Combinatorial control</text>
 <line x1="20" y1="38" x2="430" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <line class="dna" x1="30" y1="86" x2="410" y2="86"/>
 <rect class="k" x="50" y="76" width="40" height="20"/>
 <rect class="k" x="110" y="76" width="40" height="20"/>
 <rect class="k" x="170" y="76" width="40" height="20"/>
 <rect class="k" x="230" y="76" width="40" height="20"/>
 <rect class="g" x="300" y="76" width="100" height="20"/>
 <text class="s" x="322" y="110">gene</text>
 <ellipse class="pr" cx="70" cy="58" rx="18" ry="12"/><text class="s" x="64" y="62">1</text>
 <ellipse class="pr" cx="130" cy="58" rx="18" ry="12"/><text class="s" x="124" y="62">2</text>
 <ellipse class="pr" cx="190" cy="58" rx="18" ry="12"/><text class="s" x="184" y="62">3</text>
 <ellipse class="pr" cx="250" cy="58" rx="18" ry="12"/><text class="s" x="244" y="62">4</text>
 <text class="s" x="30" y="134">the gene turns on only when every required factor is present</text>
 <line class="dna" x1="30" y1="178" x2="410" y2="178"/>
 <rect class="k" x="50" y="168" width="40" height="20"/>
 <rect class="k" x="110" y="168" width="40" height="20"/>
 <rect class="k" x="170" y="168" width="40" height="20"/>
 <rect class="k" x="230" y="168" width="40" height="20"/>
 <rect class="ex" x="300" y="168" width="100" height="20"/>
 <ellipse class="pr" cx="70" cy="150" rx="18" ry="12"/><text class="s" x="64" y="154">1</text>
 <ellipse class="pr" cx="190" cy="150" rx="18" ry="12"/><text class="s" x="184" y="154">3</text>
 <text class="s" x="30" y="206">factor 2 missing: the gene stays off in this cell type</text>
 <rect class="bx" x="30" y="222" width="380" height="62" rx="6"/>
 <text class="m" x="42" y="246">N factors    combinations  2 to the power N</text>
 <text class="s" x="42" y="270">about 1,600 human transcription factors suffice for hundreds of cell types</text>

 <text class="th" x="460" y="28">B  Master regulator: MyoD</text>
 <line x1="460" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <ellipse class="bx" cx="520" cy="86" rx="48" ry="30"/>
 <text class="s" x="492" y="90">fibroblast</text>
 <path class="ar" d="M576 86 L648 86"/>
 <text class="s" x="580" y="76">force MyoD</text>
 <rect class="ex" x="664" y="62" width="176" height="48" rx="6"/>
 <text class="s" x="676" y="82">muscle-specific genes on,</text>
 <text class="s" x="676" y="100">cells fuse into myotube shape</text>
 <text class="s" x="460" y="142">one factor, expressed where it does not belong, imposes a new identity</text>
 <rect class="k" x="470" y="158" width="370" height="96" rx="6"/>
 <text class="tb" x="482" y="178">why the state holds</text>
 <path class="ar" d="M520 196 q40 -22 78 0"/>
 <ellipse class="pr" cx="500" cy="208" rx="30" ry="16"/><text class="s" x="482" y="212">MyoD</text>
 <text class="s" x="610" y="200">maintains its own expression</text>
 <path class="no" d="M620 226 L700 226"/>
 <text class="s" x="482" y="240">and represses the genes of other lineages</text>

 <text class="th" x="20" y="326">C  The same principle run backwards: reprogramming</text>
 <line x1="20" y1="336" x2="860" y2="336" stroke="#c6d2dd" stroke-width="1.5"/>
 <ellipse class="bx" cx="110" cy="386" rx="58" ry="30"/>
 <text class="s" x="76" y="390">somatic cell</text>
 <path class="ar" d="M176 386 L300 386"/>
 <text class="m" x="182" y="376">Oct4  Sox2  Klf4  c-Myc</text>
 <ellipse class="g" cx="380" cy="386" rx="64" ry="30"/>
 <text class="s" x="344" y="382">induced</text>
 <text class="s" x="344" y="400">pluripotent</text>
 <text class="s" x="470" y="372">four transcription factors return the cell to a state close to</text>
 <text class="s" x="470" y="390">an embryonic stem cell</text>
 <text class="s" x="470" y="412">the belief that differentiation cannot be reversed was overturned</text>
 <rect class="ex" x="30" y="432" width="810" height="32" rx="6"/>
 <text class="s" x="42" y="453">identity is not in the genome, which is the same in every cell: it is in which set of transcription factors is active</text>
</svg>
