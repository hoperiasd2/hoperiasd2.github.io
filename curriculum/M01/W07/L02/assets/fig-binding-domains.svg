<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="Four structural families of DNA-binding domain and the effect of dimerisation: helix-turn-helix and the homeodomain inserting into the major groove, a zinc ion folding each finger that reads about three base pairs, leucine repeating every seven residues to form the coiled dimer, helix-loop-helix, and heterodimer combinations giving more specificities than there are proteins.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.6}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#b)}
  .ex{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .pr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
 <text class="th" x="20" y="28">A  Four families, each with a fixed way of gripping DNA</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="30" y="52" width="196" height="178" rx="6"/>
 <text class="tb" x="42" y="72">Helix-turn-helix</text>
 <text class="s" x="42" y="90">homeodomain</text>
 <path class="pr" d="M60 108 l50 0 l0 18 l-50 0 z"/>
 <path d="M110 117 q18 -14 30 4" stroke="#1a4f8a" stroke-width="2.6" fill="none"/>
 <rect class="pr" x="140" y="130" width="52" height="18"/>
 <line class="dna" x1="50" y1="178" x2="206" y2="178"/>
 <line class="dna" x1="50" y1="196" x2="206" y2="196"/>
 <rect class="pr" x="140" y="166" width="30" height="24"/>
 <text class="s" x="42" y="220">the second helix enters the major groove</text>

 <rect class="bx" x="238" y="52" width="196" height="178" rx="6"/>
 <text class="tb" x="250" y="72">Zinc finger</text>
 <text class="s" x="250" y="90">largest human family</text>
 <circle class="me" cx="276" cy="118" r="10"/><text class="m" x="290" y="122">Zn</text>
 <circle class="me" cx="336" cy="118" r="10"/><text class="m" x="350" y="122">Zn</text>
 <circle class="me" cx="396" cy="118" r="10"/>
 <text class="s" x="250" y="146">Cys and His residues coordinate the ion</text>
 <line class="dna" x1="250" y1="178" x2="420" y2="178"/>
 <line class="dna" x1="250" y1="196" x2="420" y2="196"/>
 <rect class="pr" x="262" y="166" width="28" height="24"/>
 <rect class="pr" x="322" y="166" width="28" height="24"/>
 <rect class="pr" x="382" y="166" width="28" height="24"/>
 <text class="s" x="250" y="220">one finger reads about 3 bp; add fingers, read more</text>

 <rect class="bx" x="446" y="52" width="196" height="178" rx="6"/>
 <text class="tb" x="458" y="72">Leucine zipper</text>
 <text class="s" x="458" y="90">dimer is obligatory</text>
 <path d="M510 104 l24 44 l-24 44" stroke="#1a4f8a" stroke-width="3.4" fill="none"/>
 <path d="M558 104 l-24 44 l24 44" stroke="#2e7d32" stroke-width="3.4" fill="none"/>
 <text class="m" x="462" y="112">Leu</text><text class="m" x="462" y="140">Leu</text><text class="m" x="462" y="168">Leu</text>
 <text class="s" x="580" y="124">every 7th</text>
 <text class="s" x="580" y="142">residue, so</text>
 <text class="s" x="580" y="160">one face is</text>
 <text class="s" x="580" y="178">hydrophobic</text>
 <line class="dna" x1="458" y1="206" x2="630" y2="206"/>
 <text class="s" x="458" y="224">basic arms from each monomer grip the DNA</text>

 <rect class="bx" x="654" y="52" width="186" height="178" rx="6"/>
 <text class="tb" x="666" y="72">Helix-loop-helix</text>
 <text class="s" x="666" y="90">dimer is obligatory</text>
 <path d="M700 108 l0 40" stroke="#1a4f8a" stroke-width="3.4"/>
 <path d="M700 148 q16 20 32 0" stroke="#1a4f8a" stroke-width="2.6" fill="none"/>
 <path d="M732 148 l0 -40" stroke="#1a4f8a" stroke-width="3.4"/>
 <path d="M770 108 l0 40" stroke="#2e7d32" stroke-width="3.4"/>
 <path d="M770 148 q16 20 32 0" stroke="#2e7d32" stroke-width="2.6" fill="none"/>
 <path d="M802 148 l0 -40" stroke="#2e7d32" stroke-width="3.4"/>
 <line class="dna" x1="666" y1="186" x2="828" y2="186"/>
 <text class="s" x="666" y="212">MyoD, which sets muscle differentiation,</text>
 <text class="s" x="666" y="226">belongs to this family</text>

 <text class="th" x="20" y="276">B  Dimerisation multiplies specificity</text>
 <line x1="20" y1="286" x2="430" y2="286" stroke="#c6d2dd" stroke-width="1.5"/>
 <text class="s" x="30" y="308">three proteins A, B, C give six pairings</text>
 <text class="m" x="30" y="332">AA   BB   CC      AB   AC   BC</text>
 <text class="s" x="30" y="356">each pairing prefers a different sequence, so there are</text>
 <text class="s" x="30" y="374">more binding specificities than there are proteins</text>

 <text class="th" x="460" y="276">C  A partner without an activation domain represses</text>
 <line x1="460" y1="286" x2="860" y2="286" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="pr" x="480" y="302" width="60" height="24"/><text class="s" x="492" y="319">DBD</text>
 <rect class="ex" x="540" y="302" width="86" height="24"/><text class="s" x="552" y="319">activation</text>
 <rect class="pr" x="480" y="330" width="60" height="24"/><text class="s" x="492" y="347">DBD</text>
 <rect class="bx" x="540" y="330" width="86" height="24"/><text class="s" x="552" y="347">none</text>
 <line class="dna" x1="470" y1="378" x2="700" y2="378"/>
 <rect class="k" x="520" y="368" width="70" height="20"/>
 <text class="s" x="470" y="412">the heterodimer still binds the site but cannot raise</text>
 <text class="s" x="470" y="430">transcription: it occupies the place and blocks it</text>
 <text class="s" x="470" y="452">changing the amount of the partner alone switches the gene off</text>
</svg>
