<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img"
     aria-label="Comparison of Sanger dideoxy sequencing with massively parallel sequencing, showing chain termination and size separation versus simultaneous reading of millions of immobilised clusters">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .sub{font:12px sans-serif;fill:#4a5159}
    .lab{font:700 13px sans-serif;fill:#16191d}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.4}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
    .ar{stroke:#16191d;stroke-width:2;fill:none;marker-end:url(#a1)}
    .dna{stroke:#16191d;stroke-width:2.6;fill:none}
    .stop{fill:#f2b705;stroke:#16191d;stroke-width:1.2}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16191d"/>
    </marker>
  </defs>

  <text class="ttl" x="24" y="24">A. Sanger dideoxy sequencing: one reaction gives one read of 700-900 bases</text>
  <rect class="box" x="24" y="38" width="392" height="156" rx="8"/>
  <text class="sub" x="38" y="58">Template + primer + DNA polymerase + 4 dNTP + trace ddNTP</text>
  <text class="sub" x="38" y="74">ddNTP lacks the 3' hydroxyl, so the chain stops where it is inserted</text>
  <g>
    <path class="dna" d="M44 100 L140 100"/><circle class="stop" cx="146" cy="100" r="6"/>
    <path class="dna" d="M44 124 L196 124"/><circle class="stop" cx="202" cy="124" r="6"/>
    <path class="dna" d="M44 148 L252 148"/><circle class="stop" cx="258" cy="148" r="6"/>
    <path class="dna" d="M44 172 L308 172"/><circle class="stop" cx="314" cy="172" r="6"/>
  </g>
  <text class="sub" x="330" y="104">stop at A</text>
  <text class="sub" x="330" y="128">stop at G</text>
  <text class="sub" x="330" y="152">stop at T</text>
  <text class="sub" x="330" y="176">stop at C</text>

  <path class="ar" d="M220 200 L220 228"/>
  <text class="sub" x="232" y="220">separate by length (capillary electrophoresis)</text>
  <rect class="hl" x="24" y="234" width="392" height="62" rx="8"/>
  <text class="lab" x="38" y="256">Read the order of terminating bases</text>
  <text class="sub" x="38" y="276">Read length 700-900 bp; throughput limited to one read per reaction</text>

  <line x1="440" y1="20" x2="440" y2="410" stroke="#c6d2dd" stroke-width="1.4"/>

  <text class="ttl" x="462" y="24">B. Massively parallel sequencing: hundreds of millions of reads at once</text>
  <rect class="box" x="462" y="38" width="376" height="124" rx="8"/>
  <text class="lab" x="476" y="58">1. Fragment and ligate common adapters</text>
  <path class="dna" d="M480 74 L700 74"/>
  <g stroke="#16191d" stroke-width="1.2">
    <line x1="530" y1="66" x2="530" y2="82"/><line x1="586" y1="66" x2="586" y2="82"/>
    <line x1="642" y1="66" x2="642" y2="82"/>
  </g>
  <text class="lab" x="476" y="104">2. Immobilise and amplify locally into clusters</text>
  <g fill="#fff5d6" stroke="#f2b705" stroke-width="1.4">
    <circle cx="492" cy="130" r="11"/><circle cx="522" cy="130" r="11"/><circle cx="552" cy="130" r="11"/>
    <circle cx="582" cy="130" r="11"/><circle cx="612" cy="130" r="11"/><circle cx="642" cy="130" r="11"/>
    <circle cx="672" cy="130" r="11"/><circle cx="702" cy="130" r="11"/>
  </g>
  <text class="sub" x="722" y="134">millions of clusters</text>
  <text class="sub" x="476" y="154">3. Read one base per cycle across the whole surface in parallel</text>

  <rect class="hl" x="462" y="176" width="376" height="86" rx="8"/>
  <text class="lab" x="476" y="198">Read length 100-300 bp, output 10-100s of Gb per run</text>
  <text class="sub" x="476" y="220">Short reads cannot be placed inside repeats longer than the read,</text>
  <text class="sub" x="476" y="238">so assembly breaks at repetitive regions</text>
  <text class="sub" x="476" y="256">Depth of coverage replaces per-read accuracy</text>

  <text class="ttl" x="462" y="292">C. Long-read sequencing</text>
  <rect class="box" x="462" y="302" width="376" height="94" rx="8"/>
  <text class="sub" x="476" y="324">Single molecule read through a nanopore or by real-time</text>
  <text class="sub" x="476" y="342">observation of one polymerase</text>
  <text class="lab" x="476" y="366">Read length 10 kb to over 1 Mb</text>
  <text class="sub" x="476" y="386">Spans repeats, centromeres and structural variants</text>

  <rect class="box" x="24" y="312" width="392" height="84" rx="8"/>
  <text class="lab" x="38" y="334">Assembly strategies of the Human Genome Project</text>
  <text class="sub" x="38" y="356">Hierarchical shotgun: map large clones first, then sequence each</text>
  <text class="sub" x="38" y="376">Whole-genome shotgun: fragment the whole genome, assemble by computation</text>
</svg>
