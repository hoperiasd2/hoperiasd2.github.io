<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
 aria-label="Assembly of the RNA polymerase II preinitiation complex: TBP binding the TATA box and bending the DNA, TFIIB setting the direction, polymerase arriving with TFIIF, TFIIH providing helicase and kinase activity, and the phosphorylated carboxy-terminal domain becoming a platform for processing factors.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .g{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.6}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .arr{stroke:#b3261e;stroke-width:2;fill:none;marker-end:url(#b)}
  .ex{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .pr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker></defs>
 <text class="th" x="20" y="28">A  Each factor builds the landing site for the next</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="dna" d="M30 92 L130 92 q40 0 60 26 q20 26 60 26 L420 144"/>
 <rect class="k" x="150" y="96" width="56" height="22"/>
 <text class="s" x="156" y="112">TATA</text>
 <ellipse class="pr" cx="178" cy="78" rx="38" ry="18"/>
 <text class="tb" x="158" y="83">TBP</text>
 <text class="tb" x="30" y="62">1  TFIID</text>
 <text class="s" x="240" y="78">TBP inserts into the minor groove</text>
 <text class="s" x="240" y="96">and bends the DNA about 80 degrees</text>
 <text class="s" x="240" y="114">the bend creates the geometry the rest need</text>
 <text class="s" x="240" y="132">no TATA box? TAF subunits read other core elements</text>

 <text class="tb" x="30" y="186">2  TFIIB</text>
 <ellipse class="pr" cx="178" cy="196" rx="34" ry="16"/>
 <text class="tb" x="156" y="201">TFIIB</text>
 <path class="arr" d="M214 196 L286 196"/>
 <text class="s" x="294" y="192">binds TBP and fixes which way</text>
 <text class="s" x="294" y="210">transcription will run</text>

 <text class="tb" x="30" y="252">3  TFIIF + Pol II</text>
 <ellipse class="g" cx="196" cy="258" rx="46" ry="20"/>
 <text class="tb" x="172" y="263">Pol II</text>
 <text class="s" x="294" y="254">TFIIF escorts the polymerase onto</text>
 <text class="s" x="294" y="272">the site TFIIB prepared</text>

 <text class="tb" x="30" y="312">4  TFIIE</text>
 <ellipse class="pr" cx="178" cy="318" rx="34" ry="16"/>
 <text class="tb" x="156" y="323">TFIIE</text>
 <text class="s" x="294" y="320">recruits the next factor</text>

 <text class="tb" x="30" y="372">5  TFIIH</text>
 <ellipse class="k" cx="178" cy="378" rx="34" ry="16"/>
 <text class="tb" x="156" y="383">TFIIH</text>
 <text class="s" x="294" y="366">helicase  unwinds DNA at the start site</text>
 <text class="s" x="294" y="386">kinase    phosphorylates the Pol II CTD</text>
 <text class="s" x="294" y="406">once phosphorylated, Pol II leaves the complex and elongates</text>
 <text class="s" x="30" y="440">the assembled set is the preinitiation complex (PIC)</text>

 <text class="th" x="20" y="462">B  the phosphorylated CTD is not just a start signal: it is the platform that loads capping, splicing and 3' end factors in turn</text>
</svg>
