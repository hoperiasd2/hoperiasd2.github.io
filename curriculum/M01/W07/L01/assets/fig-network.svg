<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"
     aria-label="Structure of gene regulatory networks: a scale-free degree distribution with hubs, differing response to random and targeted node removal, and the feed-forward loop and negative feedback motifs">
  <style>
    .ttl{font:700 15px sans-serif;fill:#003c71}
    .sub{font:12px sans-serif;fill:#4a5159}
    .lab{font:700 12px sans-serif;fill:#16191d}
    .box{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.4}
    .hl{fill:#fff5d6;stroke:#f2b705;stroke-width:1.8}
    .e{stroke:#4a5159;stroke-width:1.3}
    .n{fill:#ffffff;stroke:#16191d;stroke-width:1.4}
    .hub{fill:#f2b705;stroke:#16191d;stroke-width:1.8}
    .ar{stroke:#16191d;stroke-width:2;fill:none;marker-end:url(#a1)}
    .inh{stroke:#16191d;stroke-width:2;fill:none;marker-end:url(#bar)}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16191d"/>
    </marker>
    <marker id="bar" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 0 L2 10" stroke="#16191d" stroke-width="3"/>
    </marker>
  </defs>

  <text class="ttl" x="24" y="24">A. Scale-free topology: most nodes have few edges, a few hubs have many</text>
  <rect class="box" x="24" y="34" width="372" height="196" rx="8"/>
  <g class="e">
    <line x1="200" y1="132" x2="110" y2="70"/><line x1="200" y1="132" x2="150" y2="196"/>
    <line x1="200" y1="132" x2="270" y2="66"/><line x1="200" y1="132" x2="296" y2="128"/>
    <line x1="200" y1="132" x2="252" y2="200"/><line x1="200" y1="132" x2="74" y2="138"/>
    <line x1="110" y1="70" x2="74" y2="138"/><line x1="270" y1="66" x2="330" y2="88"/>
    <line x1="296" y1="128" x2="348" y2="166"/><line x1="252" y1="200" x2="320" y2="206"/>
    <line x1="150" y1="196" x2="96" y2="206"/>
  </g>
  <circle class="hub" cx="200" cy="132" r="15"/>
  <g class="n">
    <circle cx="110" cy="70" r="8"/><circle cx="150" cy="196" r="8"/><circle cx="270" cy="66" r="8"/>
    <circle cx="296" cy="128" r="8"/><circle cx="252" cy="200" r="8"/><circle cx="74" cy="138" r="8"/>
    <circle cx="330" cy="88" r="8"/><circle cx="348" cy="166" r="8"/><circle cx="320" cy="206" r="8"/>
    <circle cx="96" cy="206" r="8"/>
  </g>
  <text class="lab" x="192" y="166">hub</text>
  <text class="sub" x="38" y="56">node = protein or gene, edge = interaction or regulation</text>
  <text class="sub" x="38" y="222">In yeast, deletion of a hub gene is lethal more often than deletion of a peripheral gene</text>

  <text class="ttl" x="420" y="24">B. Robustness depends on which node is lost</text>
  <rect class="box" x="420" y="34" width="414" height="196" rx="8"/>
  <text class="lab" x="436" y="56">Random node removal</text>
  <g class="e">
    <line x1="520" y1="124" x2="470" y2="86"/><line x1="520" y1="124" x2="478" y2="162"/>
    <line x1="520" y1="124" x2="570" y2="86"/><line x1="520" y1="124" x2="574" y2="160"/>
    <line x1="570" y1="86" x2="610" y2="118"/>
  </g>
  <circle class="hub" cx="520" cy="124" r="13"/>
  <g class="n"><circle cx="470" cy="86" r="7"/><circle cx="478" cy="162" r="7"/>
    <circle cx="570" cy="86" r="7"/><circle cx="610" cy="118" r="7"/></g>
  <g stroke="#16191d" stroke-width="2">
    <line x1="568" y1="153" x2="580" y2="167"/><line x1="580" y1="153" x2="568" y2="167"/>
  </g>
  <text class="sub" x="436" y="196">connectivity of the rest is preserved</text>
  <text class="sub" x="436" y="212">no visible phenotype in many single deletions</text>

  <text class="lab" x="672" y="56">Hub removal</text>
  <g class="e" stroke-dasharray="4 4">
    <line x1="744" y1="124" x2="694" y2="86"/><line x1="744" y1="124" x2="700" y2="162"/>
    <line x1="744" y1="124" x2="794" y2="86"/><line x1="744" y1="124" x2="798" y2="160"/>
  </g>
  <g stroke="#16191d" stroke-width="2.6">
    <line x1="734" y1="114" x2="754" y2="134"/><line x1="754" y1="114" x2="734" y2="134"/>
  </g>
  <g class="n"><circle cx="694" cy="86" r="7"/><circle cx="700" cy="162" r="7"/>
    <circle cx="794" cy="86" r="7"/><circle cx="798" cy="160" r="7"/></g>
  <text class="sub" x="664" y="196">the network fragments quickly</text>

  <text class="ttl" x="24" y="258">C. Network motifs: small wiring patterns found more often than chance predicts</text>
  <rect class="hl" x="24" y="268" width="372" height="134" rx="8"/>
  <text class="lab" x="40" y="290">Feed-forward loop</text>
  <circle class="n" cx="80" cy="320" r="14"/><text class="lab" x="75" y="325">A</text>
  <circle class="n" cx="200" cy="320" r="14"/><text class="lab" x="195" y="325">B</text>
  <circle class="n" cx="200" cy="378" r="14"/><text class="lab" x="195" y="383">C</text>
  <path class="ar" d="M96 318 L182 318"/>
  <path class="ar" d="M86 334 L188 372"/>
  <path class="ar" d="M200 336 L200 362"/>
  <text class="sub" x="232" y="318">A regulates both B and C,</text>
  <text class="sub" x="232" y="336">and B also regulates C</text>
  <text class="sub" x="232" y="360">Depending on the signs it filters</text>
  <text class="sub" x="232" y="378">brief noise or times a response</text>

  <rect class="box" x="420" y="268" width="414" height="134" rx="8"/>
  <text class="lab" x="436" y="290">Feedback sets the dynamics</text>
  <circle class="n" cx="480" cy="330" r="14"/><text class="lab" x="475" y="335">X</text>
  <circle class="n" cx="600" cy="330" r="14"/><text class="lab" x="595" y="335">Y</text>
  <path class="ar" d="M496 330 L582 330"/>
  <path class="inh" d="M600 348 C600 384, 480 384, 480 350"/>
  <text class="sub" x="636" y="306">Negative feedback stabilises a steady</text>
  <text class="sub" x="636" y="324">state and speeds the response;</text>
  <text class="sub" x="636" y="342">with delay it generates oscillation</text>
  <text class="sub" x="636" y="366">Positive feedback creates two stable</text>
  <text class="sub" x="636" y="384">states and an irreversible switch</text>
</svg>
