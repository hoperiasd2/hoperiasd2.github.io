<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img"
 aria-label="Modular structure of a transcription factor and the four types of DNA-binding domain: separation of DNA-binding and activation domains, the different consequence of a defect in each including dominant negative effect, the logic of a domain-swap experiment, and the structure and dimer formation of helix-turn-helix, zinc finger, leucine zipper and helix-loop-helix.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .dbd{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .ad{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .xx{fill:#fff;stroke:#b3261e;stroke-width:2.2;stroke-dasharray:4 3}
  .dna{fill:none;stroke:#16191d;stroke-width:2.6}
  .hel{fill:none;stroke:#003c71;stroke-width:3.4}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  Two jobs, two domains</text>
 <line x1="20" y1="38" x2="430" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="dbd" x="40" y="58" width="120" height="30" rx="6"/>
 <text class="m" x="62" y="78">DBD</text>
 <rect class="ad" x="160" y="58" width="130" height="30" rx="6"/>
 <text class="m" x="196" y="78">AD</text>
 <text class="s" x="40" y="106">finds the target sequence</text>
 <text class="s" x="190" y="106">talks to mediator, GTFs, chromatin enzymes</text>
 <path class="dna" d="M40 128 h340"/>
 <text class="s" x="40" y="148">plus regulatory parts: ligand site, phosphorylation site, nuclear import signal</text>

 <text class="th" x="20" y="184">B  The two defects differ</text>
 <line x1="20" y1="194" x2="430" y2="194" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="dbd" x="40" y="212" width="90" height="26" rx="5"/>
 <text class="m" x="58" y="230">DBD ok</text>
 <rect class="xx" x="130" y="212" width="90" height="26" rx="5"/>
 <text class="m" x="146" y="230">AD broken</text>
 <path class="dna" d="M40 250 h340"/>
 <text class="t" x="240" y="230">binds but cannot activate;</text>
 <text class="t" x="240" y="246">occupies the site and blocks</text>
 <text class="tb" x="240" y="266">the normal factor: DOMINANT NEGATIVE</text>

 <rect class="xx" x="40" y="290" width="90" height="26" rx="5"/>
 <text class="m" x="50" y="308">DBD broken</text>
 <rect class="ad" x="130" y="290" width="90" height="26" rx="5"/>
 <text class="m" x="150" y="308">AD ok</text>
 <path class="dna" d="M40 340 h340"/>
 <text class="t" x="240" y="306">cannot find the target:</text>
 <text class="tb" x="240" y="326">simple LOSS OF FUNCTION</text>
 <text class="s" x="40" y="366">Which domain a patient's mutation hits changes the inheritance pattern and severity.</text>

 <text class="th" x="20" y="402">C  Domain swap proves they are separable</text>
 <line x1="20" y1="412" x2="430" y2="412" stroke="#c6d2dd" stroke-width="1.5"/>
 <text class="t" x="20" y="434">Join factor 1's DBD to factor 2's AD and factor 2's activation appears at factor 1's sequence.</text>
 <text class="s" x="20" y="452">This is the design principle behind the yeast two-hybrid assay and CRISPR activation tools.</text>

 <text class="th" x="460" y="38">D  Four DNA-binding domain types</text>
 <line x1="460" y1="48" x2="860" y2="48" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="hel" d="M478 86 h40 M478 86 q20 -22 40 0" />
 <path class="hel" d="M478 108 h40"/>
 <text class="tb" x="534" y="92">Helix-turn-helix</text>
 <text class="s" x="534" y="110">no metal · HOX homeodomain, Pit-1</text>

 <path class="hel" d="M486 150 q-12 -20 6 -26 q18 -6 18 14 q0 18 -18 14 z"/>
 <circle cx="498" cy="150" r="5" fill="#f2b705" stroke="#8a6300" stroke-width="1.4"/>
 <text class="m" x="490" y="170">Zn</text>
 <text class="tb" x="534" y="146">Zinc finger</text>
 <text class="s" x="534" y="164">needs Zn(2+) · Sp1, nuclear receptors, GATA</text>

 <path class="hel" d="M478 208 h46 M478 224 h46"/>
 <path class="hel" d="M496 208 l0 16 M510 208 l0 16" stroke-width="2"/>
 <text class="tb" x="534" y="212">Leucine zipper</text>
 <text class="s" x="534" y="230">dimer via leucine faces · C/EBP, Jun-Fos, CREB</text>

 <path class="hel" d="M478 272 h30 q14 10 0 20 h-30"/>
 <path class="hel" d="M514 272 h30 q-14 10 0 20 h-30" transform="translate(0,0)"/>
 <text class="tb" x="534" y="276">Helix-loop-helix</text>
 <text class="s" x="534" y="294">dimer · MyoD, Myc, SREBP</text>

 <rect class="k" x="460" y="314" width="400" height="128" rx="8"/>
 <text class="tb" x="474" y="338">The common principle: most act as DIMERS</text>
 <text class="t" x="474" y="362">A dimer reads a longer sequence, so selectivity rises.</text>
 <text class="t" x="474" y="384">And the partner changes what the factor does, so PARTNER</text>
 <text class="t" x="474" y="402">CHOICE is itself a means of control.</text>
 <text class="s" x="474" y="426">Jun with Fos gives AP-1; Myc pairs with Max.</text>
</svg>
