<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img"
     aria-label="Enhancer action through DNA looping, the role of insulators and topologically associating domains, and enhancer hijacking by a chromosomal rearrangement">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .dna { stroke:#16191d; stroke-width:2.6; fill:none; }
    .enh { fill:#f2b705; stroke:#16191d; stroke-width:1.2; }
    .prom { fill:#003c71; stroke:#16191d; stroke-width:1.2; }
    .gene { fill:#003c71; stroke:#16191d; stroke-width:1.2; }
    .ins { fill:#ffffff; stroke:#16191d; stroke-width:1.4; }
    .gl { font:700 11px sans-serif; fill:#ffffff; }
    .rl { font:700 11px sans-serif; fill:#16191d; }
    .tf { fill:#fff5d6; stroke:#003c71; stroke-width:1.3; }
    .ln { stroke:#003c71; stroke-width:1.5; fill:none; }
    .bad { stroke:#8a6300; stroke-width:2; fill:none; stroke-dasharray:5 3; }
  </style>
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="26">A. An enhancer reaches its promoter by looping the DNA</text>
  <path class="dna" d="M40 150 C120 70 200 70 240 110 C280 150 320 190 420 190 L820 190"/>
  <rect class="enh" x="40" y="138" width="80" height="24" transform="rotate(-38 80 150)"/>
  <text class="rl" x="30" y="190">enhancer</text>
  <rect class="prom" x="420" y="178" width="70" height="24"/><text class="gl" x="428" y="195">prom</text>
  <rect class="gene" x="500" y="174" width="180" height="32"/><text class="gl" x="540" y="195">target gene</text>
  <ellipse class="tf" cx="140" cy="88" rx="56" ry="17"/><text class="nm" x="100" y="94">activators</text>
  <ellipse class="tf" cx="300" cy="118" rx="54" ry="17"/><text class="nm" x="258" y="124">Mediator</text>
  <path class="ln" d="M354 126 L414 160" marker-end="url(#n1)"/>
  <text class="sub" x="700" y="150">Distance in base pairs does not</text>
  <text class="sub" x="700" y="168">matter; the loop does. Cohesin</text>
  <text class="sub" x="700" y="186">and CTCF organise the loops.</text>

  <text class="ttl" x="20" y="252">B. Insulators keep an enhancer inside its own domain</text>
  <path class="dna" d="M40 300 L840 300"/>
  <rect class="ins" x="300" y="288" width="60" height="24"/><text class="rl" x="310" y="305">CTCF</text>
  <rect class="enh" x="120" y="288" width="80" height="24"/><text class="rl" x="128" y="305">enhancer</text>
  <rect class="gene" x="200" y="284" width="90" height="32"/><text class="gl" x="214" y="305">gene A</text>
  <rect class="gene" x="420" y="284" width="90" height="32"/><text class="gl" x="434" y="305">gene B</text>
  <path class="ln" d="M160 284 C180 254 220 254 240 280" marker-end="url(#n1)"/>
  <path class="bad" d="M160 320 C240 348 400 348 460 322"/>
  <text class="sub" x="300" y="340">blocked by the insulator</text>
  <text class="sub" x="560" y="296">The domain bounded by CTCF sites is a topologically</text>
  <text class="sub" x="560" y="314">associating domain (TAD): enhancers act within it.</text>

  <text class="ttl" x="20" y="372">C. Enhancer hijacking: a rearrangement puts a strong enhancer beside the wrong gene</text>
  <path class="dna" d="M40 398 L400 398"/>
  <rect class="enh" x="60" y="386" width="110" height="22"/><text class="rl" x="66" y="402">IGH enhancer</text>
  <rect class="gene" x="200" y="384" width="80" height="28"/><text class="gl" x="222" y="403">MYC</text>
  <text class="sub" x="420" y="402">t(8;14) in Burkitt lymphoma: the MYC protein is normal, but it is transcribed at the wrong level in the wrong cell.</text>
</svg>
