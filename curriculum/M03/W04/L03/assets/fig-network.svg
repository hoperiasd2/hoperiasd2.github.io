<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"
     aria-label="Regulatory network motifs: a hierarchical cascade in development, positive feedback that locks in a cell state, negative feedback that limits a response, and a master regulator that switches cell identity">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .node { fill:#ffffff; stroke:#003c71; stroke-width:1.6; }
    .nodek { fill:#f2b705; stroke:#16191d; stroke-width:1.4; }
    .nl { font:700 11px sans-serif; fill:#003c71; }
    .nk { font:700 11px sans-serif; fill:#16191d; }
    .ln { stroke:#003c71; stroke-width:1.8; fill:none; }
    .inh { stroke:#8a6300; stroke-width:1.8; fill:none; }
  </style>
  <defs>
    <marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
    <marker id="w2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M5 0 L5 10" stroke="#8a6300" stroke-width="2.5"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="26">Four recurring shapes in transcriptional networks</text>

  <text class="nm" x="24" y="62">1. Hierarchical cascade</text>
  <ellipse class="nodek" cx="80" cy="100" rx="42" ry="18"/><text class="nk" x="54" y="105">signal</text>
  <path class="ln" d="M124 100 L166 100" marker-end="url(#w1)"/>
  <ellipse class="node" cx="212" cy="100" rx="46" ry="18"/><text class="nl" x="186" y="105">factor A</text>
  <path class="ln" d="M260 100 L302 100" marker-end="url(#w1)"/>
  <ellipse class="node" cx="348" cy="100" rx="46" ry="18"/><text class="nl" x="322" y="105">factor B</text>
  <path class="ln" d="M396 100 L438 100" marker-end="url(#w1)"/>
  <ellipse class="node" cx="492" cy="100" rx="54" ry="18"/><text class="nl" x="456" y="105">effector genes</text>
  <text class="sub" x="570" y="92">One signal is amplified into a</text>
  <text class="sub" x="570" y="110">programme of many genes.</text>
  <text class="sub" x="570" y="128">HOX genes act this way in the embryo.</text>

  <text class="nm" x="24" y="186">2. Positive feedback: locks a state in</text>
  <ellipse class="node" cx="130" cy="228" rx="46" ry="18"/><text class="nl" x="110" y="233">MyoD</text>
  <path class="ln" d="M176 222 C230 198 290 198 338 220" marker-end="url(#w1)"/>
  <ellipse class="node" cx="390" cy="228" rx="60" ry="18"/><text class="nl" x="350" y="233">muscle genes</text>
  <path class="ln" d="M370 246 C300 278 190 278 134 250" marker-end="url(#w1)"/>
  <text class="sub" x="200" y="290">MyoD also activates its own gene</text>
  <text class="sub" x="490" y="222">Once on, the state persists after the</text>
  <text class="sub" x="490" y="240">original signal is gone: this is how a</text>
  <text class="sub" x="490" y="258">cell keeps its identity.</text>

  <text class="nm" x="24" y="336">3. Negative feedback: limits a response</text>
  <ellipse class="node" cx="130" cy="378" rx="50" ry="18"/><text class="nl" x="98" y="383">NF-kappaB</text>
  <path class="ln" d="M182 372 C236 350 290 350 330 370" marker-end="url(#w1)"/>
  <ellipse class="node" cx="384" cy="378" rx="46" ry="18"/><text class="nl" x="356" y="383">I-kappaB</text>
  <path class="inh" d="M360 394 C300 414 196 414 140 398" marker-end="url(#w2)"/>
  <text class="sub" x="490" y="366">The target shuts the factor off, so the</text>
  <text class="sub" x="490" y="384">response is transient and graded.</text>
  <text class="sub" x="490" y="402">A broken brake gives sustained inflammation.</text>
</svg>
