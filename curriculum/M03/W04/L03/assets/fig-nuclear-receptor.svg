<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
     aria-label="Two classes of nuclear receptor: steroid receptors held in the cytosol until ligand binding, and thyroid hormone or retinoid receptors already bound to DNA with a corepressor">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .cellb { fill:none; stroke:#003c71; stroke-width:1.6; }
    .nuc { fill:#e8eef4; stroke:#003c71; stroke-width:1.4; }
    .rec { fill:#003c71; stroke:#16191d; stroke-width:1.2; }
    .rl { font:700 11px sans-serif; fill:#ffffff; }
    .lig { fill:#f2b705; stroke:#16191d; stroke-width:1.2; }
    .hsp { fill:#ffffff; stroke:#16191d; stroke-width:1.3; }
    .dna { stroke:#16191d; stroke-width:2.4; fill:none; }
    .co { fill:#fff5d6; stroke:#003c71; stroke-width:1.3; }
    .ln { stroke:#003c71; stroke-width:1.6; fill:none; }
    .out { font:700 11px sans-serif; fill:#8a6300; }
  </style>
  <defs>
    <marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="24">A. Type I: steroid receptors (GR, MR, AR, PR, ER)</text>
  <rect class="cellb" x="30" y="38" width="820" height="160" rx="12"/>
  <circle class="lig" cx="70" cy="66" r="10"/>
  <text class="sub" x="86" y="70">lipophilic hormone crosses the membrane</text>
  <rect class="rec" x="120" y="110" width="80" height="26" rx="4"/><text class="rl" x="146" y="129">GR</text>
  <ellipse class="hsp" cx="160" cy="88" rx="46" ry="14"/><text class="nm" x="138" y="93">HSP90</text>
  <text class="sub" x="106" y="158">inactive in the cytosol</text>
  <path class="ln" d="M212 122 L268 122" marker-end="url(#v1)"/>
  <text class="sub" x="214" y="112">ligand binds,</text>
  <text class="sub" x="214" y="152">HSP90 leaves</text>
  <rect class="nuc" x="290" y="54" width="548" height="134" rx="10"/>
  <text class="nm" x="302" y="74">nucleus</text>
  <rect class="rec" x="400" y="110" width="60" height="26" rx="4"/>
  <rect class="rec" x="462" y="110" width="60" height="26" rx="4"/>
  <circle class="lig" cx="430" cy="98" r="8"/><circle class="lig" cx="492" cy="98" r="8"/>
  <path class="dna" d="M330 150 L800 150"/>
  <rect class="lig" x="400" y="138" width="122" height="22"/>
  <text class="sub" x="404" y="176">hormone response element (inverted repeat)</text>
  <text class="out" x="600" y="118">homodimer binds and</text>
  <text class="out" x="600" y="136">recruits coactivators</text>

  <text class="ttl" x="20" y="238">B. Type II: thyroid hormone, retinoic acid and vitamin D receptors</text>
  <rect class="nuc" x="30" y="252" width="820" height="160" rx="12"/>
  <text class="nm" x="44" y="272">nucleus - the receptor is already on the DNA</text>
  <rect class="rec" x="120" y="310" width="60" height="26" rx="4"/><text class="rl" x="134" y="329">TR</text>
  <rect class="rec" x="182" y="310" width="60" height="26" rx="4"/><text class="rl" x="194" y="329">RXR</text>
  <path class="dna" d="M60 350 L380 350"/>
  <rect class="lig" x="120" y="338" width="122" height="22"/>
  <ellipse class="co" cx="180" cy="290" rx="74" ry="15"/><text class="nm" x="124" y="295">corepressor, HDAC</text>
  <text class="out" x="60" y="386">no ligand: the gene is actively repressed</text>
  <path class="ln" d="M396 330 L452 330" marker-end="url(#v1)"/>
  <circle class="lig" cx="424" cy="306" r="9"/>
  <text class="sub" x="398" y="296">T3</text>
  <rect class="rec" x="520" y="310" width="60" height="26" rx="4"/><text class="rl" x="534" y="329">TR</text>
  <rect class="rec" x="582" y="310" width="60" height="26" rx="4"/><text class="rl" x="594" y="329">RXR</text>
  <circle class="lig" cx="550" cy="298" r="8"/>
  <path class="dna" d="M470 350 L830 350"/>
  <rect class="lig" x="520" y="338" width="122" height="22"/>
  <ellipse class="co" cx="700" cy="290" rx="86" ry="15"/><text class="nm" x="630" y="295">coactivator, HAT activity</text>
  <text class="out" x="470" y="386">ligand swaps corepressor for coactivator: the gene turns on</text>
</svg>
