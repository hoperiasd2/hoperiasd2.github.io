<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="The difference between a cis-acting element and a trans-acting factor: an operator acts only on targets joined to the same DNA molecule while the LacI protein diffuses and can reach another DNA molecule, and the asymmetry in a complementation test where a lacI defect is complemented but an operator defect is not.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .dna{fill:#fff;stroke:#16191d;stroke-width:2.2}
  .oper{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .operX{fill:#fff;stroke:#b3261e;stroke-width:2;stroke-dasharray:3 3}
  .gene{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .lacI{fill:#e8eff6;stroke:#003c71;stroke-width:2}
  .rep{fill:#f7dedc;stroke:#b3261e;stroke-width:2.4}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .diff{stroke:#2e7d32;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
 </defs>

 <text class="th" x="20" y="28">A  A sequence is tied to its place; a protein is not</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="20" y="54" width="410" height="128" rx="8"/>
 <text class="tb" x="34" y="78">CIS-acting element: operator</text>
 <rect class="dna" x="40" y="104" width="370" height="20"/>
 <rect class="oper" x="110" y="104" width="54" height="20"/>
 <text class="m" x="118" y="119">lacO</text>
 <rect class="gene" x="170" y="104" width="220" height="20"/>
 <text class="m" x="256" y="119">lacZYA</text>
 <path class="ar" d="M137 100 L137 92 L256 92 L256 100"/>
 <text class="s" x="40" y="150">Acts only on the genes joined to the SAME DNA molecule.</text>
 <text class="s" x="40" y="170">A normal operator on another DNA cannot move over and fix this one.</text>

 <rect class="bx" x="450" y="54" width="410" height="128" rx="8"/>
 <text class="tb" x="464" y="78">TRANS-acting factor: LacI protein</text>
 <rect class="dna" x="470" y="104" width="170" height="20"/>
 <rect class="lacI" x="500" y="104" width="54" height="20"/>
 <text class="m" x="508" y="119">lacI</text>
 <rect class="dna" x="680" y="104" width="170" height="20"/>
 <rect class="oper" x="712" y="104" width="54" height="20"/>
 <text class="m" x="720" y="119">lacO</text>
 <rect class="rep" x="596" y="138" width="50" height="26" rx="5"/>
 <text class="m" x="604" y="156">LacI</text>
 <path class="diff" d="M540 128 L600 138"/>
 <path class="diff" d="M650 146 L730 128"/>
 <text class="s" x="460" y="178">Made on one DNA, it diffuses through the cell and binds the operator on another.</text>

 <rect class="k" x="20" y="192" width="840" height="34" rx="8"/>
 <text class="tb" x="34" y="214">"cis" and "trans" name the RANGE over which the action connects, not whether it represses or activates.</text>

 <text class="th" x="20" y="262">B  Complementation test: put a second DNA copy into the cell</text>
 <line x1="20" y1="272" x2="860" y2="272" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="bx" x="20" y="286" width="410" height="146" rx="8"/>
 <text class="tb" x="34" y="310">lacI is broken  to  COMPLEMENTED</text>
 <rect class="dna" x="40" y="330" width="370" height="18"/>
 <rect class="lacI" x="60" y="330" width="46" height="18" stroke-dasharray="3 3"/>
 <text class="m" x="64" y="344">lacI-</text>
 <rect class="oper" x="170" y="330" width="46" height="18"/>
 <rect class="gene" x="216" y="330" width="180" height="18"/>
 <rect class="dna" x="40" y="366" width="200" height="18"/>
 <rect class="lacI" x="60" y="366" width="46" height="18"/>
 <text class="m" x="64" y="380">lacI+</text>
 <rect class="rep" x="150" y="390" width="46" height="24" rx="5"/>
 <text class="m" x="156" y="407">LacI</text>
 <path class="diff" d="M110 384 L156 390"/>
 <path class="diff" d="M196 390 L192 352"/>
 <text class="s" x="240" y="402">New LacI reaches the old operator</text>
 <text class="s" x="240" y="420">and restores repression: TRANS defect.</text>

 <rect class="bx" x="450" y="286" width="410" height="146" rx="8"/>
 <text class="tb" x="464" y="310">operator is broken  to  NOT complemented</text>
 <rect class="dna" x="470" y="330" width="370" height="18"/>
 <rect class="lacI" x="490" y="330" width="46" height="18"/>
 <text class="m" x="494" y="344">lacI+</text>
 <rect class="operX" x="600" y="330" width="46" height="18"/>
 <text class="m" x="604" y="344">lacO-</text>
 <rect class="gene" x="646" y="330" width="180" height="18"/>
 <rect class="rep" x="520" y="364" width="46" height="24" rx="5"/>
 <text class="m" x="526" y="381">LacI</text>
 <path class="diff" d="M566 372 L596 352"/>
 <line class="no" x1="604" y1="356" x2="640" y2="356"/>
 <line class="no" x1="615" y1="346" x2="629" y2="366"/>
 <text class="s" x="464" y="402">The binding site itself is gone. Supplying more LacI</text>
 <text class="s" x="464" y="420">cannot rebuild it: CIS defect, effect stays on this DNA.</text>

 <text class="s" x="20" y="446">Operational rule: complemented means a trans-factor defect; not complemented means a cis-element defect. Note that CAP control survives an operator mutation, so one lost layer does not predict total output.</text>
</svg>
