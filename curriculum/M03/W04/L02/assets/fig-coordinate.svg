<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img"
     aria-label="Coordinate regulation compared: a prokaryotic operon makes one transcript for several genes, while eukaryotic genes on different chromosomes share a response element and a common transcription factor">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .gene { fill:#003c71; stroke:#16191d; stroke-width:1.1; }
    .re { fill:#f2b705; stroke:#16191d; stroke-width:1.1; }
    .gl { font:700 11px sans-serif; fill:#ffffff; }
    .rl { font:700 10px sans-serif; fill:#16191d; }
    .dna { stroke:#16191d; stroke-width:2.2; fill:none; }
    .rna { stroke:#003c71; stroke-width:2.2; fill:none; stroke-dasharray:6 3; }
    .tf { fill:#fff5d6; stroke:#003c71; stroke-width:1.3; }
    .ln { stroke:#003c71; stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="26">Two ways to switch several genes together</text>

  <text class="nm" x="20" y="60">A. Prokaryote: one operon, one promoter, one polycistronic mRNA</text>
  <path class="dna" d="M30 110 L560 110"/>
  <rect class="re" x="60" y="98" width="40" height="24"/><text class="rl" x="74" y="115">P</text>
  <rect class="re" x="100" y="98" width="40" height="24"/><text class="rl" x="114" y="115">O</text>
  <rect class="gene" x="150" y="98" width="110" height="24"/><text class="gl" x="186" y="115">gene 1</text>
  <rect class="gene" x="260" y="98" width="110" height="24"/><text class="gl" x="296" y="115">gene 2</text>
  <rect class="gene" x="370" y="98" width="110" height="24"/><text class="gl" x="406" y="115">gene 3</text>
  <path class="rna" d="M152 82 L480 82" marker-end="url(#o1)"/>
  <text class="sub" x="500" y="86">one mRNA</text>
  <text class="sub" x="30" y="146">Genes must lie next to each other. Stoichiometry of the products is set by one transcript.</text>

  <text class="nm" x="20" y="194">B. Eukaryote: separate genes that share a response element</text>
  <ellipse class="tf" cx="140" cy="232" rx="86" ry="20"/>
  <text class="nm" x="80" y="238">activated factor</text>
  <path class="ln" d="M226 236 C300 236 320 258 352 262" marker-end="url(#o1)"/>
  <path class="ln" d="M226 240 C300 258 320 296 352 302" marker-end="url(#o1)"/>
  <path class="ln" d="M226 244 C300 282 320 336 352 342" marker-end="url(#o1)"/>

  <path class="dna" d="M352 262 L820 262"/>
  <rect class="re" x="360" y="250" width="60" height="24"/><text class="rl" x="368" y="267">RE</text>
  <rect class="gene" x="440" y="250" width="150" height="24"/><text class="gl" x="470" y="267">gene A</text>
  <text class="sub" x="610" y="267">chromosome 1</text>

  <path class="dna" d="M352 302 L820 302"/>
  <rect class="re" x="360" y="290" width="60" height="24"/><text class="rl" x="368" y="307">RE</text>
  <rect class="gene" x="470" y="290" width="150" height="24"/><text class="gl" x="500" y="307">gene B</text>
  <text class="sub" x="640" y="307">chromosome 7</text>

  <path class="dna" d="M352 342 L820 342"/>
  <rect class="re" x="360" y="330" width="60" height="24"/><text class="rl" x="368" y="347">RE</text>
  <rect class="gene" x="500" y="330" width="150" height="24"/><text class="gl" x="530" y="347">gene C</text>
  <text class="sub" x="670" y="347">chromosome 19</text>

  <text class="sub" x="20" y="300">Each gene has its own</text>
  <text class="sub" x="20" y="318">promoter and its own mRNA,</text>
  <text class="sub" x="20" y="336">so the amounts can differ,</text>
  <text class="sub" x="20" y="354">yet all respond to one signal.</text>
</svg>
