<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="Position and binding molecules of promoter and operator: the coordinate system taking the transcription start site as plus one, the conserved minus ten and minus thirty-five sequences of a bacterial promoter, recognition by the sigma factor, and how a regulatory protein bound at the operator obstructs initiation.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .dna{fill:#fff;stroke:#16191d;stroke-width:2.4}
  .prom{fill:#e8eff6;stroke:#003c71;stroke-width:2.2}
  .oper{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .gene{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .pol{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.4}
  .rep{fill:#f7dedc;stroke:#b3261e;stroke-width:2.4}
  .ar{stroke:#003c71;stroke-width:2.4;fill:none;marker-end:url(#a)}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  The coordinate system and the two kinds of regulatory sequence</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="dna" x="40" y="110" width="800" height="26"/>
 <rect class="prom" x="150" y="110" width="60" height="26"/>
 <text class="m" x="162" y="128">-35</text>
 <rect class="prom" x="258" y="110" width="60" height="26"/>
 <text class="m" x="270" y="128">-10</text>
 <rect class="oper" x="330" y="110" width="90" height="26"/>
 <text class="m" x="342" y="128">operator</text>
 <rect class="gene" x="440" y="110" width="330" height="26"/>
 <text class="m" x="560" y="128">structural gene</text>

 <path class="ar" d="M352 152 L352 186"/>
 <text class="m" x="356" y="172">+1</text>
 <text class="s" x="300" y="206">transcription start site: the base where RNA synthesis actually begins</text>
 <text class="s" x="60" y="170">upstream = negative numbers</text>
 <text class="s" x="620" y="170">downstream = positive numbers</text>
 <text class="s" x="150" y="94">PROMOTER: conserved sequences recognised by the sigma factor</text>
 <text class="s" x="330" y="76">OPERATOR</text>

 <text class="th" x="20" y="246">B  Who binds where, and what happens</text>
 <line x1="20" y1="256" x2="430" y2="256" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="dna" x="40" y="300" width="380" height="22"/>
 <rect class="prom" x="110" y="300" width="130" height="22"/>
 <rect class="oper" x="250" y="300" width="70" height="22"/>
 <path class="pol" d="M120 274 h110 v26 h-110 z"/>
 <text class="m" x="134" y="292">RNA pol + sigma</text>
 <path class="ar" d="M330 288 L410 288"/>
 <text class="s" x="40" y="344">Promoter closer to the ideal sequence means initiation happens more often.</text>

 <rect class="dna" x="40" y="396" width="380" height="22"/>
 <rect class="prom" x="110" y="396" width="130" height="22"/>
 <rect class="oper" x="250" y="396" width="70" height="22"/>
 <path class="rep" d="M254 370 h62 v26 h-62 z"/>
 <text class="m" x="262" y="388">repressor</text>
 <path class="pol" d="M120 370 h110 v26 h-110 z"/>
 <line class="no" x1="330" y1="384" x2="400" y2="384"/>
 <line class="no" x1="358" y1="372" x2="372" y2="396"/>
 <text class="s" x="40" y="430">A protein sitting on the operator obstructs the start of transcription.</text>

 <text class="th" x="460" y="246">C  Same DNA, different information</text>
 <line x1="460" y1="256" x2="860" y2="256" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="460" y="270" width="400" height="148" rx="8"/>
 <text class="tb" x="474" y="294">Promoter</text>
 <text class="t" x="600" y="294">Operator</text>
 <line x1="474" y1="302" x2="846" y2="302" stroke="#c6d2dd" stroke-width="1.2"/>
 <text class="t" x="474" y="324">RNA polymerase</text>
 <text class="t" x="600" y="324">regulatory protein</text>
 <text class="t" x="474" y="348">sets WHERE</text>
 <text class="t" x="600" y="348">sets HOW OFTEN</text>
 <text class="t" x="474" y="372">mutation shifts the</text>
 <text class="t" x="600" y="372">mutation changes the</text>
 <text class="t" x="474" y="388">overall output</text>
 <text class="t" x="600" y="388">response to control</text>
 <text class="s" x="474" y="412">Neither sequence codes for protein: both carry positional information.</text>
</svg>
