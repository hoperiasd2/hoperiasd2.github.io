<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img"
     aria-label="Classification of non-coding RNA by size and function, from housekeeping rRNA and tRNA to regulatory microRNA, siRNA, piRNA, long non-coding RNA and circular RNA">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .bx{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.4}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.4}
    .ln{stroke:#003c71;stroke-width:1.6;fill:none}
    .out{font:700 11px sans-serif;fill:#8a6300}
  </style>
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="26">Transcriptional output of the human genome</text>
  <rect class="hl" x="330" y="40" width="230" height="36" rx="6"/>
  <text class="nm" x="356" y="64">all transcribed RNA</text>
  <path class="ln" d="M400 80 L250 112" marker-end="url(#e1)"/>
  <path class="ln" d="M490 80 L640 112" marker-end="url(#e1)"/>
  <rect class="bx" x="120" y="116" width="260" height="56" rx="6"/>
  <text class="nm" x="134" y="138">coding RNA : mRNA</text>
  <text class="sub" x="134" y="158">about 20,000 genes, ~2% of the genome</text>
  <rect class="hl" x="520" y="116" width="260" height="56" rx="6"/>
  <text class="nm" x="534" y="138">non-coding RNA</text>
  <text class="sub" x="534" y="158">the large majority of transcripts</text>
  <path class="ln" d="M600 176 L470 208" marker-end="url(#e1)"/>
  <path class="ln" d="M700 176 L760 208" marker-end="url(#e1)"/>

  <rect class="bx" x="30" y="212" width="400" height="160" rx="8"/>
  <text class="nm" x="44" y="234">Housekeeping (constitutive)</text>
  <text class="sub" x="44" y="256">rRNA   18S, 5.8S, 28S, 5S   ribosome core</text>
  <text class="sub" x="44" y="276">tRNA   74-95 nt             amino acid carrier</text>
  <text class="sub" x="44" y="296">snRNA  U1, U2, U4, U5, U6   spliceosome</text>
  <text class="sub" x="44" y="316">snoRNA 60-300 nt            rRNA modification</text>
  <text class="sub" x="44" y="336">7SL, RNase P RNA            SRP, tRNA processing</text>
  <text class="out" x="44" y="362">quantity is high, function is structural or catalytic</text>

  <rect class="hl" x="460" y="212" width="410" height="160" rx="8"/>
  <text class="nm" x="474" y="234">Regulatory</text>
  <text class="sub" x="474" y="256">miRNA   21-23 nt   endogenous, imperfect pairing</text>
  <text class="sub" x="474" y="276">siRNA   21-23 nt   exogenous or designed, perfect pairing</text>
  <text class="sub" x="474" y="296">piRNA   24-32 nt   germline, silences transposons</text>
  <text class="sub" x="474" y="316">lncRNA  &gt;200 nt    scaffold, decoy, guide (XIST, HOTAIR)</text>
  <text class="sub" x="474" y="336">circRNA covalently closed loop, miRNA sponge</text>
  <text class="out" x="474" y="362">quantity is low, function is informational</text>
</svg>
