<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
 aria-label="Target recognition and action of miRNA: the seed sequence at nucleotides two to eight and binding sites in the three prime UTR, the many-to-many relationship that follows from requiring only seven bases of complementarity, how the degree of complementarity decides between translational repression and promoted decay, and the difference in stage between transcriptional and post-transcriptional control.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .mrna{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .utr{fill:#eef3f8;stroke:#6b8ba8;stroke-width:2}
  .seed{fill:#f2b705;stroke:#8a6300;stroke-width:1.8}
  .mir{stroke:#b3261e;stroke-width:3.4;fill:none}
  .ago{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .rib{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  What decides binding: the seed</text>
 <line x1="20" y1="38" x2="520" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="utr" x="40" y="96" width="70" height="20"/>
 <text class="m" x="46" y="111">5' UTR</text>
 <rect class="mrna" x="110" y="96" width="200" height="20"/>
 <text class="m" x="180" y="111">coding</text>
 <rect class="utr" x="310" y="96" width="190" height="20"/>
 <text class="m" x="376" y="111">3' UTR</text>
 <rect class="seed" x="352" y="96" width="34" height="20"/>
 <rect class="seed" x="430" y="96" width="34" height="20" opacity="0.6"/>
 <text class="s" x="330" y="138">binding sites, usually several, in the 3-prime UTR</text>

 <path class="mir" d="M340 72 h60"/>
 <rect class="seed" x="344" y="64" width="30" height="8"/>
 <text class="m" x="300" y="68">miRNA 5'</text>
 <text class="m" x="404" y="68">3'</text>
 <text class="m" x="330" y="56">nt 2-8 = SEED</text>
 <rect class="ago" x="408" y="58" width="56" height="24" rx="5"/>
 <text class="m" x="418" y="75">AGO</text>

 <rect class="k" x="20" y="152" width="480" height="36" rx="8"/>
 <text class="tb" x="34" y="176">Only the seed must match; the rest can be partial. That single fact drives everything below.</text>

 <text class="th" x="20" y="222">B  Two consequences: a many-to-many network</text>
 <line x1="20" y1="232" x2="520" y2="232" stroke="#c6d2dd" stroke-width="1.5"/>
 <circle cx="80" cy="280" r="18" fill="#f7dedc" stroke="#b3261e" stroke-width="2"/>
 <text class="m" x="62" y="284">miR-1</text>
 <g stroke="#b3261e" stroke-width="1.6" fill="none">
  <path d="M98 280 L190 250"/><path d="M98 280 L190 270"/><path d="M98 280 L190 290"/><path d="M98 280 L190 310"/>
 </g>
 <rect class="mrna" x="194" y="242" width="70" height="16"/>
 <rect class="mrna" x="194" y="264" width="70" height="16"/>
 <rect class="mrna" x="194" y="286" width="70" height="16"/>
 <rect class="mrna" x="194" y="308" width="70" height="16"/>
 <text class="m" x="276" y="256">one miRNA to</text>
 <text class="m" x="276" y="272">hundreds of targets</text>
 <text class="s" x="276" y="296">so it is not an off switch for one gene</text>
 <text class="s" x="276" y="312">but a device that lowers many a little</text>

 <circle cx="80" cy="356" r="14" fill="#f7dedc" stroke="#b3261e" stroke-width="2"/>
 <circle cx="80" cy="392" r="14" fill="#f7dedc" stroke="#b3261e" stroke-width="2"/>
 <circle cx="80" cy="428" r="14" fill="#f7dedc" stroke="#b3261e" stroke-width="2"/>
 <g stroke="#b3261e" stroke-width="1.6" fill="none">
  <path d="M94 356 L190 390"/><path d="M94 392 L190 392"/><path d="M94 428 L190 396"/>
 </g>
 <rect class="mrna" x="194" y="384" width="70" height="16"/>
 <text class="m" x="276" y="390">one mRNA, several miRNAs:</text>
 <text class="m" x="276" y="406">combinatorial control after transcription</text>

 <text class="th" x="550" y="28">C  Complementarity sets the outcome</text>
 <line x1="550" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="550" y="54" width="310" height="92" rx="8"/>
 <text class="tb" x="564" y="76">partial  to  translational repression</text>
 <rect class="rib" x="564" y="92" width="40" height="22" rx="10"/>
 <line class="no" x1="614" y1="103" x2="648" y2="103"/>
 <line class="no" x1="624" y1="93" x2="638" y2="113"/>
 <text class="s" x="564" y="136">initiation or elongation is obstructed</text>

 <rect class="bx" x="550" y="158" width="310" height="104" rx="8"/>
 <text class="tb" x="564" y="180">broader  to  promoted decay</text>
 <text class="m" x="564" y="206">deadenylation shortens poly(A)</text>
 <path class="ar" d="M564 216 L700 216"/>
 <text class="m" x="564" y="240">then the decay pathway</text>
 <text class="s" x="564" y="256">in animals both happen together</text>

 <rect class="k" x="550" y="276" width="310" height="80" rx="8"/>
 <text class="tb" x="564" y="300">The character of this control</text>
 <text class="t" x="564" y="322">not an on/off switch: it lowers the target by</text>
 <text class="t" x="564" y="340">tens of percent — fine tuning</text>

 <text class="th" x="550" y="386">D  Which stage</text>
 <line x1="550" y1="396" x2="860" y2="396" stroke="#c6d2dd" stroke-width="1.5"/>
 <text class="t" x="550" y="418">Transcriptional control changes HOW MUCH mRNA is made.</text>
 <text class="tb" x="550" y="438">miRNA changes whether the mRNA made is USED and KEPT.</text>
</svg>
