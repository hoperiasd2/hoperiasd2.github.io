<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img"
 aria-label="The five steps of miRNA biogenesis: pri-miRNA made by Pol II in the nucleus, the first cut by Drosha and DGCR8 at the hairpin base, export by exportin-5, the second cut by Dicer removing the loop in the cytoplasm, and loading of the guide strand onto Argonaute to form RISC.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .nuc{fill:#eef3f8;stroke:#6b8ba8;stroke-width:2.2}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .en{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .ago{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.4}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .cut{stroke:#b3261e;stroke-width:2.6;fill:none;stroke-dasharray:4 3}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <rect class="nuc" x="20" y="48" width="500" height="250" rx="14"/>
 <text class="tb" x="34" y="70">NUCLEUS</text>
 <text class="tb" x="34" y="330">CYTOPLASM</text>

 <text class="m" x="44" y="96">1  Pol II transcribes the miRNA gene</text>
 <path class="rna" d="M44 128 h40 q16 -28 32 0 q16 28 32 0 h30 q16 -28 32 0 q16 28 32 0 h40"/>
 <text class="m" x="290" y="124">pri-miRNA (long, with hairpins)</text>
 <text class="s" x="290" y="140">from its own gene or from an intron</text>

 <path class="ar" d="M190 148 L190 174"/>
 <rect class="en" x="200" y="150" width="140" height="26" rx="5"/>
 <text class="m" x="208" y="168">Drosha + DGCR8</text>
 <text class="m" x="44" y="196">2  cuts the hairpin BASE</text>
 <path class="rna" d="M150 236 q0 -34 20 -34 q20 0 20 34"/>
 <path class="rna" d="M162 236 q0 -22 8 -22 q8 0 8 22"/>
 <path class="cut" d="M140 236 h60"/>
 <text class="m" x="212" y="226">pre-miRNA, about 70 nt</text>

 <path class="ar" d="M340 240 L420 240"/>
 <rect class="bx" x="352" y="252" width="110" height="24" rx="5"/>
 <text class="m" x="360" y="269">exportin-5</text>
 <text class="m" x="352" y="246">3  export</text>

 <path class="ar" d="M470 300 L470 330"/>
 <text class="m" x="44" y="356">4  Dicer cuts the LOOP</text>
 <path class="rna" d="M150 396 q0 -34 20 -34 q20 0 20 34"/>
 <path class="cut" d="M150 364 q20 -14 40 0"/>
 <rect class="en" x="210" y="366" width="70" height="26" rx="5"/>
 <text class="m" x="222" y="384">Dicer</text>
 <path class="ar" d="M290 380 L330 380"/>
 <path class="rna" d="M340 372 h90 M340 388 h90"/>
 <text class="m" x="340" y="412">about 22 nt duplex</text>

 <path class="ar" d="M444 380 L490 380"/>
 <text class="m" x="520" y="356">5  loading</text>
 <path class="ago" d="M520 362 h150 v40 h-150 z"/>
 <text class="m" x="534" y="386">Argonaute (RISC)</text>
 <path class="rna" d="M548 398 h110" stroke-width="3.4"/>
 <text class="m" x="690" y="382">guide strand kept;</text>
 <text class="m" x="690" y="398">the other is discarded</text>

 <rect class="k" x="548" y="60" width="312" height="120" rx="8"/>
 <text class="tb" x="562" y="84">The division of labour to remember</text>
 <text class="t" x="562" y="108">Drosha: in the NUCLEUS, cuts the BASE</text>
 <text class="t" x="562" y="128">Dicer: in the CYTOPLASM, cuts the LOOP</text>
 <text class="s" x="562" y="154">Both are RNase III enzymes that recognise</text>
 <text class="s" x="562" y="170">double-stranded RNA, at different places.</text>

 <rect class="bx" x="548" y="192" width="312" height="94" rx="8"/>
 <text class="tb" x="562" y="216">Which strand is kept</text>
 <text class="t" x="562" y="240">The strand whose 5-prime end is bound more</text>
 <text class="t" x="562" y="258">weakly tends to be chosen. Tissues can differ,</text>
 <text class="t" x="562" y="276">so one pre-miRNA may yield two functional miRNAs.</text>
</svg>
