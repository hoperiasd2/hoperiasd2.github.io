<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img"
     aria-label="MicroRNA biogenesis from pri-miRNA transcription through Drosha cleavage in the nucleus, export by exportin-5, Dicer cleavage in the cytosol and loading into the RISC complex">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .nuc{fill:#e8eef4;stroke:#003c71;stroke-width:1.5}
    .cyt{fill:none;stroke:#003c71;stroke-width:1.6}
    .rna{stroke:#16191d;stroke-width:2.6;fill:none}
    .rna2{stroke:#f2b705;stroke-width:2.6;fill:none}
    .enz{fill:#003c71;stroke:#16191d;stroke-width:1.1}
    .el{font:700 11px sans-serif;fill:#ffffff}
    .ln{stroke:#003c71;stroke-width:1.7;fill:none}
    .cut{stroke:#8a6300;stroke-width:1.8;stroke-dasharray:5 3;fill:none}
    .out{font:700 11px sans-serif;fill:#8a6300}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.3}
  </style>
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <rect class="nuc" x="20" y="34" width="420" height="300" rx="14"/>
  <text class="nm" x="36" y="56">nucleus</text>
  <text class="ttl" x="470" y="26">microRNA biogenesis</text>

  <text class="sub" x="40" y="84">1. RNA polymerase II transcribes the miRNA gene</text>
  <path class="rna" d="M50 108 C90 86 130 130 170 108 C210 86 250 130 290 108"/>
  <path class="rna" d="M290 108 C300 130 330 130 340 108 C350 86 380 86 390 108"/>
  <text class="nm" x="50" y="132">pri-miRNA, several hundred nt, capped and polyadenylated</text>

  <text class="sub" x="40" y="166">2. Drosha with DGCR8 cuts out the hairpin</text>
  <ellipse class="enz" cx="130" cy="206" rx="54" ry="18"/>
  <text class="el" x="94" y="211">Drosha-DGCR8</text>
  <path class="rna" d="M230 230 C230 190 290 190 290 230 L290 268 M230 230 L230 268"/>
  <path class="cut" d="M214 262 L306 262"/>
  <text class="nm" x="212" y="292">pre-miRNA, about 70 nt hairpin</text>
  <text class="sub" x="40" y="318">RNase III family: two cuts, leaves a 2-nt 3' overhang</text>

  <path class="ln" d="M452 190 L516 190" marker-end="url(#f1)"/>
  <text class="sub" x="446" y="178">exportin-5</text>
  <text class="sub" x="452" y="212">Ran-GTP</text>

  <rect class="cyt" x="530" y="34" width="350" height="300" rx="14"/>
  <text class="nm" x="546" y="56">cytosol</text>
  <text class="sub" x="546" y="84">3. Dicer with TRBP cuts the loop off</text>
  <ellipse class="enz" cx="610" cy="124" rx="40" ry="17"/>
  <text class="el" x="588" y="129">Dicer</text>
  <path class="rna" d="M700 108 C700 96 740 96 740 108 L740 148 M700 108 L700 148"/>
  <path class="cut" d="M692 104 L748 104"/>
  <text class="sub" x="546" y="178">4. miRNA duplex, 21-23 bp</text>
  <path class="rna" d="M560 206 L700 206"/>
  <path class="rna2" d="M560 220 L700 220"/>
  <text class="sub" x="712" y="210">guide strand (kept)</text>
  <text class="sub" x="712" y="228">passenger strand (degraded)</text>
  <text class="sub" x="546" y="254">5. Loading into Argonaute 2</text>
  <ellipse class="enz" cx="650" cy="294" rx="88" ry="24"/>
  <text class="el" x="586" y="292">RISC : AGO2 + GW182</text>
  <path class="rna2" d="M592 310 L708 310"/>
  <text class="sub" x="546" y="326">strand selection follows 5' end thermodynamic stability</text>

  <rect class="hl" x="20" y="352" width="860" height="110" rx="10"/>
  <text class="nm" x="36" y="376">Points where biogenesis itself is regulated or fails</text>
  <text class="sub" x="36" y="398">- DGCR8 lies in the 22q11.2 region deleted in DiGeorge syndrome, so miRNA processing is reduced</text>
  <text class="sub" x="36" y="418">- DICER1 germline mutation causes pleuropulmonary blastoma and multinodular goitre predisposition</text>
  <text class="sub" x="36" y="438">- one pri-miRNA can yield several miRNAs; one miRNA can target hundreds of mRNAs</text>
  <text class="sub" x="36" y="458">- about 60% of human protein-coding genes carry a conserved miRNA target site</text>
</svg>
