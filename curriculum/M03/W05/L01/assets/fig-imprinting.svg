<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img"
     aria-label="Genomic imprinting at chromosome 15q11-q13 and the origin of Prader-Willi and Angelman syndromes">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .chr{fill:#ffffff;stroke:#16191d;stroke-width:1.6}
    .on{fill:#f2b705;stroke:#16191d;stroke-width:1.2}
    .off{fill:#c6d2dd;stroke:#16191d;stroke-width:1.2}
    .gl{font:700 10px sans-serif;fill:#16191d}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.3}
    .bx{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .me{fill:#16191d}
    .out{font:700 11px sans-serif;fill:#8a6300}
  </style>
  <text class="ttl" x="20" y="24">A. Normal imprinting of the 15q11-q13 region</text>

  <text class="nm" x="20" y="60">paternal</text>
  <rect class="chr" x="110" y="46" width="700" height="26" rx="6"/>
  <rect class="on" x="150" y="48" width="90" height="22"/><text class="gl" x="164" y="63">SNRPN</text>
  <rect class="on" x="250" y="48" width="110" height="22"/><text class="gl" x="262" y="63">SNORD116</text>
  <rect class="off" x="600" y="48" width="90" height="22"/><text class="gl" x="616" y="63">UBE3A</text>
  <circle class="me" cx="130" cy="36" r="5"/>
  <text class="sub" x="140" y="34">IC unmethylated on the paternal allele</text>

  <text class="nm" x="20" y="134">maternal</text>
  <rect class="chr" x="110" y="120" width="700" height="26" rx="6"/>
  <rect class="off" x="150" y="122" width="90" height="22"/><text class="gl" x="164" y="137">SNRPN</text>
  <rect class="off" x="250" y="122" width="110" height="22"/><text class="gl" x="262" y="137">SNORD116</text>
  <rect class="on" x="600" y="122" width="90" height="22"/><text class="gl" x="616" y="137">UBE3A</text>
  <circle class="on" cx="130" cy="110" r="7"/>
  <text class="sub" x="142" y="108">imprinting centre methylated on the maternal allele</text>

  <rect class="bx" x="110" y="166" width="700" height="40" rx="6"/>
  <text class="sub" x="124" y="192">filled = expressed, grey = silenced. Each gene is expressed from one parental allele only, so there is no functional back-up copy.</text>

  <text class="ttl" x="20" y="248">B. Loss of the paternal contribution: Prader-Willi syndrome</text>
  <rect class="chr" x="110" y="262" width="340" height="24" rx="6"/>
  <rect class="off" x="150" y="264" width="200" height="20"/><text class="gl" x="186" y="278">SNRPN, SNORD116 absent</text>
  <text class="sub" x="110" y="306">causes: paternal 15q11-q13 deletion 65-75%,</text>
  <text class="sub" x="110" y="324">maternal uniparental disomy 20-30%, imprinting defect 1-3%</text>
  <text class="out" x="110" y="350">neonatal hypotonia and poor feeding, then hyperphagia and obesity,</text>
  <text class="out" x="110" y="368">short stature, hypogonadism, intellectual disability</text>

  <text class="ttl" x="470" y="248">C. Loss of the maternal contribution: Angelman syndrome</text>
  <rect class="chr" x="490" y="262" width="340" height="24" rx="6"/>
  <rect class="off" x="690" y="264" width="120" height="20"/><text class="gl" x="712" y="278">UBE3A absent</text>
  <text class="sub" x="490" y="306">causes: maternal 15q11-q13 deletion 70-75%,</text>
  <text class="sub" x="490" y="324">UBE3A mutation 10%, paternal uniparental disomy 3-7%</text>
  <text class="out" x="490" y="350">severe speech impairment, ataxic gait, seizures,</text>
  <text class="out" x="490" y="368">frequent laughter, microcephaly</text>

  <rect class="hl" x="110" y="396" width="700" height="40" rx="6"/>
  <text class="sub" x="124" y="422">The same deletion gives two different diseases depending on the parent of origin. Methylation testing of the imprinting centre, not sequencing, makes the diagnosis.</text>
</svg>
