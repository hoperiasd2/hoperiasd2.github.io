<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img"
 aria-label="Three cases of state maintenance: formation and recognition of H3K27me3 by PRC2 and PRC1 maintaining repression, the maternal versus paternal contrast at H19 and IGF2 where methylation of the imprinting control region changes the enhancer's reach through CTCF binding, random choice and maintenance in X chromosome inactivation, and the parental-origin correspondence of Prader-Willi and Angelman syndromes.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .dna{fill:none;stroke:#16191d;stroke-width:2.4}
  .oct{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .prc{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .enh{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .ctcf{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .h19{fill:#fff5d6;stroke:#f2b705;stroke-width:2}
  .igf2{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .off{fill:#fff;stroke:#c6d2dd;stroke-width:1.8;stroke-dasharray:3 3}
  .ok{stroke:#2e7d32;stroke-width:2.4;fill:none;marker-end:url(#g)}
  .no{stroke:#b3261e;stroke-width:2.4;fill:none;stroke-dasharray:5 4}
  .fb{stroke:#b3261e;stroke-width:2.2;fill:none;stroke-dasharray:5 4;marker-end:url(#r)}
 </style>
 <defs>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
 </defs>

 <text class="th" x="20" y="28">Case 1  Polycomb keeps developmental genes off</text>
 <line x1="20" y1="38" x2="430" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="dna" d="M30 100 h380"/>
 <circle class="oct" cx="90" cy="100" r="18"/>
 <circle cx="90" cy="80" r="5" fill="#b3261e"/>
 <circle class="oct" cx="150" cy="100" r="18"/>
 <circle cx="150" cy="80" r="5" fill="#b3261e"/>
 <circle class="oct" cx="210" cy="100" r="18"/>
 <text class="m" x="60" y="130">H3K27me3</text>
 <rect class="prc" x="96" y="50" width="56" height="24" rx="5"/>
 <text class="m" x="102" y="67">PRC2</text>
 <rect class="prc" x="162" y="50" width="56" height="24" rx="5"/>
 <text class="m" x="168" y="67">PRC1</text>
 <path class="fb" d="M152 62 L196 72"/>
 <path class="fb" d="M196 76 q20 10 14 22"/>
 <circle cx="210" cy="80" r="5" fill="#b3261e" opacity="0.5"/>
 <text class="s" x="30" y="152">PRC2 writes H3K27me3 and carries a subunit that recognises it:</text>
 <text class="s" x="30" y="170">where the mark is it lingers, and lingering makes more mark.</text>
 <text class="s" x="30" y="188">PRC1 reads it and adds ubiquitination and compaction.</text>

 <text class="th" x="460" y="28">Case 3  X inactivation</text>
 <line x1="460" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="470" y="54" width="60" height="110" rx="8"/>
 <text class="m" x="490" y="112">Xa</text>
 <rect x="546" y="54" width="60" height="110" rx="8" fill="#f7dedc" stroke="#b3261e" stroke-width="2.2"/>
 <text class="m" x="564" y="112">Xi</text>
 <text class="s" x="470" y="186">one X is silenced to match gene dosage;</text>
 <text class="s" x="470" y="204">the choice is random and then kept in all descendants</text>
 <rect class="k" x="628" y="54" width="232" height="110" rx="8"/>
 <text class="t" x="640" y="78">Xist (a long non-coding RNA)</text>
 <text class="t" x="640" y="98">then histone deacetylation,</text>
 <text class="t" x="640" y="118">Polycomb marks and DNA</text>
 <text class="t" x="640" y="138">methylation stabilise it.</text>
 <text class="s" x="640" y="158">Mechanism of Xist: next lesson.</text>
 <text class="s" x="628" y="186">Visible result: the tortoiseshell cat. Some genes escape.</text>

 <text class="th" x="20" y="236">Case 2  H19 / IGF2 — methylation changes the enhancer's REACH, not the gene directly</text>
 <line x1="20" y1="246" x2="860" y2="246" stroke="#c6d2dd" stroke-width="1.5"/>

 <text class="tb" x="30" y="272">MATERNAL copy: control region UNmethylated</text>
 <path class="dna" d="M30 310 h400"/>
 <rect class="h19" x="60" y="300" width="56" height="20"/>
 <text class="m" x="72" y="315">H19</text>
 <rect class="ctcf" x="150" y="300" width="46" height="20"/>
 <text class="m" x="156" y="315">ICR</text>
 <rect class="igf2" x="240" y="300" width="56" height="20"/>
 <text class="m" x="250" y="315">IGF2</text>
 <rect class="enh" x="350" y="300" width="60" height="20"/>
 <text class="m" x="356" y="315">enhancer</text>
 <rect class="ctcf" x="152" y="276" width="42" height="22" rx="4"/>
 <text class="m" x="156" y="292">CTCF</text>
 <path class="ok" d="M350 326 q-120 24 -234 -8"/>
 <text class="m" x="196" y="350">reaches H19</text>
 <path class="no" d="M346 300 q-30 -10 -48 -2"/>
 <text class="s" x="30" y="370">CTCF binds and its boundary function keeps the enhancer away from IGF2, so H19 is expressed.</text>

 <text class="tb" x="460" y="396">PATERNAL copy: control region METHYLATED</text>
 <path class="dna" d="M460 434 h400"/>
 <rect class="off" x="490" y="424" width="56" height="20"/>
 <text class="m" x="502" y="439">H19</text>
 <rect class="ctcf" x="580" y="424" width="46" height="20"/>
 <circle cx="603" cy="414" r="5" fill="#f2b705" stroke="#8a6300" stroke-width="1.4"/>
 <rect class="igf2" x="670" y="424" width="56" height="20"/>
 <text class="m" x="680" y="439">IGF2</text>
 <rect class="enh" x="780" y="424" width="60" height="20"/>
 <path class="ok" d="M780 418 q-50 -10 -56 -2"/>
 <text class="s" x="460" y="390">Methylation blocks CTCF, so there is no boundary and the enhancer contacts IGF2: IGF2 is expressed.</text>

 <rect class="k" x="20" y="382" width="420" height="62" rx="8"/>
 <text class="tb" x="34" y="404">The teaching point</text>
 <text class="t" x="34" y="424">Read the binding protein and the contact relation together. Chr15: paternal</text>
 <text class="t" x="34" y="440">deletion gives Prader-Willi, maternal deletion gives Angelman.</text>
</svg>
