<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img"
     aria-label="Epigenetic changes in cancer: promoter hypermethylation of tumour suppressors, global hypomethylation, and the drugs that target DNMT and HDAC">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .dna{stroke:#16191d;stroke-width:2.2;fill:none}
    .me{fill:#f2b705;stroke:#16191d;stroke-width:1}
    .um{fill:#ffffff;stroke:#16191d;stroke-width:1}
    .bx{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.3}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.3}
    .ln{stroke:#003c71;stroke-width:1.7;fill:none}
    .gl{font:700 10px sans-serif;fill:#16191d}
    .out{font:700 11px sans-serif;fill:#8a6300}
  </style>
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="24">A. Two opposite changes occur in the same tumour genome</text>

  <rect class="hl" x="30" y="40" width="400" height="140" rx="8"/>
  <text class="nm" x="44" y="62">CpG island hypermethylation (local)</text>
  <path class="dna" d="M50 96 L410 96"/>
  <circle class="me" cx="90" cy="96" r="7"/><circle class="me" cx="118" cy="96" r="7"/>
  <circle class="me" cx="146" cy="96" r="7"/><circle class="me" cx="174" cy="96" r="7"/>
  <rect x="210" y="84" width="90" height="24" rx="3" fill="#c6d2dd" stroke="#16191d"/>
  <text class="gl" x="226" y="100">silenced</text>
  <text class="sub" x="50" y="130">tumour suppressor promoters turned off without mutation:</text>
  <text class="sub" x="50" y="148">CDKN2A, MLH1, BRCA1, MGMT, VHL</text>
  <text class="out" x="50" y="170">a second hit that leaves the sequence intact</text>

  <rect class="bx" x="470" y="40" width="400" height="140" rx="8"/>
  <text class="nm" x="484" y="62">Global hypomethylation (genome-wide)</text>
  <path class="dna" d="M490 96 L850 96"/>
  <circle class="um" cx="520" cy="96" r="7"/><circle class="um" cx="556" cy="96" r="7"/>
  <circle class="um" cx="592" cy="96" r="7"/><circle class="um" cx="628" cy="96" r="7"/>
  <circle class="um" cx="664" cy="96" r="7"/>
  <text class="sub" x="490" y="130">repeats and transposons lose methylation:</text>
  <text class="sub" x="490" y="148">chromosomal instability, re-expression of silent elements,</text>
  <text class="sub" x="490" y="166">loss of imprinting (IGF2 in Wilms tumour)</text>

  <text class="ttl" x="20" y="226">B. Drugs that act on the epigenetic machinery</text>
  <rect class="hl" x="30" y="240" width="250" height="100" rx="8"/>
  <text class="nm" x="44" y="262">DNMT inhibitors</text>
  <text class="sub" x="44" y="282">azacitidine, decitabine</text>
  <text class="sub" x="44" y="300">cytidine analogues incorporated</text>
  <text class="sub" x="44" y="318">into DNA, trap and deplete DNMT1</text>
  <text class="sub" x="44" y="336">-&gt; passive loss of methylation</text>

  <rect class="bx" x="310" y="240" width="250" height="100" rx="8"/>
  <text class="nm" x="324" y="262">HDAC inhibitors</text>
  <text class="sub" x="324" y="282">vorinostat, romidepsin,</text>
  <text class="sub" x="324" y="300">belinostat, panobinostat</text>
  <text class="sub" x="324" y="318">acetylation accumulates,</text>
  <text class="sub" x="324" y="336">chromatin opens</text>

  <rect class="bx" x="590" y="240" width="280" height="100" rx="8"/>
  <text class="nm" x="604" y="262">Other writer / eraser targets</text>
  <text class="sub" x="604" y="282">tazemetostat : EZH2 (H3K27 HMT)</text>
  <text class="sub" x="604" y="300">ivosidenib, enasidenib : mutant IDH1/2,</text>
  <text class="sub" x="604" y="318">which produce 2-hydroxyglutarate and</text>
  <text class="sub" x="604" y="336">inhibit TET and KDM enzymes</text>

  <rect class="hl" x="30" y="356" width="840" height="56" rx="8"/>
  <text class="nm" x="44" y="378">Why the epigenome is a drug target at all</text>
  <text class="sub" x="44" y="398">The marks are enzyme-made and reversible, so the silenced gene is still present and can be switched back on. A deleted gene cannot.</text>
</svg>
