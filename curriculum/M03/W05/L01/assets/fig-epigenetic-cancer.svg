<!-- 암의 후성유전 이상과 표적 치료, 그리고 세 가지 구분.

   본문에 이미 약물 표와 세 가지 구분이 글로 있다. 그림은 글이 할 수 없는 것만 한다.
   표를 다시 그리지 않고, 배치로만 보이는 세 가지를 보인다.

   패널 구성
   A  두 방향이 한 유전체에 같이 나타난다는 것을 같은 축에 놓아 보인다.
      종양 억제 유전자 promoter의 CpG island에는 표지가 몰려 붙고(국소 과메틸화),
      반복서열 구간에서는 표지가 빠진다(전체 저메틸화). 모순이 아니라 배치가
      흐트러진 것이다. 8절의 DNMT3A, TET2 변이가 양쪽으로 모두 암을 만드는 것과
      같은 논리다. 캡션에 MLH1, CDKN2A, MGMT를 적는다.
   B  약물의 작용 지점을 writer, eraser, reader, 대사물의 네 자리로 나눠 보인다.
      본문 표의 다섯 약물 계열이 각각 어디에 붙는지가 이 그림의 몫이고,
      적응증은 본문 표에 있으므로 그림에 넣지 않는다.
      BET는 reader를 표적으로 한다는 점, IDH는 대사가 후성유전으로 들어오는
      경로라는 점이 요점이다.
   C  시간 규모를 하나의 축에 올려 세 현상을 가른다.
      표지의 변화는 시간에서 일 규모, 체세포 상태 유지는 분열을 넘어,
      세대 간 전달은 생식세포 재설정이라는 관문 뒤에 있다. 관문을 끊긴 축으로
      그려 근거 수준이 다르다는 것을 배치로 보인다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img"
 aria-label="Epigenetic change in cancer. Panel A places focal hypermethylation at a tumour suppressor promoter and global hypomethylation over repeats on one genome axis. Panel B maps drug classes onto writer, eraser, reader and metabolite positions. Panel C puts the three phenomena on one time axis, with germline resetting drawn as a break before transmission to offspring.">
 <style>
  .t{font:12px sans-serif;fill:#16191d}
  .p{font:700 15px sans-serif;fill:#003c71}
  .s{font:11px sans-serif;fill:#4a5159}
  .dna{stroke:#1a4f8a;stroke-width:3;fill:none}
  .isl{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .gene{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .rep{fill:#e8edf2;stroke:#8899a8;stroke-width:2}
  .me{fill:#f2b705;stroke:#8a6300;stroke-width:1.5}
  .off{fill:#fff;stroke:#8a6300;stroke-width:1.5}
  .dr{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .no{stroke:#b3261e;stroke-width:2.6;fill:none;marker-end:url(#b)}
  .ax{stroke:#4a5159;stroke-width:2;fill:none}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
 </defs>

 <text class="p" x="16" y="30">A</text>
 <line class="dna" x1="40" y1="64" x2="780" y2="64"/>
 <rect class="isl" x="96" y="52" width="88" height="24"/>
 <rect class="gene" x="190" y="52" width="150" height="24"/>
 <rect class="rep" x="470" y="52" width="260" height="24"/>
 <g><circle class="me" cx="108" cy="40" r="7"/><circle class="me" cx="126" cy="40" r="7"/>
    <circle class="me" cx="144" cy="40" r="7"/><circle class="me" cx="162" cy="40" r="7"/></g>
 <g><circle class="off" cx="500" cy="40" r="7"/><circle class="off" cx="560" cy="40" r="7"/>
    <circle class="off" cx="620" cy="40" r="7"/><circle class="off" cx="690" cy="40" r="7"/></g>
 <text class="t" x="96" y="96">CpG island</text>
 <text class="t" x="196" y="96">tumour suppressor</text>
 <text class="t" x="470" y="96">repeats, transposons</text>
 <text class="s" x="96" y="116">focal gain, gene OFF</text>
 <text class="s" x="470" y="116">global loss, elements ON</text>
 <text class="s" x="40" y="142">not the total amount but the placement</text>

 <text class="p" x="16" y="196">B</text>
 <circle class="me" cx="300" cy="238" r="12"/>
 <text class="t" x="276" y="268">mark</text>
 <rect class="dr" x="40" y="186" width="118" height="26" rx="4"/>
 <text class="t" x="52" y="204">DNMT, EZH2</text>
 <text class="s" x="52" y="228">writer</text>
 <path class="no" d="M164 199 L256 230"/>
 <rect class="dr" x="40" y="286" width="118" height="26" rx="4"/>
 <text class="t" x="52" y="304">HDAC</text>
 <text class="s" x="52" y="328">eraser</text>
 <path class="no" d="M164 299 L256 250"/>
 <rect class="dr" x="440" y="186" width="118" height="26" rx="4"/>
 <text class="t" x="452" y="204">BET</text>
 <text class="s" x="452" y="228">reader</text>
 <path class="no" d="M436 199 L344 230"/>
 <rect class="dr" x="440" y="286" width="118" height="26" rx="4"/>
 <text class="t" x="452" y="304">mutant IDH</text>
 <text class="s" x="452" y="328">metabolite</text>
 <path class="no" d="M436 299 L344 250"/>
 <text class="s" x="600" y="238">marks are reversible</text>
 <text class="s" x="600" y="258">so they can be drugged</text>

 <text class="p" x="16" y="382">C</text>
 <line class="ax" x1="40" y1="394" x2="470" y2="394"/>
 <line class="ax" x1="520" y1="394" x2="780" y2="394"/>
 <path class="ax" d="M478 382 L492 406 M498 382 L512 406"/>
 <text class="t" x="40" y="384">mark change</text>
 <text class="s" x="40" y="414">hours to days</text>
 <text class="t" x="240" y="384">somatic maintenance</text>
 <text class="s" x="240" y="414">across division</text>
 <text class="t" x="560" y="384">to offspring</text>
 <text class="s" x="560" y="414">germline reset between</text>
</svg>
