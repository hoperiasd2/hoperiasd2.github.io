<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="Division of roles between writer, reader and eraser and the amplification structure: the enzyme that adds a mark, the domains that recognise and bind it, the enzyme that removes it, the principle that a mark does not decide anything by itself, and the route by which reading and writing pair into positive feedback.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .oct{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .wr{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .rd{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .er{fill:#f7dedc;stroke:#b3261e;stroke-width:2.2}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
  .fb{stroke:#2e7d32;stroke-width:2.4;fill:none;stroke-dasharray:6 4;marker-end:url(#g)}
  .dna{fill:none;stroke:#16191d;stroke-width:2.4}
 </style>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker>
 </defs>

 <text class="th" x="20" y="28">A  Three roles around one mark</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <rect class="wr" x="40" y="60" width="200" height="34" rx="6"/>
 <text class="tb" x="54" y="83">WRITER  adds the mark</text>
 <text class="s" x="40" y="112">HAT, histone methyltransferase</text>
 <path class="ar" d="M248 77 L286 77"/>
 <rect class="rd" x="294" y="60" width="240" height="34" rx="6"/>
 <text class="tb" x="308" y="83">READER  recognises and binds</text>
 <text class="s" x="294" y="112">bromodomain for acetyl-lysine;</text>
 <text class="s" x="294" y="128">chromodomain and PHD finger for methyl-lysine</text>
 <path class="ar" d="M542 77 L580 77"/>
 <rect class="er" x="588" y="60" width="200" height="34" rx="6"/>
 <text class="tb" x="602" y="83">ERASER  removes it</text>
 <text class="s" x="588" y="112">HDAC, histone demethylase</text>

 <rect class="k" x="20" y="150" width="840" height="36" rx="8"/>
 <text class="tb" x="34" y="174">A MARK DOES NOT DECIDE ANYTHING BY ITSELF. The molecule that reads it carries out what follows.</text>

 <text class="th" x="20" y="222">B  What this principle explains</text>
 <line x1="20" y1="232" x2="430" y2="232" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="20" y="246" width="410" height="74" rx="8"/>
 <text class="tb" x="34" y="268">1  the same mark, different outcomes</text>
 <text class="t" x="34" y="290">which reader reads it, and what that reader binds,</text>
 <text class="t" x="34" y="310">decides the result. Readers differ by cell type.</text>
 <rect class="bx" x="20" y="330" width="410" height="74" rx="8"/>
 <text class="tb" x="34" y="352">2  one modification is amplified</text>
 <text class="t" x="34" y="374">writer adds, reader binds, reader brings another</text>
 <text class="t" x="34" y="394">enzyme, and the action spreads to the neighbourhood.</text>

 <text class="th" x="460" y="222">C  Reading and writing paired: positive feedback</text>
 <line x1="460" y1="232" x2="860" y2="232" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="dna" d="M480 320 h360"/>
 <circle class="oct" cx="540" cy="320" r="22"/>
 <circle cx="540" cy="294" r="6" fill="#f2b705" stroke="#8a6300" stroke-width="1.4"/>
 <circle class="oct" cx="640" cy="320" r="22"/>
 <circle class="oct" cx="740" cy="320" r="22"/>
 <rect class="rd" x="568" y="256" width="150" height="30" rx="6"/>
 <text class="m" x="576" y="276">complex: reader + writer</text>
 <path class="ar" d="M580 290 L552 290"/>
 <path class="fb" d="M694 288 q40 10 40 22"/>
 <circle cx="740" cy="294" r="6" fill="#f2b705" stroke="#8a6300" stroke-width="1.4" opacity="0.5"/>
 <text class="s" x="460" y="366">Some complexes carry a domain that recognises the very mark they make.</text>
 <text class="s" x="460" y="384">Where the mark is, the complex lingers; where it lingers, it makes more mark.</text>
 <text class="tb" x="460" y="410">This is how a mark SPREADS into a region and PERSISTS — see section 8.</text>
</svg>
