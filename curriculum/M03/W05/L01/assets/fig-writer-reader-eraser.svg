<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img"
     aria-label="Writers, readers and erasers of histone marks, with the chromatin remodelling complexes that move nucleosomes">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .bx{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.4}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.4}
    .ln{stroke:#003c71;stroke-width:1.7;fill:none}
    .nuc{fill:#003c71;stroke:#16191d;stroke-width:1.1}
    .me{fill:#f2b705;stroke:#16191d;stroke-width:1}
    .mk{font:700 9px sans-serif;fill:#16191d}
    .out{font:700 11px sans-serif;fill:#8a6300}
  </style>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="24">A. Three enzyme classes act on one mark</text>
  <rect class="hl" x="30" y="40" width="200" height="86" rx="8"/>
  <text class="nm" x="44" y="62">WRITER</text>
  <text class="sub" x="44" y="82">HAT (p300/CBP, GCN5)</text>
  <text class="sub" x="44" y="100">HMT (EZH2, SETD2, SUV39H1)</text>
  <text class="sub" x="44" y="118">DNMT1, DNMT3A/3B</text>
  <rect class="bx" x="350" y="40" width="200" height="86" rx="8"/>
  <text class="nm" x="364" y="62">READER</text>
  <text class="sub" x="364" y="82">bromodomain reads Kac (BRD4)</text>
  <text class="sub" x="364" y="100">chromodomain reads Kme (HP1)</text>
  <text class="sub" x="364" y="118">MBD domain reads 5mC (MeCP2)</text>
  <rect class="hl" x="670" y="40" width="200" height="86" rx="8"/>
  <text class="nm" x="684" y="62">ERASER</text>
  <text class="sub" x="684" y="82">HDAC1-11, SIRT1-7</text>
  <text class="sub" x="684" y="100">KDM (LSD1, KDM6A)</text>
  <text class="sub" x="684" y="118">TET1-3 oxidize 5mC</text>
  <path class="ln" d="M236 82 L344 82" marker-end="url(#b1)"/>
  <path class="ln" d="M556 82 L664 82" marker-end="url(#b1)"/>
  <path class="ln" d="M770 132 C770 170 130 170 130 132" marker-end="url(#b1)"/>
  <text class="sub" x="380" y="166">the mark is reversible, so the state is a steady balance of writer and eraser</text>

  <text class="ttl" x="20" y="226">B. The reader converts the mark into a chromatin change</text>
  <g>
    <ellipse class="nuc" cx="110" cy="300" rx="26" ry="18"/>
    <ellipse class="nuc" cx="180" cy="300" rx="26" ry="18"/>
    <ellipse class="nuc" cx="250" cy="300" rx="26" ry="18"/>
    <ellipse class="nuc" cx="320" cy="300" rx="26" ry="18"/>
  </g>
  <path d="M60 300 L370 300" stroke="#16191d" stroke-width="2" fill="none"/>
  <circle class="me" cx="180" cy="274" r="9"/><text class="mk" x="174" y="278">Me</text>
  <text class="sub" x="70" y="340">closed: nucleosomes evenly spaced over the promoter</text>
  <path class="ln" d="M386 300 L452 300" marker-end="url(#b1)"/>
  <rect class="hl" x="392" y="248" width="180" height="44" rx="6"/>
  <text class="nm" x="402" y="266">SWI/SNF, ISWI, NuRD</text>
  <text class="sub" x="402" y="284">ATP-dependent remodellers</text>
  <g>
    <ellipse class="nuc" cx="500" cy="300" rx="26" ry="18"/>
    <ellipse class="nuc" cx="700" cy="300" rx="26" ry="18"/>
    <ellipse class="nuc" cx="770" cy="300" rx="26" ry="18"/>
  </g>
  <path d="M470 300 L820 300" stroke="#16191d" stroke-width="2" fill="none"/>
  <rect x="556" y="286" width="112" height="28" rx="4" fill="#fff5d6" stroke="#003c71" stroke-width="1.3"/>
  <text class="nm" x="570" y="305">Pol II + TF</text>
  <text class="out" x="470" y="340">open: nucleosome slid aside, a nucleosome-free region appears</text>
  <text class="sub" x="470" y="362">remodellers slide, evict or exchange nucleosomes using ATP; they do not add or remove marks</text>
</svg>
