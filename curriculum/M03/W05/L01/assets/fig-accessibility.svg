<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="The accessible region around an active promoter and the independence of two conditions: assembly of the initiation complex in a nucleosome-depleted region, the principle of accessibility measurement, and the four combinations of chromatin state and activator presence with their expression outcomes.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .dna{fill:none;stroke:#16191d;stroke-width:2.6}
  .oct{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .prom{fill:#e8eff6;stroke:#003c71;stroke-width:2}
  .pol{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .tf{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2}
  .hi{fill:#2e7d32}.mid{fill:#c6d2dd}
 </style>

 <text class="th" x="20" y="28">A  Active promoters sit in a nucleosome-depleted region</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="dna" d="M30 110 h800"/>
 <circle class="oct" cx="80" cy="110" r="22"/>
 <circle class="oct" cx="136" cy="110" r="22"/>
 <circle class="oct" cx="192" cy="110" r="22"/>
 <rect class="prom" x="300" y="100" width="150" height="20"/>
 <text class="m" x="336" y="115">promoter</text>
 <circle class="oct" cx="560" cy="110" r="22"/>
 <circle class="oct" cx="616" cy="110" r="22"/>
 <circle class="oct" cx="672" cy="110" r="22"/>
 <circle class="oct" cx="728" cy="110" r="22"/>
 <rect class="pol" x="330" y="72" width="60" height="26" rx="5"/>
 <text class="m" x="340" y="90">Pol II</text>
 <rect class="tf" x="396" y="72" width="50" height="26" rx="5"/>
 <text class="m" x="404" y="90">GTFs</text>
 <text class="s" x="240" y="152">few nucleosomes here, so the initiation complex can form</text>
 <text class="s" x="30" y="178">Measurement: nuclease cuts accessible DNA preferentially; ATAC-seq tags accessible DNA to map the whole genome. The map differs by cell type.</text>

 <text class="th" x="20" y="218">B  Accessibility is a condition, not the whole story</text>
 <line x1="20" y1="228" x2="860" y2="228" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="20" y="242" width="840" height="124" rx="8"/>
 <text class="tb" x="34" y="264">Chromatin state</text>
 <text class="tb" x="230" y="264">Activator present</text>
 <text class="tb" x="420" y="264">Expression</text>
 <text class="tb" x="600" y="264">Why</text>
 <line x1="34" y1="272" x2="846" y2="272" stroke="#c6d2dd" stroke-width="1.2"/>
 <text class="t" x="34" y="292">accessible</text>
 <text class="t" x="230" y="292">yes</text>
 <rect class="hi" x="420" y="280" width="150" height="14"/>
 <text class="t" x="600" y="292">both conditions met</text>
 <text class="t" x="34" y="314">accessible</text>
 <text class="t" x="230" y="314">no</text>
 <rect class="mid" x="420" y="302" width="26" height="14"/>
 <text class="t" x="600" y="314">only the condition is set up</text>
 <text class="t" x="34" y="336">closed</text>
 <text class="t" x="230" y="336">yes</text>
 <rect class="mid" x="420" y="324" width="26" height="14"/>
 <text class="t" x="600" y="336">the factor cannot reach the site</text>
 <text class="t" x="34" y="358">closed</text>
 <text class="t" x="230" y="358">no</text>
 <text class="t" x="420" y="358">none</text>
 <text class="t" x="600" y="358">neither</text>

 <rect class="k" x="20" y="378" width="840" height="36" rx="8"/>
 <text class="tb" x="34" y="402">Prediction, and it holds: force the chromatin open and expression still barely rises if the activator is absent. Combinatorial control now includes chromatin state as an input.</text>
</svg>
