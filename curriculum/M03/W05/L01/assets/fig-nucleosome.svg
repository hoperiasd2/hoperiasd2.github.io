<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"
 aria-label="Composition of the nucleosome and DNA accessibility: about 147 base pairs wrapped around a histone octamer of two copies each of H2A, H2B, H3 and H4, H1 bound to the linker DNA as a separate histone, the difference between a transcription factor site facing the histone surface and one exposed, and the precise meaning of open DNA.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .dna{fill:none;stroke:#16191d;stroke-width:3}
  .oct{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.4}
  .h1{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .site{fill:#f7dedc;stroke:#b3261e;stroke-width:2}
  .tf{fill:#e3f0e4;stroke:#2e7d32;stroke-width:2.2}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
  .ar{stroke:#003c71;stroke-width:2;fill:none;marker-end:url(#a)}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  The nucleosome</text>
 <line x1="20" y1="38" x2="430" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>

 <path class="dna" d="M30 130 h40"/>
 <circle class="oct" cx="110" cy="130" r="36"/>
 <path class="dna" d="M74 112 q36 -22 72 0 M74 148 q36 22 72 0"/>
 <text class="m" x="86" y="126">H2A x2</text>
 <text class="m" x="86" y="140">H2B x2</text>
 <path class="dna" d="M150 130 h44"/>
 <circle class="oct" cx="234" cy="130" r="36"/>
 <path class="dna" d="M198 112 q36 -22 72 0 M198 148 q36 22 72 0"/>
 <text class="m" x="212" y="126">H3 x2</text>
 <text class="m" x="212" y="140">H4 x2</text>
 <path class="dna" d="M274 130 h40"/>
 <circle class="oct" cx="354" cy="130" r="36"/>
 <path class="dna" d="M394 130 h30"/>
 <text class="m" x="60" y="184">about 147 bp per octamer</text>
 <rect class="h1" x="164" y="104" width="22" height="22" rx="4"/>
 <text class="m" x="168" y="120">H1</text>
 <path class="ar" d="M186 98 L212 76"/>
 <text class="s" x="216" y="72">H1 binds the LINKER DNA — it is NOT part of the octamer</text>
 <text class="s" x="30" y="208">Chromatin = DNA plus the proteins bound to it.</text>

 <text class="th" x="460" y="28">B  Why this is the starting point</text>
 <line x1="460" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="k" x="460" y="54" width="400" height="56" rx="8"/>
 <text class="tb" x="474" y="78">The DNA a transcription factor must bind</text>
 <text class="tb" x="474" y="98">is in contact with histones.</text>

 <text class="tb" x="470" y="140">site facing the histone surface</text>
 <path class="dna" d="M470 190 h40"/>
 <circle class="oct" cx="550" cy="190" r="32"/>
 <path class="site" d="M534 158 h32 v10 h-32 z"/>
 <rect class="tf" x="590" y="146" width="56" height="24" rx="5"/>
 <text class="m" x="598" y="162">factor</text>
 <line class="no" x1="570" y1="164" x2="586" y2="160"/>
 <line class="no" x1="574" y1="152" x2="582" y2="172"/>
 <text class="s" x="660" y="164">cannot reach: low accessibility</text>

 <text class="tb" x="470" y="238">site in the exposed linker</text>
 <path class="dna" d="M470 282 h50"/>
 <path class="site" d="M490 274 h32 v10 h-32 z"/>
 <circle class="oct" cx="572" cy="282" r="32"/>
 <rect class="tf" x="480" y="240" width="56" height="24" rx="5"/>
 <text class="m" x="488" y="256">factor</text>
 <path class="ar" d="M508 266 L508 272"/>
 <text class="s" x="624" y="272">can bind: high accessibility</text>

 <rect class="bx" x="20" y="252" width="410" height="88" rx="8"/>
 <text class="tb" x="34" y="276">Accessibility, defined precisely</text>
 <text class="t" x="34" y="298">NOT whether the sequence exists, but whether a protein</text>
 <text class="t" x="34" y="318">can reach it and bind. Move or loosen a nucleosome and</text>
 <text class="t" x="34" y="334">the same sequence gets a different chance.</text>

 <rect class="k" x="20" y="356" width="840" height="36" rx="8"/>
 <text class="tb" x="34" y="380">"Open DNA" does not mean the duplex is unwound. It means chromatin a regulatory protein can reach.</text>
 <text class="s" x="20" y="418">This is the first of the four eukaryotic conditions: in bacteria control is mostly "start or not", here "can it be reached" comes first.</text>
</svg>
