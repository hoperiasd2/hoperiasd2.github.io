<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"
     aria-label="DNA methylation at a CpG island: DNMT transfers a methyl group from SAM to cytosine C5, methyl-CpG binding proteins recruit HDAC and the promoter is silenced">
  <style>
    .ttl{font:700 14px sans-serif;fill:#003c71}
    .nm{font:700 12px sans-serif;fill:#003c71}
    .sub{font:11px sans-serif;fill:#4a5159}
    .seq{font:700 13px sans-serif;fill:#16191d}
    .bx{fill:#ffffff;stroke:#c6d2dd;stroke-width:1.4}
    .hl{fill:#fff5d6;stroke:#003c71;stroke-width:1.3}
    .dna{stroke:#16191d;stroke-width:2.2;fill:none}
    .ln{stroke:#003c71;stroke-width:1.6;fill:none}
    .me{fill:#f2b705;stroke:#16191d;stroke-width:1.1}
    .mel{font:700 9px sans-serif;fill:#16191d}
    .out{font:700 11px sans-serif;fill:#8a6300}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/>
    </marker>
  </defs>

  <text class="ttl" x="20" y="24">A. The CpG dinucleotide is methylated on both strands</text>
  <path class="dna" d="M40 70 L420 70"/>
  <path class="dna" d="M40 110 L420 110"/>
  <text class="seq" x="150" y="64">5'- T  C  G  A -3'</text>
  <text class="seq" x="150" y="128">3'- A  G  C  T -5'</text>
  <circle class="me" cx="196" cy="48" r="10"/><text class="mel" x="189" y="52">Me</text>
  <circle class="me" cx="246" cy="140" r="10"/><text class="mel" x="239" y="144">Me</text>
  <text class="sub" x="40" y="160">CpG is palindromic, so the mark is symmetric and can be copied after replication</text>

  <rect class="hl" x="470" y="44" width="400" height="104" rx="8"/>
  <text class="nm" x="486" y="66">cytosine + SAM</text>
  <path class="ln" d="M600 80 L700 80" marker-end="url(#a1)"/>
  <text class="sub" x="606" y="74">DNMT</text>
  <text class="nm" x="716" y="86">5-methylcytosine + SAH</text>
  <text class="sub" x="486" y="112">DNMT1 : maintenance, follows the replication fork</text>
  <text class="sub" x="486" y="134">DNMT3A / DNMT3B : de novo, sets new patterns</text>

  <text class="ttl" x="20" y="208">B. An unmethylated CpG island promoter is transcribed</text>
  <path class="dna" d="M40 250 L430 250"/>
  <g>
    <circle cx="90" cy="250" r="6" fill="#ffffff" stroke="#16191d"/>
    <circle cx="130" cy="250" r="6" fill="#ffffff" stroke="#16191d"/>
    <circle cx="170" cy="250" r="6" fill="#ffffff" stroke="#16191d"/>
    <circle cx="210" cy="250" r="6" fill="#ffffff" stroke="#16191d"/>
    <circle cx="250" cy="250" r="6" fill="#ffffff" stroke="#16191d"/>
  </g>
  <text class="sub" x="76" y="276">CpG island (open circles = unmethylated)</text>
  <rect class="bx" x="300" y="222" width="110" height="26" rx="4"/>
  <text class="nm" x="314" y="240">Pol II + TF</text>
  <path class="ln" d="M330 258 L420 258" marker-end="url(#a1)"/>
  <text class="out" x="340" y="294">mRNA produced</text>

  <text class="ttl" x="470" y="208">C. Methylation shuts the promoter down</text>
  <path class="dna" d="M490 250 L880 250"/>
  <g>
    <circle class="me" cx="540" cy="250" r="7"/>
    <circle class="me" cx="580" cy="250" r="7"/>
    <circle class="me" cx="620" cy="250" r="7"/>
    <circle class="me" cx="660" cy="250" r="7"/>
    <circle class="me" cx="700" cy="250" r="7"/>
  </g>
  <text class="sub" x="516" y="276">hypermethylated island (filled = 5-methylcytosine)</text>
  <rect class="hl" x="500" y="300" width="170" height="26" rx="4"/>
  <text class="nm" x="512" y="318">MeCP2 / MBD2 binds</text>
  <path class="ln" d="M676 313 L716 313" marker-end="url(#a1)"/>
  <rect class="hl" x="722" y="300" width="150" height="26" rx="4"/>
  <text class="nm" x="734" y="318">HDAC, NuRD</text>
  <text class="out" x="500" y="352">two blocks at once:</text>
  <text class="sub" x="500" y="372">1. the methyl group blocks TF binding directly</text>
  <text class="sub" x="500" y="392">2. MBD proteins recruit HDAC and close the chromatin</text>
</svg>
