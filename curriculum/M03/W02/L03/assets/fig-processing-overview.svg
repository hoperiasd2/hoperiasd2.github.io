<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="The three processing steps a eukaryotic transcript undergoes and why they are needed: the length ratio of exon to intron, the gate structure in which completed processing is the criterion for nuclear export, and the overlapping functions of cap and poly-A tail protecting both ends of the transcript.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:10px monospace;fill:#16191d}
  .ex{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2}
  .inr{fill:#f7f9fb;stroke:#c6d2dd;stroke-width:1.8}
  .cap{fill:#2e7d32}
  .pa{fill:#b3261e}
  .nuc{fill:#eef3f8;stroke:#6b8ba8;stroke-width:2.2}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
  .no{stroke:#b3261e;stroke-width:3;fill:none}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  A eukaryotic gene is mostly intron</text>
 <line x1="20" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="ex" x="40" y="60" width="26" height="22"/>
 <rect class="inr" x="66" y="60" width="200" height="22"/>
 <rect class="ex" x="266" y="60" width="26" height="22"/>
 <rect class="inr" x="292" y="60" width="240" height="22"/>
 <rect class="ex" x="532" y="60" width="26" height="22"/>
 <rect class="inr" x="558" y="60" width="180" height="22"/>
 <rect class="ex" x="738" y="60" width="26" height="22"/>
 <text class="m" x="40" y="100">exon: about 150 nt average</text>
 <text class="m" x="300" y="100">intron: thousands of nt, sometimes hundreds of thousands</text>
 <text class="s" x="40" y="122">Often about 95 percent of the transcript is intron. It cannot be translated until that is removed.</text>

 <text class="th" x="20" y="160">B  Processing is a gate, not just tidying</text>
 <line x1="20" y1="170" x2="430" y2="170" stroke="#c6d2dd" stroke-width="1.5"/>
 <ellipse class="nuc" cx="150" cy="248" rx="120" ry="60"/>
 <text class="m" x="120" y="202">NUCLEUS</text>
 <rect class="ex" x="80" y="232" width="20" height="16"/>
 <rect class="inr" x="100" y="232" width="50" height="16"/>
 <rect class="ex" x="150" y="232" width="20" height="16"/>
 <text class="m" x="76" y="268">unprocessed: stays</text>
 <path class="no" d="M276 240 L320 240"/>
 <path class="no" d="M290 228 L306 252"/>
 <circle class="cap" cx="96" cy="286" r="5"/>
 <rect class="ex" x="104" y="278" width="50" height="16"/>
 <circle class="pa" cx="162" cy="286" r="5"/>
 <path class="ar" d="M276 286 L330 286"/>
 <text class="m" x="340" y="290">to the cytoplasm</text>
 <text class="s" x="20" y="326">Only a correctly processed transcript leaves the nucleus and is translated.</text>

 <text class="th" x="460" y="160">C  Three steps, and overlapping jobs</text>
 <line x1="460" y1="170" x2="860" y2="170" stroke="#c6d2dd" stroke-width="1.5"/>
 <rect class="bx" x="460" y="184" width="400" height="112" rx="8"/>
 <text class="tb" x="474" y="206">Step</text>
 <text class="tb" x="600" y="206">Main role</text>
 <line x1="474" y1="214" x2="846" y2="214" stroke="#c6d2dd" stroke-width="1.2"/>
 <text class="t" x="474" y="234">5' cap</text>
 <text class="t" x="600" y="234">anti-decay, export tag, translation start</text>
 <text class="t" x="474" y="256">splicing</text>
 <text class="t" x="600" y="256">remove introns, generate isoforms</text>
 <text class="t" x="474" y="278">3' cut + poly(A)</text>
 <text class="t" x="600" y="278">anti-decay, export, translation efficiency</text>
 <rect class="k" x="460" y="306" width="400" height="56" rx="8"/>
 <text class="t" x="474" y="328">Cap and poly(A) share their job list: both protect, tag and</text>
 <text class="t" x="474" y="348">assist translation. They guard the two ENDS of one transcript.</text>
 <text class="s" x="460" y="382">That shared task is why the two ends later interact to form a closed loop (section 7).</text>
</svg>
