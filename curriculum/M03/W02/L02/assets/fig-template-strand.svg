<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
 aria-label="Distinguishing template and coding strand and the direction of transcription: the relation between the two strands and the RNA product, the convention of writing a gene sequence as the coding strand, how promoter orientation sets the template, and the two direction criteria of RNA growing five to three while the template is read three to five.">
 <style>
  .bx{fill:#fff;stroke:#c6d2dd;stroke-width:1.8}.k{fill:#fff5d6;stroke:#f2b705;stroke-width:2.2}
  .t{font:12px sans-serif;fill:#16191d}.tb{font:700 13px sans-serif;fill:#003c71}
  .th{font:700 15px sans-serif;fill:#003c71}.s{font:11px sans-serif;fill:#4a5159}
  .m{font:11px monospace;fill:#16191d}
  .mb{font:700 13px monospace;fill:#16191d}
  .dna{fill:none;stroke:#16191d;stroke-width:2.4}
  .rna{stroke:#b3261e;stroke-width:3;fill:none}
  .prom{fill:#e8eff6;stroke:#003c71;stroke-width:2}
  .pol{fill:#dce6f2;stroke:#1a4f8a;stroke-width:2.2}
  .ar{stroke:#003c71;stroke-width:2.2;fill:none;marker-end:url(#a)}
 </style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

 <text class="th" x="20" y="28">A  The three sequences</text>
 <line x1="20" y1="38" x2="520" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <text class="tb" x="34" y="66">coding (sense) strand — what a database shows you</text>
 <text class="mb" x="34" y="92">5'- A T G   G C A   T T C -3'</text>
 <text class="tb" x="34" y="126">template (antisense) strand — what the polymerase reads</text>
 <text class="mb" x="34" y="152">3'- T A C   C G T   A A G -5'</text>
 <text class="tb" x="34" y="186">RNA product — same as the coding strand, T becomes U</text>
 <text class="mb" x="34" y="212" fill="#b3261e">5'- A U G   G C A   U U C -3'</text>
 <rect class="k" x="20" y="230" width="500" height="36" rx="8"/>
 <text class="tb" x="34" y="254">Gene sequences are written as the CODING strand, 5' to 3', because it reads like the RNA.</text>

 <text class="th" x="550" y="28">B  Which strand is the template?</text>
 <line x1="550" y1="38" x2="860" y2="38" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="dna" d="M560 90 h290 M560 106 h290"/>
 <rect class="prom" x="580" y="80" width="46" height="36"/>
 <rect class="prom" x="780" y="80" width="46" height="36"/>
 <path class="ar" d="M632 72 L700 72"/>
 <path class="ar" d="M774 124 L706 124"/>
 <text class="m" x="640" y="66">gene A</text>
 <text class="m" x="712" y="140">gene B</text>
 <text class="s" x="550" y="166">It differs gene by gene. The PROMOTER's orientation sets</text>
 <text class="s" x="550" y="184">both which strand is read and which way the polymerase goes.</text>

 <rect class="bx" x="550" y="202" width="310" height="64" rx="8"/>
 <text class="tb" x="564" y="224">Two mistakes to avoid</text>
 <text class="t" x="564" y="244">swapping template and coding strand;</text>
 <text class="t" x="564" y="260">mixing the two direction criteria below</text>

 <text class="th" x="20" y="306">C  Two directions, pointing opposite ways</text>
 <line x1="20" y1="316" x2="860" y2="316" stroke="#c6d2dd" stroke-width="1.5"/>
 <path class="dna" d="M60 376 h520"/>
 <text class="m" x="36" y="380">3'</text>
 <text class="m" x="588" y="380">5'</text>
 <text class="s" x="200" y="400">template read 3' to 5'</text>
 <path class="pol" d="M300 340 h80 v32 h-80 z"/>
 <text class="m" x="312" y="362">Pol</text>
 <path class="ar" d="M388 356 L440 356"/>
 <path class="rna" d="M180 332 h120"/>
 <text class="m" x="156" y="336">5'</text>
 <text class="s" x="200" y="322">RNA grows 5' to 3'</text>
 <rect class="k" x="620" y="330" width="240" height="88" rx="8"/>
 <text class="t" x="634" y="352">The chemistry fixes this: the growing</text>
 <text class="t" x="634" y="370">chain's 3' OH attacks the incoming</text>
 <text class="t" x="634" y="388">nucleotide's 5' triphosphate, so bonds</text>
 <text class="t" x="634" y="406">always form at the 3' end.</text>
</svg>
