<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 450" width="1124" height="450" role="img"
     aria-label="The standard genetic code table: 64 codons read five prime to three prime, 61 specifying amino acids and three stop codons, with AUG as the start codon">
