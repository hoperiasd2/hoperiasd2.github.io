  <text class="ttl" x="24" y="30">The standard genetic code (mRNA codons, read 5' to 3')</text>
  <text class="sub" x="24" y="52">61 codons specify 20 amino acids; UAA, UAG and UGA are stop codons (shaded). AUG is both start and Met (yellow).</text>
  <text class="sub" x="24" y="72">Degeneracy is concentrated in the third base, which is read by wobble pairing.</text>
