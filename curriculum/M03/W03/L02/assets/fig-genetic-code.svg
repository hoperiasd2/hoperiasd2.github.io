  <text class="hd" x="40" y="406">Met and Trp have one codon each; Leu, Ser and Arg have six each. The code is non-overlapping and commaless.</text>
  <text class="sub" x="40" y="426">Human mitochondria deviate: UGA = Trp, AUA = Met, AGA and AGG = stop. UGA is recoded as selenocysteine when a SECIS element is present.</text>
