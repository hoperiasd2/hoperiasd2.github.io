<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img"
     aria-label="Two-step charging of transfer RNA by aminoacyl-tRNA synthetase, with the editing site that hydrolyses mischarged products">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .ln { stroke:#16191d; stroke-width:2; fill:none; }
    .box { fill:#ffffff; stroke:#c6d2dd; stroke-width:1.2; }
    .hl { fill:#fff5d6; stroke:#c6d2dd; stroke-width:1.2; }
    .enz { fill:#003c71; stroke:#16191d; stroke-width:1.2; }
    .enl { font:700 12px sans-serif; fill:#ffffff; }
    .mol { font:700 13px sans-serif; fill:#16191d; }
    .small { font:11px sans-serif; fill:#8a6300; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16191d"/>
    </marker>
  </defs>
  <text class="ttl" x="20" y="26">Aminoacyl-tRNA synthetase: one enzyme per amino acid, two reaction steps</text>

  <rect class="box" x="20" y="56" width="190" height="52" rx="4"/>
  <text class="mol" x="36" y="80">Amino acid</text>
  <text class="sub" x="36" y="98">+ ATP</text>
  <path class="ln" d="M210 82 L286 82" marker-end="url(#a2)"/>
  <text class="nm" x="216" y="70">Step 1</text>
  <text class="small" x="214" y="104">PPi released</text>
  <rect class="hl" x="286" y="56" width="214" height="52" rx="4"/>
  <text class="mol" x="302" y="80">Aminoacyl-AMP</text>
  <text class="sub" x="302" y="98">enzyme-bound intermediate</text>
  <path class="ln" d="M500 82 L576 82" marker-end="url(#a2)"/>
  <text class="nm" x="506" y="70">Step 2</text>
  <text class="small" x="504" y="104">AMP released</text>
  <rect class="box" x="576" y="56" width="264" height="52" rx="4"/>
  <text class="mol" x="592" y="80">Aminoacyl-tRNA</text>
  <text class="sub" x="592" y="98">ester bond to 3'-OH of terminal A of CCA</text>
  <path class="ln" d="M700 130 L700 108" marker-end="url(#a2)"/>
  <text class="sub" x="648" y="148">uncharged tRNA enters here</text>

  <rect class="enz" x="240" y="186" width="380" height="44" rx="6"/>
  <text class="enl" x="262" y="213">Aminoacyl-tRNA synthetase (20 enzymes)</text>
  <path class="ln" d="M330 186 L330 118" marker-end="url(#a2)"/>
  <path class="ln" d="M520 186 L520 118" marker-end="url(#a2)"/>

  <rect class="box" x="20" y="262" width="390" height="118" rx="4"/>
  <text class="nm" x="36" y="286">Two recognition events</text>
  <text class="sub" x="36" y="308">1. the correct amino acid, selected by size and charge</text>
  <text class="sub" x="36" y="328">2. the correct tRNA, read from the acceptor stem,</text>
  <text class="sub" x="56" y="346">the anticodon and discriminator bases</text>
  <text class="sub" x="36" y="368">This double specificity is called the second genetic code.</text>

  <rect class="hl" x="430" y="262" width="410" height="118" rx="4"/>
  <text class="nm" x="446" y="286">Editing (proofreading) site</text>
  <text class="sub" x="446" y="308">A separate domain hydrolyses a wrongly activated amino</text>
  <text class="sub" x="446" y="328">acid or a mischarged tRNA, so the overall error rate falls</text>
  <text class="sub" x="446" y="348">to roughly 1 in 10,000 to 100,000 charging events.</text>
  <text class="sub" x="446" y="370">The ribosome cannot check the amino acid, only the codon-anticodon pair.</text>
</svg>
