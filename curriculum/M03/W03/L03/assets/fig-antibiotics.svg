<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"
     aria-label="Drugs and toxins that inhibit translation mapped onto the ribosomal subunit and step they block">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:11px sans-serif; fill:#4a5159; }
    .big { fill:#003c71; stroke:#16191d; stroke-width:1.3; }
    .small { fill:#f2b705; stroke:#16191d; stroke-width:1.3; }
    .bl { font:700 13px sans-serif; fill:#ffffff; }
    .sl { font:700 13px sans-serif; fill:#16191d; }
    .t { font:11px sans-serif; fill:#16191d; }
    .tb { font:700 11px sans-serif; fill:#003c71; }
    .cell { fill:#ffffff; stroke:#c6d2dd; stroke-width:0.9; }
    .alt { fill:#fff5d6; stroke:#c6d2dd; stroke-width:0.9; }
    .hdc { fill:#003c71; }
    .hdt { font:700 11px sans-serif; fill:#ffffff; }
    .ln { stroke:#16191d; stroke-width:1.4; fill:none; }
  </style>
  <text class="ttl" x="20" y="26">Where translation inhibitors act</text>

  <path class="big" d="M60 54 C60 42 300 42 300 54 L300 112 C300 130 60 130 60 112 Z"/>
  <text class="bl" x="80" y="92">50S / 60S large subunit</text>
  <path class="small" d="M60 142 C60 130 300 130 300 142 L300 194 C300 212 60 212 60 194 Z"/>
  <text class="sl" x="84" y="176">30S / 40S small subunit</text>
  <path class="ln" d="M330 86 L306 86"/>
  <text class="tb" x="338" y="76">Macrolides, chloramphenicol,</text>
  <text class="tb" x="338" y="92">clindamycin, linezolid</text>
  <path class="ln" d="M330 168 L306 168"/>
  <text class="tb" x="338" y="162">Aminoglycosides, tetracyclines</text>
  <text class="sub" x="60" y="236">Selectivity rests on sequence differences in rRNA; the mitochondrial ribosome resembles the bacterial one, so toxicity follows.</text>

  <rect class="hdc" x="20" y="256" width="150" height="26"/><text class="hdt" x="30" y="274">Drug or toxin</text>
  <rect class="hdc" x="170" y="256" width="150" height="26"/><text class="hdt" x="180" y="274">Target</text>
  <rect class="hdc" x="320" y="256" width="250" height="26"/><text class="hdt" x="330" y="274">Step blocked</text>
  <rect class="hdc" x="570" y="256" width="290" height="26"/><text class="hdt" x="580" y="274">Clinical note</text>

  <rect class="alt" x="20" y="282" width="150" height="26"/><text class="t" x="30" y="300">Aminoglycosides</text>
  <rect class="alt" x="170" y="282" width="150" height="26"/><text class="t" x="180" y="300">30S, 16S rRNA A site</text>
  <rect class="alt" x="320" y="282" width="250" height="26"/><text class="t" x="330" y="300">misreading and blocked translocation</text>
  <rect class="alt" x="570" y="282" width="290" height="26"/><text class="t" x="580" y="300">bactericidal; ototoxic, nephrotoxic</text>

  <rect class="cell" x="20" y="308" width="150" height="26"/><text class="t" x="30" y="326">Tetracyclines</text>
  <rect class="cell" x="170" y="308" width="150" height="26"/><text class="t" x="180" y="326">30S A site</text>
  <rect class="cell" x="320" y="308" width="250" height="26"/><text class="t" x="330" y="326">aminoacyl-tRNA cannot enter A site</text>
  <rect class="cell" x="570" y="308" width="290" height="26"/><text class="t" x="580" y="326">bacteriostatic; tooth staining in children</text>

  <rect class="alt" x="20" y="334" width="150" height="26"/><text class="t" x="30" y="352">Chloramphenicol</text>
  <rect class="alt" x="170" y="334" width="150" height="26"/><text class="t" x="180" y="352">50S, 23S rRNA</text>
  <rect class="alt" x="320" y="334" width="250" height="26"/><text class="t" x="330" y="352">peptidyl transferase reaction</text>
  <rect class="alt" x="570" y="334" width="290" height="26"/><text class="t" x="580" y="352">aplastic anaemia; gray baby syndrome</text>

  <rect class="cell" x="20" y="360" width="150" height="26"/><text class="t" x="30" y="378">Macrolides</text>
  <rect class="cell" x="170" y="360" width="150" height="26"/><text class="t" x="180" y="378">50S exit tunnel</text>
  <rect class="cell" x="320" y="360" width="250" height="26"/><text class="t" x="330" y="378">translocation and chain egress</text>
  <rect class="cell" x="570" y="360" width="290" height="26"/><text class="t" x="580" y="378">erm methylase gives MLS resistance</text>

  <rect class="alt" x="20" y="386" width="150" height="26"/><text class="t" x="30" y="404">Diphtheria toxin, ricin</text>
  <rect class="alt" x="170" y="386" width="150" height="26"/><text class="t" x="180" y="404">eEF2, 28S rRNA</text>
  <rect class="alt" x="320" y="386" width="250" height="26"/><text class="t" x="330" y="404">eukaryotic elongation</text>
  <rect class="alt" x="570" y="386" width="290" height="26"/><text class="t" x="580" y="404">catalytic: a few molecules kill a cell</text>
</svg>
