<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"
     aria-label="Consensus sequences that define an intron: the GU of the 5 prime splice site, the branch point adenosine, the polypyrimidine tract and the AG of the 3 prime splice site">
  <style>
    .ex { fill:#003c71; stroke:#16191d; stroke-width:1.5; }
    .exl { font:700 14px sans-serif; fill:#ffffff; }
    .ln { stroke:#16191d; stroke-width:2; fill:none; }
    .seq { font:700 14px monospace; fill:#16191d; }
    .seqm { font:700 14px monospace; fill:#8a6300; }
    .lab { font:700 12px sans-serif; fill:#003c71; }
    .sub { font:12px sans-serif; fill:#4a5159; }
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .mk { fill:none; stroke:#f2b705; stroke-width:3; }
    .lead { stroke:#4a5159; stroke-width:1.2; stroke-dasharray:4 3; fill:none; }
    .box { fill:#fff5d6; stroke:#c6d2dd; stroke-width:1; }
  </style>
  <text class="ttl" x="24" y="26">GU-AG rule: 99% of human introns begin with GU and end with AG</text>

  <rect class="ex" x="24" y="60" width="150" height="38" rx="3"/>
  <text class="exl" x="74" y="85">Exon 1</text>
  <path class="ln" d="M174 79 L686 79"/>
  <rect class="ex" x="686" y="60" width="150" height="38" rx="3"/>
  <text class="exl" x="738" y="85">Exon 2</text>
  <text class="sub" x="380" y="70">Intron</text>

  <text class="seq" x="110" y="130">A G</text>
  <text class="seqm" x="180" y="130">G U</text>
  <text class="seq" x="218" y="130">R A G U</text>
  <circle class="mk" cx="196" cy="125" r="18"/>
  <path class="lead" d="M196 148 L196 170"/>
  <text class="lab" x="130" y="188">5' splice site (donor)</text>
  <text class="sub" x="150" y="206">U1 snRNP binds here</text>

  <text class="seq" x="352" y="130">Y N C U R A Y</text>
  <circle class="mk" cx="439" cy="125" r="15"/>
  <path class="lead" d="M439 148 L439 170"/>
  <text class="lab" x="378" y="188">Branch point A</text>
  <text class="sub" x="340" y="206">18-40 nt upstream of 3' site</text>
  <text class="sub" x="368" y="224">U2 snRNP binds here</text>

  <text class="seq" x="520" y="130">U C U U C U C U U C</text>
  <path class="lead" d="M580 142 L580 170"/>
  <text class="lab" x="520" y="188">Polypyrimidine tract</text>
  <text class="sub" x="534" y="206">10-20 nt, U2AF binds</text>

  <text class="seq" x="672" y="130">A G</text>
  <circle class="mk" cx="688" cy="125" r="18"/>
  <path class="lead" d="M700 148 L716 170"/>
  <text class="lab" x="672" y="188">3' splice site</text>
  <text class="sub" x="672" y="206">(acceptor)</text>

  <rect class="box" x="24" y="252" width="812" height="58" rx="4"/>
  <text class="lab" x="40" y="274">Minor (U12-type) spliceosome: AU ... AC introns, under 1% of human introns</text>
  <text class="sub" x="40" y="296">Auxiliary elements decide which candidate site is used: ESE / ESS in exons, ISE / ISS in introns</text>
</svg>
