<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img"
     aria-label="The four-reaction cycle of fatty acid synthase: condensation, reduction, dehydration and a second reduction, repeated seven times to give palmitate">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12.5px sans-serif; fill:#16191d; }
    .mn { font:700 12px monospace; fill:#16191d; }
    .sub { font:11.5px sans-serif; fill:#4a5159; }
    .lab { font:700 11px sans-serif; fill:#8a6300; }
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.5; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.2; }
    .nv { fill:#003c71; }
    .st { font:700 12px sans-serif; fill:#fff; }
    .ar { stroke:#003c71; stroke-width:2.2; fill:none; marker-end:url(#h); }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

  <text class="ttl" x="20" y="26">Loading</text>
  <rect class="bx" x="20" y="38" width="250" height="110" rx="7"/>
  <text class="mn" x="38" y="64">Acetyl-CoA</text>
  <path class="ar" d="M140 60 L196 60"/>
  <text class="mn" x="200" y="64">Acetyl-S-E</text>
  <text class="mn" x="38" y="104">Malonyl-CoA</text>
  <path class="ar" d="M152 100 L196 100"/>
  <text class="mn" x="200" y="104">Malonyl-ACP</text>
  <text class="sub" x="38" y="134">ACP carries a phosphopantetheine arm</text>

  <rect class="nv" x="330" y="38" width="20" height="20" rx="3"/>
  <text class="ttl" x="360" y="54">Step 1  Condensation</text>
  <rect class="bx" x="330" y="64" width="528" height="68" rx="7"/>
  <text class="mn" x="348" y="90">Acetyl-S-E + Malonyl-ACP  to  Acetoacetyl-ACP + CO2</text>
  <text class="sub" x="348" y="112">The CO2 lost here is the one added by acetyl-CoA carboxylase. Its release drives the otherwise unfavourable C-C bond formation.</text>

  <rect class="nv" x="330" y="148" width="20" height="20" rx="3"/>
  <text class="ttl" x="360" y="164">Step 2  Reduction</text>
  <rect class="bx" x="330" y="174" width="528" height="54" rx="7"/>
  <text class="mn" x="348" y="200">Acetoacetyl-ACP + NADPH  to  D-3-Hydroxybutyryl-ACP</text>
  <text class="sub" x="348" y="220">keto group reduced to a hydroxyl group; note the D configuration</text>

  <rect class="nv" x="330" y="244" width="20" height="20" rx="3"/>
  <text class="ttl" x="360" y="260">Step 3  Dehydration</text>
  <rect class="bx" x="330" y="270" width="528" height="54" rx="7"/>
  <text class="mn" x="348" y="296">D-3-Hydroxybutyryl-ACP  to  Crotonyl-ACP + H2O</text>
  <text class="sub" x="348" y="316">a trans double bond is formed</text>

  <rect class="nv" x="330" y="340" width="20" height="20" rx="3"/>
  <text class="ttl" x="360" y="356">Step 4  Reduction</text>
  <rect class="bk" x="330" y="366" width="528" height="54" rx="7"/>
  <text class="mn" x="348" y="392">Crotonyl-ACP + NADPH  to  Butyryl-ACP</text>
  <text class="sub" x="348" y="412">the chain is now two carbons longer and fully saturated</text>

  <path class="ar" d="M312 394 L312 100 L324 100"/>
  <text class="lab" x="150" y="206">Repeat 7 times</text>
  <text class="sub" x="150" y="226">butyryl moves to the</text>
  <text class="sub" x="150" y="244">condensing site and a</text>
  <text class="sub" x="150" y="262">new malonyl-ACP loads</text>

  <rect class="bk" x="20" y="286" width="250" height="134" rx="7"/>
  <text class="lab" x="38" y="310">After the 7th cycle</text>
  <text class="mn" x="38" y="334">Palmitoyl-ACP (16:0)</text>
  <text class="sub" x="38" y="354">thioesterase releases free</text>
  <text class="sub" x="38" y="372">palmitate and the enzyme</text>
  <text class="sub" x="38" y="390">is ready for another chain</text>
  <text class="lab" x="38" y="412">Palmitate is the only product</text>

  <text class="sub" x="20" y="446">Overall: 8 acetyl-CoA + 7 ATP + 14 NADPH to palmitate + 8 CoA + 6 H2O + 7 ADP + 7 Pi. Human FAS is a homodimer; one polypeptide holds all seven catalytic activities plus ACP.</text>
</svg>
