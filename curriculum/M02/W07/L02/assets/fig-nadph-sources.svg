<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"
     aria-label="Three cytosolic sources of NADPH for fatty acid synthesis: pentose phosphate pathway, malic enzyme and cytosolic isocitrate dehydrogenase">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12.5px sans-serif; fill:#16191d; }
    .mn { font:700 12px monospace; fill:#16191d; }
    .sub { font:11.5px sans-serif; fill:#4a5159; }
    .lab { font:700 11px sans-serif; fill:#8a6300; }
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.5; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.4; }
    .ar { stroke:#003c71; stroke-width:2.2; fill:none; marker-end:url(#h); }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

  <text class="ttl" x="20" y="26">Cytosolic NADPH supply for the 14 reductive steps</text>

  <rect class="bx" x="20" y="40" width="258" height="130" rx="7"/>
  <text class="nm" x="38" y="66">Pentose phosphate pathway</text>
  <text class="mn" x="38" y="92">G6PD, 6PGD</text>
  <text class="sub" x="38" y="114">2 NADPH per glucose 6-phosphate</text>
  <text class="lab" x="38" y="140">main source in liver and</text>
  <text class="lab" x="38" y="158">adipose tissue</text>

  <rect class="bx" x="300" y="40" width="258" height="130" rx="7"/>
  <text class="nm" x="318" y="66">Malic enzyme</text>
  <text class="mn" x="318" y="92">malate to pyruvate + CO2</text>
  <text class="sub" x="318" y="114">1 NADPH per turn of the</text>
  <text class="sub" x="318" y="132">citrate shuttle</text>
  <text class="lab" x="318" y="158">couples acetyl delivery to reducing power</text>

  <rect class="bx" x="580" y="40" width="258" height="130" rx="7"/>
  <text class="nm" x="598" y="66">Cytosolic isocitrate</text>
  <text class="nm" x="598" y="84">dehydrogenase (IDH1)</text>
  <text class="mn" x="598" y="110">isocitrate to 2-oxoglutarate</text>
  <text class="sub" x="598" y="132">minor contribution in most</text>
  <text class="sub" x="598" y="150">human tissues</text>

  <path class="ar" d="M148 176 L404 206"/>
  <path class="ar" d="M428 176 L428 200"/>
  <path class="ar" d="M708 176 L452 206"/>
  <rect class="bk" x="268" y="212" width="320" height="56" rx="7"/>
  <text class="nm" x="288" y="236">14 NADPH per palmitate</text>
  <text class="sub" x="288" y="256">2 per cycle, 7 cycles</text>

  <text class="sub" x="20" y="296">Synthesis therefore depends on the fed state twice over: insulin raises the pathway enzymes, and carbohydrate flux supplies both acetyl units and NADPH.</text>
  <text class="sub" x="20" y="316">NADPH is kept separate from NADH; the reductive biosynthetic pool is not used by the electron transport chain.</text>
</svg>
