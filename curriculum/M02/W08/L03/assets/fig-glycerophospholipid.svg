<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="General structure of a glycerophospholipid with the sn-1 and sn-2 acyl chains and the phosphate head group, and a table of the common head groups">
  <style>
    .b { stroke:#16191d; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .es { stroke:#003c71; stroke-width:2.6; fill:none; }
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12.5px sans-serif; fill:#16191d; }
    .at { font:600 11.5px monospace; fill:#16191d; }
    .sub { font:11.5px sans-serif; fill:#4a5159; }
    .lab { font:700 11px sans-serif; fill:#8a6300; }
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.5; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.2; }
    .nv { fill:#003c71; }
    .st { font:700 11.5px sans-serif; fill:#fff; }
    .hd { fill:#eff4f8; stroke:#c6d2dd; stroke-width:1.3; }
  </style>

  <text class="ttl" x="20" y="26">Glycerophospholipid: glycerol 3-phosphate with two acyl chains and a head group</text>
  <rect class="bx" x="20" y="38" width="400" height="236" rx="7"/>
  <text class="at" x="44" y="80">CH2</text>
  <text class="at" x="44" y="150">CH</text>
  <text class="at" x="44" y="220">CH2</text>
  <path class="b" d="M54 88 L54 138"/>
  <path class="b" d="M54 158 L54 208"/>
  <text class="lab" x="20" y="76">1</text>
  <text class="lab" x="20" y="146">2</text>
  <text class="lab" x="20" y="216">3</text>

  <path class="es" d="M78 76 L104 76"/>
  <text class="at" x="108" y="80">O-CO</text>
  <path class="b" d="M160 76 L186 62 L212 76 L238 62 L264 76 L290 62 L316 76"/>
  <text class="sub" x="330" y="80">saturated, often 16:0</text>

  <path class="es" d="M78 146 L104 146"/>
  <text class="at" x="108" y="150">O-CO</text>
  <path class="b" d="M160 146 L186 132 L212 146 L238 132 L264 146 L290 132"/>
  <text class="sub" x="330" y="150">often unsaturated</text>
  <text class="lab" x="160" y="170">target of phospholipase A2</text>

  <path class="es" d="M78 216 L104 216"/>
  <text class="at" x="108" y="220">O</text>
  <path class="es" d="M124 216 L148 216"/>
  <text class="at" x="152" y="220">PO3-</text>
  <path class="es" d="M196 216 L220 216"/>
  <text class="at" x="224" y="220">X (head group)</text>
  <text class="sub" x="40" y="254">The phosphate and head group are charged; the two chains are not. The molecule is amphipathic and forms bilayers, not micelles.</text>

  <rect class="nv" x="440" y="38" width="200" height="26"/>
  <rect class="nv" x="640" y="38" width="200" height="26"/>
  <text class="st" x="456" y="56">Head group X</text>
  <text class="st" x="656" y="56">Phospholipid, note</text>
  <rect class="hd" x="440" y="64" width="400" height="26"/>
  <text class="sub" x="456" y="82">H (none)</text>
  <text class="sub" x="656" y="82">Phosphatidate, the precursor</text>
  <rect class="bx" x="440" y="90" width="400" height="26"/>
  <text class="sub" x="456" y="108">Choline</text>
  <text class="sub" x="656" y="108">Phosphatidylcholine, most abundant</text>
  <rect class="hd" x="440" y="116" width="400" height="26"/>
  <text class="sub" x="456" y="134">Ethanolamine</text>
  <text class="sub" x="656" y="134">Phosphatidylethanolamine</text>
  <rect class="bx" x="440" y="142" width="400" height="26"/>
  <text class="sub" x="456" y="160">Serine</text>
  <text class="sub" x="656" y="160">Phosphatidylserine, inner leaflet marker</text>
  <rect class="hd" x="440" y="168" width="400" height="26"/>
  <text class="sub" x="456" y="186">Inositol</text>
  <text class="sub" x="656" y="186">Phosphatidylinositol, signalling</text>
  <rect class="bx" x="440" y="194" width="400" height="26"/>
  <text class="sub" x="456" y="212">Glycerol</text>
  <text class="sub" x="656" y="212">Phosphatidylglycerol, surfactant</text>
  <rect class="hd" x="440" y="220" width="400" height="26"/>
  <text class="sub" x="456" y="238">Phosphatidylglycerol</text>
  <text class="sub" x="656" y="238">Cardiolipin, inner mitochondrial membrane</text>
  <rect class="bx" x="440" y="246" width="400" height="28"/>
  <text class="sub" x="456" y="265">Choline, one chain only</text>
  <text class="sub" x="656" y="265">Lysophosphatidylcholine, detergent-like</text>

  <rect class="bk" x="20" y="292" width="826" height="92" rx="7"/>
  <text class="lab" x="40" y="316">Two features to carry forward</text>
  <text class="sub" x="40" y="338">Distribution is asymmetric: choline and sphingomyelin face outward, serine and inositol face the cytosol. Loss of that asymmetry, with</text>
  <text class="sub" x="40" y="356">phosphatidylserine appearing on the outer face, is a signal for apoptosis and for platelet coagulation activity.</text>
  <text class="sub" x="40" y="376">Ether phospholipids, in which sn-1 carries an ether rather than an ester bond, include the plasmalogens and platelet-activating factor.</text>
</svg>
