<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"
     aria-label="Structures of acetoacetate, beta-hydroxybutyrate and acetone with their pKa and clinical properties">
  <style>
    .b { stroke:#16191d; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .db { stroke:#16191d; stroke-width:2.2; fill:none; }
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 13px sans-serif; fill:#16191d; }
    .at { font:600 12px monospace; fill:#16191d; }
    .sub { font:11.5px sans-serif; fill:#4a5159; }
    .lab { font:700 11px sans-serif; fill:#8a6300; }
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.5; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.2; }
  </style>
  <text class="ttl" x="20" y="26">The three ketone bodies</text>

  <rect class="bx" x="20" y="38" width="270" height="178" rx="7"/>
  <text class="nm" x="38" y="64">Acetoacetate</text>
  <text class="at" x="38" y="104">CH3</text>
  <path class="b" d="M74 100 L104 100"/>
  <text class="at" x="108" y="104">C</text>
  <path class="db" d="M116 92 L116 74"/>
  <path class="db" d="M122 92 L122 74"/>
  <text class="at" x="112" y="70">O</text>
  <path class="b" d="M128 100 L158 100"/>
  <text class="at" x="162" y="104">CH2</text>
  <path class="b" d="M200 100 L226 100"/>
  <text class="at" x="230" y="104">COO-</text>
  <text class="sub" x="38" y="140">a true beta-keto acid; pKa about 3.6</text>
  <text class="sub" x="38" y="160">unstable, decarboxylates spontaneously</text>
  <text class="lab" x="38" y="186">the only one the nitroprusside strip detects</text>
  <text class="sub" x="38" y="206">parent compound of the group</text>

  <rect class="bx" x="300" y="38" width="270" height="178" rx="7"/>
  <text class="nm" x="318" y="64">beta-Hydroxybutyrate</text>
  <text class="at" x="318" y="104">CH3</text>
  <path class="b" d="M354 100 L384 100"/>
  <text class="at" x="388" y="104">CH</text>
  <path class="b" d="M398 92 L398 74"/>
  <text class="at" x="388" y="70">OH</text>
  <path class="b" d="M412 100 L442 100"/>
  <text class="at" x="446" y="104">CH2</text>
  <path class="b" d="M484 100 L508 100"/>
  <text class="at" x="512" y="104">COO-</text>
  <text class="sub" x="318" y="140">not a ketone at all; the keto group is reduced</text>
  <text class="sub" x="318" y="160">pKa about 4.4</text>
  <text class="lab" x="318" y="186">the predominant form in blood, 3:1 or higher</text>
  <text class="sub" x="318" y="206">measured as the clinical marker</text>

  <rect class="bx" x="580" y="38" width="266" height="178" rx="7"/>
  <text class="nm" x="598" y="64">Acetone</text>
  <text class="at" x="598" y="104">CH3</text>
  <path class="b" d="M634 100 L664 100"/>
  <text class="at" x="668" y="104">C</text>
  <path class="db" d="M676 92 L676 74"/>
  <path class="db" d="M682 92 L682 74"/>
  <text class="at" x="672" y="70">O</text>
  <path class="b" d="M688 100 L718 100"/>
  <text class="at" x="722" y="104">CH3</text>
  <text class="sub" x="598" y="140">formed non-enzymatically from acetoacetate</text>
  <text class="sub" x="598" y="160">volatile, exhaled; not metabolised further</text>
  <text class="lab" x="598" y="186">the fruity breath; no acid group</text>
  <text class="sub" x="598" y="206">does not contribute to acidosis</text>

  <rect class="bk" x="20" y="232" width="826" height="52" rx="7"/>
  <text class="lab" x="40" y="256">Two of the three carry a carboxyl group with a pKa well below blood pH, so at pH 7.4 they are fully ionised.</text>
  <text class="sub" x="40" y="276">Each molecule released therefore delivers one proton to the blood. That is the chemical basis of ketoacidosis.</text>
</svg>
