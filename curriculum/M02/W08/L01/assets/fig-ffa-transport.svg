<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"
     aria-label="Fate of the products of lipolysis: free fatty acids carried on albumin to muscle, heart and liver, and glycerol taken up by liver for gluconeogenesis">
  <style>
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .nm { font:700 12.5px sans-serif; fill:#16191d; }
    .mn { font:700 12px monospace; fill:#16191d; }
    .sub { font:11.5px sans-serif; fill:#4a5159; }
    .lab { font:700 11px sans-serif; fill:#8a6300; }
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.5; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.2; }
    .ar { stroke:#003c71; stroke-width:2.2; fill:none; marker-end:url(#h); }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

  <rect class="bk" x="20" y="150" width="190" height="78" rx="7"/>
  <text class="nm" x="40" y="176">Adipocyte lipolysis</text>
  <text class="sub" x="40" y="198">3 free fatty acids</text>
  <text class="sub" x="40" y="218">+ 1 glycerol</text>

  <path class="ar" d="M214 174 L282 120"/>
  <path class="ar" d="M214 204 L282 258"/>

  <rect class="bx" x="290" y="60" width="268" height="120" rx="7"/>
  <text class="ttl" x="308" y="86">Free fatty acid</text>
  <text class="sub" x="308" y="108">insoluble, so carried bound to albumin</text>
  <text class="sub" x="308" y="128">about 2-3 molecules per albumin at rest,</text>
  <text class="sub" x="308" y="146">up to 7 when lipolysis is maximal</text>
  <text class="lab" x="308" y="170">plasma level 0.3-0.6 mmol/L fasting</text>

  <rect class="bx" x="290" y="200" width="268" height="120" rx="7"/>
  <text class="ttl" x="308" y="226">Glycerol</text>
  <text class="sub" x="308" y="248">water soluble, travels free in plasma</text>
  <text class="sub" x="308" y="268">cannot be reused by the adipocyte, which</text>
  <text class="sub" x="308" y="286">has no glycerol kinase</text>
  <text class="lab" x="308" y="310">a useful index of lipolytic rate</text>

  <path class="ar" d="M562 100 L622 86"/>
  <path class="ar" d="M562 130 L622 160"/>
  <path class="ar" d="M562 252 L622 238"/>

  <rect class="bx" x="630" y="60" width="226" height="54" rx="7"/>
  <text class="nm" x="648" y="84">Muscle, heart</text>
  <text class="sub" x="648" y="104">beta-oxidation for ATP</text>

  <rect class="bx" x="630" y="126" width="226" height="80" rx="7"/>
  <text class="nm" x="648" y="150">Liver</text>
  <text class="sub" x="648" y="170">beta-oxidation, ketone bodies,</text>
  <text class="sub" x="648" y="190">or re-esterification into VLDL</text>

  <rect class="bk" x="630" y="214" width="226" height="80" rx="7"/>
  <text class="nm" x="648" y="238">Liver, glycerol kinase</text>
  <text class="mn" x="648" y="260">to glycerol 3-phosphate</text>
  <text class="sub" x="648" y="280">then gluconeogenesis</text>

  <text class="sub" x="20" y="344">Albumin binding keeps the free, unbound concentration low, which protects membranes from the detergent action of fatty acids.</text>
  <text class="sub" x="20" y="364">It also means fatty acids cannot cross the blood-brain barrier, so the brain needs another fuel in prolonged fasting.</text>
</svg>
