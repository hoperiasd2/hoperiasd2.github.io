<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="Four stages of cholesterol biosynthesis from acetyl-CoA through HMG-CoA, mevalonate, isoprene units and squalene to cholesterol">
  <style>
    .bx { fill:#fff; stroke:#c6d2dd; stroke-width:1.6; }
    .bk { fill:#fff5d6; stroke:#f2b705; stroke-width:2.4; }
    .m { font:700 14px monospace; fill:#16191d; }
    .c { font:600 11px monospace; fill:#003c71; }
    .e { font:11px sans-serif; fill:#4a5159; }
    .eb { font:700 11px sans-serif; fill:#8a6300; }
    .st { font:700 12px sans-serif; fill:#fff; }
    .sb { fill:#003c71; }
    .ar { stroke:#003c71; stroke-width:2; fill:none; marker-end:url(#h); }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#003c71"/></marker></defs>

  <!-- Stage 1 -->
  <rect class="sb" x="16" y="14" width="58" height="19" rx="3"/><text class="st" x="26" y="28">Stage 1</text>
  <rect class="bx" x="16" y="44" width="150" height="54" rx="7"/>
  <text class="m" x="30" y="68">Acetyl-CoA x3</text><text class="c" x="30" y="87">3 x C2</text>
  <path class="ar" d="M174 71 L270 71"/>
  <text class="e" x="178" y="61">thiolase</text>
  <text class="e" x="178" y="90">HMG-CoA synthase</text>
  <rect class="bx" x="278" y="44" width="140" height="54" rx="7"/>
  <text class="m" x="292" y="68">HMG-CoA</text><text class="c" x="292" y="87">C6 · cytosol</text>

  <!-- Stage 2 -->
  <rect class="sb" x="458" y="14" width="58" height="19" rx="3"/><text class="st" x="468" y="28">Stage 2</text>
  <path class="ar" d="M424 71 L472 71"/>
  <rect class="bk" x="478" y="36" width="176" height="70" rx="7"/>
  <text class="m" x="494" y="60">Mevalonate</text><text class="c" x="494" y="78">C6</text>
  <text class="eb" x="494" y="97">RATE-LIMITING STEP</text>
  <text class="eb" x="672" y="60">HMG-CoA reductase</text>
  <text class="e" x="672" y="78">2 NADPH · irreversible</text>
  <text class="e" x="672" y="94">target of statins</text>

  <!-- Stage 3 -->
  <rect class="sb" x="16" y="156" width="58" height="19" rx="3"/><text class="st" x="26" y="170">Stage 3</text>
  <rect class="bx" x="16" y="186" width="158" height="54" rx="7"/>
  <text class="m" x="30" y="210">Isopentenyl-PP</text><text class="c" x="30" y="229">C5 · isoprene unit</text>
  <path class="ar" d="M180 214 L236 214"/>
  <rect class="bx" x="242" y="186" width="146" height="54" rx="7"/>
  <text class="m" x="258" y="210">Geranyl-PP</text><text class="c" x="258" y="229">C10</text>
  <path class="ar" d="M394 214 L450 214"/>
  <rect class="bx" x="456" y="186" width="146" height="54" rx="7"/>
  <text class="m" x="472" y="210">Farnesyl-PP</text><text class="c" x="472" y="229">C15</text>
  <text class="e" x="16" y="259">3 ATP consumed, then decarboxylation</text>

  <!-- branch to the right -->
  <path class="ar" d="M608 213 L666 213" stroke="#8a6300"/>
  <rect class="bk" x="672" y="178" width="212" height="70" rx="7"/>
  <text class="eb" x="686" y="200">Branch point</text>
  <text class="e" x="686" y="219">CoQ10 · dolichol</text>
  <text class="e" x="686" y="236">prenyl groups for Ras, Rho</text>

  <!-- stage 3 to 4 -->
  <path class="ar" d="M529 246 L529 286 L90 286 L90 332"/>
  <text class="e" x="420" y="278">2 x farnesyl-PP</text>

  <!-- Stage 4 -->
  <rect class="sb" x="16" y="300" width="58" height="19" rx="3"/><text class="st" x="26" y="314">Stage 4</text>
  <rect class="bx" x="16" y="338" width="134" height="54" rx="7"/>
  <text class="m" x="30" y="362">Squalene</text><text class="c" x="30" y="381">C30</text>
  <path class="ar" d="M156 366 L228 366"/>
  <text class="e" x="156" y="356">O2, NADPH</text>
  <rect class="bx" x="234" y="338" width="150" height="54" rx="7"/>
  <text class="m" x="248" y="362">Lanosterol</text><text class="c" x="248" y="381">C30 · cyclization</text>
  <path class="ar" d="M390 366 L462 366"/>
  <text class="e" x="392" y="356">~19 steps</text>
  <rect class="bk" x="468" y="338" width="150" height="54" rx="7"/>
  <text class="m" x="484" y="362">Cholesterol</text><text class="c" x="484" y="381">C27</text>
  <text class="e" x="16" y="420">Carbon count: 3 x C2 → C6 → C5 units → C15 → C30 → C27 (three carbons are lost from lanosterol)</text>
  <text class="e" x="16" y="440">All 27 carbons of cholesterol originate from acetyl-CoA.</text>
</svg>
