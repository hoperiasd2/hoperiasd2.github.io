<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" role="img"
     aria-label="Structure of cholesterol showing the steroid nucleus rings A to D, the C3 hydroxyl group, the C5-C6 double bond and the eight-carbon side chain at C17">
  <style>
    .b { stroke:#16191d; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .ring { font:700 19px sans-serif; fill:#003c71; }
    .num { font:600 12px monospace; fill:#16191d; }
    .lab { font:700 13px sans-serif; fill:#8a6300; }
    .sub { font:12px sans-serif; fill:#4a5159; }
    .ttl { font:700 14px sans-serif; fill:#003c71; }
    .mk { fill:none; stroke:#f2b705; stroke-width:3; }
    .lead { stroke:#8a6300; stroke-width:1.3; stroke-dasharray:4 3; fill:none; }
  </style>
  <text class="ttl" x="30" y="28">Steroid nucleus: four fused rings (A, B, C = 6-carbon; D = 5-carbon)</text>
  <text class="sub" x="30" y="48">27 carbons in total. Only the C3 hydroxyl is hydrophilic, making cholesterol amphipathic.</text>

  <path class="b" d="M60 190 L60 140 L103 115 L146 140 L146 190 L103 215 Z"/>
  <path class="b" d="M146 140 L189 115 L232 140 L232 190 L189 215 L146 190"/>
  <path class="b" d="M232 140 L275 115 L318 140 L318 190 L275 215 L232 190"/>
  <path class="b" d="M318 140 L366 122 L396 160 L366 198 L318 190"/>
  <text class="ring" x="95" y="170">A</text>
  <text class="ring" x="181" y="170">B</text>
  <text class="ring" x="267" y="170">C</text>
  <text class="ring" x="348" y="170">D</text>

  <circle class="mk" cx="60" cy="190" r="13"/>
  <path class="b" d="M60 190 L26 211"/>
  <text class="num" x="4" y="230">HO</text>
  <text class="num" x="46" y="134">3</text>
  <path class="lead" d="M58 252 L58 206"/>
  <text class="lab" x="16" y="268">C3 hydroxyl (-OH)</text>
  <text class="sub" x="16" y="286">hydrophilic group</text>

  <circle class="mk" cx="189" cy="215" r="13"/>
  <path class="b" d="M152 199 L186 218"/>
  <text class="num" x="196" y="232">5</text>
  <text class="num" x="150" y="210">6</text>
  <path class="lead" d="M196 252 L191 230"/>
  <text class="lab" x="152" y="268">C5=C6 double bond</text>
  <text class="sub" x="176" y="286">ring B</text>

  <circle class="mk" cx="366" cy="122" r="13"/>
  <path class="b" d="M366 122 L404 100 L442 122 L480 100 L518 122 L556 100"/>
  <path class="b" d="M480 100 L480 62"/>
  <path class="b" d="M556 100 L594 122"/>
  <path class="b" d="M556 100 L556 62"/>
  <text class="num" x="354" y="114">17</text>
  <path class="lead" d="M470 252 L420 160"/>
  <text class="lab" x="406" y="268">C17 side chain</text>
  <text class="sub" x="434" y="286">8 carbons</text>
</svg>
